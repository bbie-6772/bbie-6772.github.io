---
layout: default
title: 검색
permalink: /search/
memory_search: true
header_transparent: false
---
<link rel="stylesheet" href="{{ '/assets/css/memory-search.css' | relative_url }}">
<section class="memory-page">
  <header class="memory-intro">
  <h1>본문 검색</h1>
  <p>기술명이나 키워드로 본문과 코드까지 찾습니다.</p>
  </header>
  <form id="memory-search" role="search">
    <label for="memory-query">검색어</label>
    <div class="memory-query-row"><input id="memory-query" name="q" type="search" required maxlength="200" placeholder="예: Unity, RAG, 스레드"><button type="submit">본문 검색</button></div>
    <div class="memory-filters">
      <label>연도<select name="year"><option value="">모든 연도</option></select></label>
      <label>분류<select name="category"><option value="">모든 분류</option></select></label>
      <label>태그<select name="tag"><option value="">모든 태그</option></select></label>
    </div>
  </form>
  <p id="memory-status" role="status"></p>
  <ol id="memory-results" aria-label="검색 결과" aria-busy="false"></ol>
  <noscript>본문 검색에는 JavaScript가 필요합니다. <a href="{{ '/archives.html' | relative_url }}">글 목록</a>에서 찾아보세요.</noscript>
  <p class="memory-ai"><a href="{{ '/memory-guide/' | relative_url }}">AI 에이전트용 안내</a></p>
</section>
<script type="module" src="{{ '/assets/js/memory-ui.mjs' | relative_url }}"></script>
