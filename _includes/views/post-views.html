{%- if site.goatcounter -%}
<span class="post-views left-vsplit" hidden><i class="fa fa-eye"></i> <span class="post-views-count"></span></span>
<script>
  (function (el) {
    // GoatCounter caches responses (a first 404 stuck for hours), so a daily-changing end date rotates the cache key
    var end = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
    // 404 until the first view is recorded; a bare 0 reads as an unread post, so it stays hidden like other failures
    fetch('https://{{ site.goatcounter }}.goatcounter.com/counter/' + encodeURIComponent('{{ include.path }}') + '.json?end=' + end)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || d.count === '0') return;
        el.querySelector('.post-views-count').textContent = d.count;
        el.hidden = false;
      })
      .catch(function () {});
  })(document.currentScript.previousElementSibling);
</script>
{%- endif -%}
