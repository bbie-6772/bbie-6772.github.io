<div id="giscus-placeholder"></div>
<script>
  (function () {
    const giscusTheme = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';

    const script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.setAttribute('data-repo', '{{ site.giscus.repo }}');
    script.setAttribute('data-repo-id', '{{ site.giscus.repo_id }}');
    script.setAttribute('data-category', '{{ site.giscus.category }}');
    script.setAttribute('data-category-id', '{{ site.giscus.category_id }}');
    // Filename stays fixed while category renames change the URL, so pathname mapping orphans threads
    script.setAttribute('data-mapping', 'specific');
    script.setAttribute('data-term', '{{ page.path | split: "/" | last | remove: ".md" }}');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'bottom');
    script.setAttribute('data-lang', 'ko');
    script.setAttribute('data-loading', 'lazy');
    script.setAttribute('data-theme', giscusTheme());

    const placeholder = document.getElementById('giscus-placeholder');
    placeholder.parentNode.replaceChild(script, placeholder);

    new MutationObserver(() => {
      const iframe = document.querySelector('iframe.giscus-frame');
      if (iframe) {
        iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: giscusTheme() } } }, 'https://giscus.app');
      }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  })();
</script>
