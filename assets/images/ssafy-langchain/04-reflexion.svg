<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><marker id="lg4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#40556b"/></marker></defs>
<rect width="720" height="330" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">틀리고 그냥 다시 하기 vs 오답노트를 쓰고 다시 하기</text>

<rect x="36" y="68" width="148" height="62" rx="8" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="110" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6fa8">1. 시도</text>
<text x="110" y="115" text-anchor="middle" font-size="10.5" fill="#40556b">궤적을 남긴다</text>

<path d="M190 99 H214" stroke="#40556b" stroke-width="1.6" marker-end="url(#lg4)"/>

<rect x="220" y="68" width="148" height="62" rx="8" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="294" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6fa8">2. 평가</text>
<text x="294" y="115" text-anchor="middle" font-size="10.5" fill="#40556b">잘 됐는지 채점</text>

<path d="M374 99 H398" stroke="#40556b" stroke-width="1.6" marker-end="url(#lg4)"/>

<rect x="404" y="68" width="148" height="62" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/>
<text x="478" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#a04040">3. 반성</text>
<text x="478" y="115" text-anchor="middle" font-size="10.5" fill="#40556b">뭐가 틀렸는지 글로</text>

<path d="M558 99 H582" stroke="#40556b" stroke-width="1.6" marker-end="url(#lg4)"/>

<rect x="588" y="68" width="96" height="62" rx="8" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.8"/>
<text x="636" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#4f8f68">4. 재시도</text>
<text x="636" y="115" text-anchor="middle" font-size="10.5" fill="#40556b">반성문을 들고</text>

<path d="M636 136 C636 166 400 166 110 166 L110 140" stroke="#4f8f68" stroke-width="1.6" fill="none" marker-end="url(#lg4)"/>
<text x="373" y="186" text-anchor="middle" font-size="11" fill="#6b7f95">반성문이 컨텍스트에 쌓인 채로 다시 시작한다</text>

<line x1="36" y1="206" x2="684" y2="206" stroke="#d5dde6" stroke-width="1"/>

<rect x="36" y="224" width="310" height="76" rx="8" fill="#ffffff" stroke="#4f8f68" stroke-width="1.6"/>
<text x="56" y="250" font-size="11.5" font-weight="700" fill="#4f8f68">가중치를 건드리지 않는다</text>
<text x="56" y="272" font-size="11.5" fill="#40556b">학습이 아니라 컨텍스트에 메모를 남기는 것</text>
<text x="56" y="292" font-size="11.5" fill="#40556b">그래서 싸고 빠르다</text>

<rect x="366" y="224" width="318" height="76" rx="8" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="386" y="250" font-size="11.5" font-weight="700" fill="#3d6fa8">고치는 대상이 다르다</text>
<text x="386" y="272" font-size="11.5" fill="#40556b">Reflexion은 행동을 고친다 — 같은 계획, 다른 실행</text>
<text x="386" y="292" font-size="11.5" fill="#40556b">계획 재검토는 계획 자체를 고친다</text>
</svg>
