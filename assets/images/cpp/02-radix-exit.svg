<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="720" height="330" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">탈출 조건을 &quot;현재 자리가 전부 0&quot;으로 잡으면</text>
<text x="24" y="62" font-size="12.5" fill="#6b7f95">입력 [300, 100, 200] — 1의 자리가 전부 0이다</text>
<text x="140" y="99" font-size="12.5" font-weight="700" fill="#6b7f95" text-anchor="end">정렬 전</text>
<rect x="152" y="78" width="68" height="32" rx="4" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="186" y="99" font-size="14" fill="#1d3a5c" text-anchor="middle">300</text>
<rect x="226" y="78" width="68" height="32" rx="4" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="260" y="99" font-size="14" fill="#1d3a5c" text-anchor="middle">100</text>
<rect x="300" y="78" width="68" height="32" rx="4" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="334" y="99" font-size="14" fill="#1d3a5c" text-anchor="middle">200</text>
<text x="24" y="140" font-size="12.5" font-weight="700" fill="#3d6fa8">1의 자리로 분배 → 셋 다 0번 버킷으로 들어간다</text>
<text x="55" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">0</text>
<rect x="24" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="122" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">1</text>
<rect x="91" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="189" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">2</text>
<rect x="158" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="256" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">3</text>
<rect x="225" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="323" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">4</text>
<rect x="292" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="390" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">5</text>
<rect x="359" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="457" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">6</text>
<rect x="426" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="524" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">7</text>
<rect x="493" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="591" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">8</text>
<rect x="560" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="658" y="163" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">9</text>
<rect x="627" y="170" width="63" height="58" rx="6" fill="#ffffff" stroke="#d5dde6"/>
<text x="55" y="190" font-size="12" fill="#1d3a5c" text-anchor="middle">300</text>
<text x="55" y="208" font-size="12" fill="#1d3a5c" text-anchor="middle">100</text>
<text x="55" y="226" font-size="12" fill="#1d3a5c" text-anchor="middle">200</text>
<text x="24" y="252" font-size="12.5" font-weight="700" fill="#a04040">여기서 &quot;자리가 전부 0이니 끝&quot;이라고 멈추면 — 백의 자리를 아예 못 본다</text>
<text x="140" y="285" font-size="12.5" font-weight="700" fill="#6b7f95" text-anchor="end">멈춘 결과</text>
<rect x="152" y="264" width="68" height="32" rx="4" fill="#f7e9e9" stroke="#c89a9a"/>
<text x="186" y="285" font-size="14" fill="#1d3a5c" text-anchor="middle">300</text>
<rect x="226" y="264" width="68" height="32" rx="4" fill="#f7e9e9" stroke="#c89a9a"/>
<text x="260" y="285" font-size="14" fill="#1d3a5c" text-anchor="middle">100</text>
<rect x="300" y="264" width="68" height="32" rx="4" fill="#f7e9e9" stroke="#c89a9a"/>
<text x="334" y="285" font-size="14" fill="#1d3a5c" text-anchor="middle">200</text>
<text x="376" y="285" font-size="13" font-weight="700" fill="#a04040">정렬이 안 됐다</text>
</svg>