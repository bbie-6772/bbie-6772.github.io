<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">하나의 스토리를 2D와 3D MVP로 동시에 검증하는 개발 흐름</title>
  <desc id="desc">공통 스토리에서 출발해 2D와 3D MVP를 각각 만든 뒤 분위기, 재미, 몰입감을 비교하고 한 방향을 선택하는 과정</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#24164a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4b5fd"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="170" fill="#7c3aed" opacity=".12"/>
  <circle cx="145" cy="570" r="210" fill="#0ea5e9" opacity=".1"/>

  <text x="600" y="66" text-anchor="middle" fill="#f9fafb" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="32" font-weight="700">하나의 이야기, 두 개의 플레이 실험</text>
  <text x="600" y="101" text-anchor="middle" fill="#cbd5e1" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18">작게 만들고 직접 플레이한 뒤, 더 잘 전달되는 방향을 고른다</text>

  <g filter="url(#shadow)">
    <rect x="440" y="132" width="320" height="82" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="600" y="166" text-anchor="middle" fill="#e0e7ff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17">공통 출발점</text>
    <text x="600" y="194" text-anchor="middle" fill="#fff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="25" font-weight="700">같은 스토리와 하이라이트 장면</text>
  </g>

  <path d="M 540 214 C 500 250, 375 245, 330 286" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 660 214 C 700 250, 825 245, 870 286" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="105" y="292" width="430" height="154" rx="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="320" y="335" text-anchor="middle" fill="#bae6fd" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18">2D MVP</text>
    <text x="320" y="372" text-anchor="middle" fill="#fff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700">플레이하며 단서를 쌓는다</text>
    <text x="320" y="409" text-anchor="middle" fill="#e0f2fe" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18">기본 조작 · 게임 요소 · 이야기의 떡밥</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="292" width="430" height="154" rx="24" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
    <text x="880" y="335" text-anchor="middle" fill="#ddd6fe" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18">3D MVP</text>
    <text x="880" y="372" text-anchor="middle" fill="#fff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700">장면 안에서 서사를 체험한다</text>
    <text x="880" y="409" text-anchor="middle" fill="#ede9fe" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18">1인칭 시점 · 제한된 공간 · 집중된 연출</text>
  </g>

  <path d="M 320 446 C 350 488, 455 490, 500 510" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 880 446 C 850 488, 745 490, 700 510" fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="405" y="507" width="390" height="91" rx="22" fill="#18181b" stroke="#fbbf24" stroke-width="2"/>
    <text x="600" y="544" text-anchor="middle" fill="#fde68a" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18">사람이 직접 플레이하고 비교</text>
    <text x="600" y="577" text-anchor="middle" fill="#fff" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700">분위기 · 재미 · 몰입감 → 한 방향 선택</text>
  </g>
</svg>
