<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="720" height="320" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">스택 하나를 둘이 쓰면, A가 B의 복귀 주소로 점프한다</text>
<text x="24" y="58" font-size="12.5" fill="#6b7f95">스택을 공유한다고 가정했을 때 무엇이 깨지는지 보여주는 그림이다</text>

<rect x="24" y="78" width="300" height="196" rx="10" fill="#ffffff" stroke="#d5dde6"/>
<text x="174" y="102" font-size="13" font-weight="700" fill="#3d6fa8" text-anchor="middle">A와 B가 함께 쓰는 Stack 하나</text>

<rect x="48" y="116" width="252" height="52" rx="6" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="174" y="139" font-size="12.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">② B가 쌓은 bar() 복귀 주소</text>
<text x="174" y="158" font-size="11.5" font-weight="700" fill="#a04040" text-anchor="middle">지금 스택 맨 위</text>

<rect x="48" y="180" width="252" height="52" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="174" y="203" font-size="12.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">① A가 쌓은 foo() 복귀 주소</text>
<text x="174" y="222" font-size="11.5" fill="#6b7f95" text-anchor="middle">A가 꺼내려던 값은 이것이었다</text>

<text x="174" y="256" font-size="11.5" fill="#6b7f95" text-anchor="middle">쌓이는 방향 ↑ · 꺼내는 쪽은 언제나 맨 위</text>

<path d="M 300 142 L 352 142" fill="none" stroke="#a04040" stroke-width="1.8"/>
<path d="M 352 142 l -8 -4.5 l 0 9 z" fill="#a04040"/>

<rect x="360" y="78" width="336" height="196" rx="10" fill="#ffffff" stroke="#c9a0a0"/>
<text x="380" y="104" font-size="13" font-weight="700" fill="#a04040">A의 foo()가 return하는 순간</text>
<text x="380" y="130" font-size="12.5" fill="#6b7f95">A는 스택 맨 위의 값을 복귀 주소로 꺼내</text>
<text x="380" y="149" font-size="12.5" fill="#6b7f95">그 주소로 점프한다. 그런데 맨 위에 있는 건</text>
<text x="380" y="168" font-size="12.5" font-weight="700" fill="#1d3a5c">B의 bar() 복귀 주소다</text>
<text x="380" y="196" font-size="12.5" font-weight="700" fill="#a04040">→ A의 실행 흐름이 B의 코드로 튄다</text>
<text x="380" y="226" font-size="12.5" fill="#6b7f95">스택은 LIFO라 실행 흐름 하나만 감당한다.</text>
<text x="380" y="245" font-size="12.5" fill="#6b7f95">그래서 흐름 수만큼 스택이 필요하다</text>

<text x="24" y="300" font-size="12.5" font-weight="700" fill="#1d3a5c">&quot;스레드 = 실행의 단위&quot;와 &quot;스택은 스레드마다 하나&quot;는 결국 같은 문장이다</text>
</svg>
