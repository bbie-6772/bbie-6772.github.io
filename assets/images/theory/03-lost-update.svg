<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="720" height="330" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">10씩 두 번 깎았는데 20이 아니라 10만 깎였다</text>
<text x="24" y="58" font-size="12.5" fill="#6b7f95">gold -= 10 은 읽기 → 계산 → 쓰기 세 걸음이고, 그 사이에 다른 Thread가 끼어든다</text>

<text x="86" y="90" font-size="12.5" font-weight="700" fill="#6b7f95" text-anchor="middle">시간 →</text>
<line x1="150" y1="82" x2="672" y2="82" stroke="#d5dde6" stroke-width="1.5"/>

<text x="86" y="132" font-size="13.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Thread A</text>
<rect x="150" y="108" width="140" height="40" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="220" y="133" font-size="12.5" fill="#1d3a5c" text-anchor="middle">100을 읽음</text>
<rect x="310" y="108" width="140" height="40" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="380" y="133" font-size="12.5" fill="#1d3a5c" text-anchor="middle">100 - 10 = 90</text>
<rect x="470" y="108" width="140" height="40" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="540" y="133" font-size="12.5" fill="#1d3a5c" text-anchor="middle">90을 씀</text>

<text x="86" y="212" font-size="13.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Thread B</text>
<rect x="230" y="188" width="140" height="40" rx="6" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="300" y="213" font-size="12.5" fill="#1d3a5c" text-anchor="middle">100을 읽음</text>
<rect x="390" y="188" width="140" height="40" rx="6" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="460" y="213" font-size="12.5" fill="#1d3a5c" text-anchor="middle">100 - 10 = 90</text>
<rect x="550" y="188" width="140" height="40" rx="6" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="620" y="213" font-size="12.5" fill="#1d3a5c" text-anchor="middle">90을 씀</text>

<text x="300" y="180" font-size="11.5" font-weight="700" fill="#a04040" text-anchor="middle">A가 아직 안 썼는데 읽는다</text>

<rect x="24" y="252" width="330" height="56" rx="8" fill="#ffffff" stroke="#a8c39c"/>
<text x="189" y="277" font-size="12.5" font-weight="700" fill="#6b7f95" text-anchor="middle">기대한 결과</text>
<text x="189" y="298" font-size="15" font-weight="700" fill="#1d3a5c" text-anchor="middle">gold = 80</text>

<rect x="366" y="252" width="330" height="56" rx="8" fill="#ffffff" stroke="#c9a0a0"/>
<text x="531" y="277" font-size="12.5" font-weight="700" fill="#a04040" text-anchor="middle">실제로 나온 결과 — Lost Update</text>
<text x="531" y="298" font-size="15" font-weight="700" fill="#a04040" text-anchor="middle">gold = 90</text>
</svg>
