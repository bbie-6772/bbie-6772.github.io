<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a04040"/></marker>
<marker id="d2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3d6fa8"/></marker>
</defs>
<rect x="0" y="0" width="720" height="356" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">바뀌는 것은 인터페이스의 유무가 아니라 화살표의 방향</text>
<text x="24" y="58" font-size="12.5" fill="#6b7f95">소스 코드 의존이 어디를 향하는가 — 개념도</text>

<text x="40" y="100" font-size="12.5" font-weight="700" fill="#a04040">고수준이 저수준 이름을 직접 안다</text>
<rect x="40" y="114" width="230" height="40" rx="6" fill="#faeded" stroke="#a04040"/>
<text x="155" y="139" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">Dragon (고수준 정책)</text>
<path d="M155,158 L155,206" stroke="#a04040" stroke-width="2" marker-end="url(#d1)"/>
<rect x="40" y="210" width="230" height="40" rx="6" fill="#ffffff" stroke="#a04040"/>
<text x="155" y="235" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">RealSoundSystem (저수준 구현)</text>
<text x="40" y="286" font-size="12.5" fill="#6b7f95">Dragon이 구현 이름을 알고 있다</text>
<text x="40" y="306" font-size="12.5" fill="#6b7f95">구현을 갈아끼우려면 Dragon을 고쳐야 한다</text>

<line x1="360" y1="88" x2="360" y2="322" stroke="#d5dde6" stroke-width="1"/>

<text x="450" y="100" font-size="12.5" font-weight="700" fill="#3d6fa8">양쪽이 가운데 추상을 향한다</text>
<rect x="450" y="114" width="230" height="40" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="565" y="139" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">Dragon (고수준 정책)</text>
<path d="M565,158 L565,192" stroke="#3d6fa8" stroke-width="2" marker-end="url(#d2)"/>
<rect x="450" y="196" width="230" height="40" rx="6" fill="#ffffff" stroke="#3d6fa8" stroke-width="2"/>
<text x="565" y="221" font-size="13" font-weight="700" fill="#3d6fa8" text-anchor="middle">ISoundPlayer (추상)</text>
<path d="M565,274 L565,240" stroke="#3d6fa8" stroke-width="2" marker-end="url(#d2)"/>
<rect x="450" y="278" width="230" height="40" rx="6" fill="#ffffff" stroke="#8fb0d4"/>
<text x="565" y="303" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">RealSoundSystem (저수준 구현)</text>
<text x="400" y="180" font-size="12" fill="#6b7f95">의존</text>
<text x="400" y="262" font-size="12" fill="#6b7f95">구현</text>
</svg>
