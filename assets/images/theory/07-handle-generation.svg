<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="720" height="330" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">자리 번호만 들고 있으면, 그 자리에 들어온 새 손님을 붙잡는다</text>
<text x="24" y="58" font-size="12.5" fill="#6b7f95">풀에서 슬롯을 재사용할 때 생기는 문제와, 번호표에 세대를 붙여 막는 법</text>

<text x="24" y="92" font-size="12.5" font-weight="700" fill="#a04040">번호만 쓸 때</text>
<rect x="24" y="104" width="200" height="52" rx="8" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="124" y="126" font-size="12.5" fill="#6b7f95" text-anchor="middle">예전에 받아둔 번호표</text>
<text x="124" y="146" font-size="14" font-weight="700" fill="#1d3a5c" text-anchor="middle">index = 7</text>

<text x="266" y="136" font-size="20" fill="#6b7f95">→</text>

<rect x="300" y="104" width="180" height="52" rx="8" fill="#ffffff" stroke="#d5dde6"/>
<text x="390" y="126" font-size="12.5" fill="#6b7f95" text-anchor="middle">7번 자리에 지금 있는 것</text>
<text x="390" y="146" font-size="14" font-weight="700" fill="#1d3a5c" text-anchor="middle">새로 태어난 좀비</text>

<text x="510" y="136" font-size="12.5" font-weight="700" fill="#a04040">번호가 맞으니 통과된다</text>

<line x1="24" y1="182" x2="696" y2="182" stroke="#d5dde6"/>

<text x="24" y="210" font-size="12.5" font-weight="700" fill="#3d6fa8">번호에 세대를 붙일 때</text>
<rect x="24" y="222" width="200" height="52" rx="8" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="124" y="244" font-size="12.5" fill="#6b7f95" text-anchor="middle">예전에 받아둔 번호표</text>
<text x="124" y="264" font-size="14" font-weight="700" fill="#1d3a5c" text-anchor="middle">index = 7, gen = 2</text>

<text x="266" y="254" font-size="20" fill="#6b7f95">→</text>

<rect x="300" y="222" width="180" height="52" rx="8" fill="#ffffff" stroke="#8fb0d4"/>
<text x="390" y="244" font-size="12.5" fill="#6b7f95" text-anchor="middle">7번 자리의 현재 세대</text>
<text x="390" y="264" font-size="14" font-weight="700" fill="#1d3a5c" text-anchor="middle">gen = 3</text>

<text x="510" y="246" font-size="12.5" font-weight="700" fill="#3d6fa8">2 와 3 이 다르다</text>
<text x="510" y="266" font-size="12.5" fill="#6b7f95">낡은 번호표로 판정하고 막는다</text>

<text x="24" y="308" font-size="12.5" font-weight="700" fill="#1d3a5c">자리를 비울 때마다 세대를 하나 올린다. 그것만으로 옛 번호표가 스스로 무효가 된다</text>
</svg>
