<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3d6fa8"/></marker>
<marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a04040"/></marker>
</defs>
<rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">p 를 nullptr 로 바꿔도 q 는 그대로 남는다</text>

<text x="24" y="66" font-size="12.5" font-weight="700" fill="#3d6fa8">1. 주소를 복사한 직후 — 두 포인터가 같은 객체를 본다</text>
<rect x="24" y="80" width="120" height="38" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="84" y="104" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">p</text>
<rect x="24" y="128" width="120" height="38" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="84" y="152" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">q</text>
<rect x="290" y="98" width="170" height="50" rx="8" fill="#ffffff" stroke="#8fb0d4"/>
<text x="375" y="129" font-size="13.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Player 객체</text>
<path d="M148,99 L285,118" stroke="#3d6fa8" stroke-width="2" marker-end="url(#a1)"/>
<path d="M148,147 L285,130" stroke="#3d6fa8" stroke-width="2" marker-end="url(#a1)"/>
<text x="500" y="118" font-size="12.5" fill="#6b7f95">q 는 p 의 주소가 아니라</text>
<text x="500" y="136" font-size="12.5" fill="#6b7f95">p 가 들고 있던 값을 복사했다</text>

<line x1="24" y1="188" x2="696" y2="188" stroke="#d5dde6"/>

<text x="24" y="214" font-size="12.5" font-weight="700" fill="#a04040">2. delete p 이후 — 객체는 사라졌는데 주소값은 둘 다 남아 있다</text>
<rect x="24" y="228" width="120" height="38" rx="6" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="84" y="252" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">p = nullptr</text>
<rect x="24" y="276" width="120" height="38" rx="6" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="84" y="300" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">q</text>
<rect x="290" y="252" width="170" height="50" rx="8" fill="#f7f9fb" stroke="#c9a0a0" stroke-dasharray="5 4"/>
<text x="375" y="283" font-size="13" fill="#a04040" text-anchor="middle">해제된 자리</text>
<path d="M148,295 L285,283" stroke="#a04040" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<text x="500" y="272" font-size="12.5" font-weight="700" fill="#a04040">q 가 Dangling Pointer</text>
<text x="500" y="292" font-size="12.5" fill="#6b7f95">q != nullptr 은 여전히 참이다</text>
</svg>
