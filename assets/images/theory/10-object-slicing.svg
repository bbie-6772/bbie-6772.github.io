<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="s1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3d6fa8"/></marker>
<marker id="s2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a04040"/></marker>
</defs>
<rect x="0" y="0" width="720" height="392" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">가리키면 잘리지 않고, 값으로 담으면 잘린다</text>
<text x="24" y="58" font-size="12.5" fill="#6b7f95">Slime slime;  Monster* p = &amp;slime;  Monster v = slime;  — 개념도</text>

<text x="24" y="96" font-size="12.5" font-weight="700" fill="#3d6fa8">Monster* p = &amp;slime; — 새 객체를 만들지 않는다</text>
<rect x="24" y="110" width="120" height="40" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="84" y="135" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">p (Monster*)</text>
<path d="M148,130 L295,130" stroke="#3d6fa8" stroke-width="2" marker-end="url(#s1)"/>
<rect x="300" y="98" width="200" height="64" rx="8" fill="#ffffff" stroke="#8fb0d4"/>
<rect x="300" y="98" width="200" height="32" rx="8" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="400" y="119" font-size="12.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Monster 부분</text>
<text x="400" y="151" font-size="12.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Slime 고유 부분</text>
<text x="516" y="122" font-size="12.5" fill="#6b7f95">원래 slime 객체 그대로</text>
<text x="516" y="140" font-size="12.5" fill="#6b7f95">p-&gt;Attack() → Slime::Attack()</text>

<text x="24" y="212" font-size="12.5" font-weight="700" fill="#a04040">Monster v = slime; — 이 줄에서 Monster 객체가 새로 만들어진다</text>
<rect x="24" y="226" width="120" height="40" rx="6" fill="#faeded" stroke="#a04040"/>
<text x="84" y="251" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">v (Monster)</text>
<path d="M148,246 L295,246" stroke="#a04040" stroke-width="2" marker-end="url(#s2)"/>
<rect x="300" y="230" width="200" height="32" rx="8" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="400" y="251" font-size="12.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Monster 부분만 복사</text>
<rect x="300" y="266" width="200" height="30" rx="8" fill="#ffffff" stroke="#d5dde6" stroke-dasharray="5 4"/>
<text x="400" y="286" font-size="12.5" fill="#6b7f95" text-anchor="middle">Slime 고유 부분 — 잘려나감</text>
<text x="516" y="248" font-size="12.5" fill="#6b7f95">v.Attack() → Monster::Attack()</text>
<text x="516" y="266" font-size="12.5" fill="#6b7f95">다형성이 여기서 끊긴다</text>

<rect x="24" y="320" width="672" height="48" rx="8" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="44" y="349" font-size="13" fill="#1d3a5c">기준은 상속 관계가 아니라 &quot;이 줄에서 새 객체를 만드는가&quot;다. 포인터·레퍼런스는 이름만 늘고, 값 대입은 객체를 새로 만든다.</text>
</svg>
