<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#3d6fa8"/></marker>
  </defs>
  <rect width="720" height="330" fill="#f7f9fb"/>
  <g font-size="14" fill="#1d3a5c">
    <rect x="24" y="24" width="672" height="44" rx="8" fill="#fff" stroke="#d5dde6"/>
    <text x="360" y="51" text-anchor="middle">요소의 값이 바뀐다 ( 글자, 크기, 색 ) → 그 요소가 dirty로 등록된다</text>

    <rect x="24" y="96" width="672" height="100" rx="8" fill="#fff" stroke="#3d6fa8" stroke-width="2"/>
    <text x="44" y="122" font-weight="700" fill="#3d6fa8">C# 층 · 바뀐 요소만</text>
    <text x="44" y="148">Layout rebuild: 크기와 위치를 다시 계산 ( 부모부터 )</text>
    <text x="44" y="174">Graphic rebuild: 그 요소의 메시나 재질을 다시 만든다</text>
    <text x="676" y="122" text-anchor="end" font-size="12" fill="#6b7f95">Canvas.SendWillRenderCanvases</text>

    <rect x="24" y="224" width="672" height="80" rx="8" fill="#fff" stroke="#a04040" stroke-width="2"/>
    <text x="44" y="250" font-weight="700" fill="#a04040">C++ 층 · Canvas 안 전부</text>
    <text x="44" y="278">batch build: 모든 요소를 깊이순으로 정렬하고 다시 합친다</text>
    <text x="676" y="250" text-anchor="end" font-size="12" fill="#6b7f95">Canvas.BuildBatch</text>
  </g>
  <path d="M360 70V92" stroke="#3d6fa8" stroke-width="2" marker-end="url(#d)"/>
  <path d="M360 198V220" stroke="#3d6fa8" stroke-width="2" marker-end="url(#d)"/>
</svg>
