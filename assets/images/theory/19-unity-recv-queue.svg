<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img" aria-label="수신 스레드는 받은 패킷을 ConcurrentQueue에 넣기만 하고, 메인 스레드가 Update에서 TryDequeue로 꺼내 Transform에 적용한다. 수신 스레드가 Transform을 직접 바꾸면 예외가 난다">
  <style>
    .bg { fill: #f7f9fb; }
    .t { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d3a5c; }
    .sub { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b7f95; }
    .m { font-family: "Cascadia Mono", Consolas, monospace; fill: #1d3a5c; }
    .c { fill: #ffffff; stroke: #d5dde6; }
    .hit { fill: #dce7f4; stroke: #3d6fa8; stroke-width: 1.5; }
    .r { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #a04040; }
  </style>
  <defs>
    <marker id="a19" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d6fa8"/></marker>
    <marker id="r19" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a04040"/></marker>
  </defs>

  <rect class="bg" width="720" height="250" rx="10"/>
  <text class="t" x="24" y="34" font-size="16" font-weight="600">받는 건 아무 스레드, 만지는 건 메인 스레드</text>
  <text class="sub" x="24" y="56" font-size="13">두 스레드 사이에는 스레드 안전 큐 하나만 둔다</text>

  <rect class="c" x="30" y="110" width="130" height="50" rx="6"/><text class="t" x="95" y="132" font-size="13" text-anchor="middle">수신 스레드</text><text class="m" x="95" y="150" font-size="11" text-anchor="middle">Enqueue</text>
  <rect class="hit" x="200" y="110" width="160" height="50" rx="6"/><text class="m" x="280" y="140" font-size="12" text-anchor="middle">ConcurrentQueue</text>
  <rect class="c" x="400" y="110" width="140" height="50" rx="6"/><text class="t" x="470" y="132" font-size="13" text-anchor="middle">메인 스레드</text><text class="m" x="470" y="150" font-size="11" text-anchor="middle">Update · TryDequeue</text>
  <rect class="c" x="580" y="110" width="110" height="50" rx="6"/><text class="m" x="635" y="140" font-size="12" text-anchor="middle">Transform</text>
  <line x1="160" y1="135" x2="196" y2="135" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a19)"/>
  <line x1="360" y1="135" x2="396" y2="135" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a19)"/>
  <line x1="540" y1="135" x2="576" y2="135" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a19)"/>

  <path d="M95 160 C 95 220, 635 220, 635 164" fill="none" stroke="#a04040" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r19)"/>
  <text class="r" x="365" y="232" font-size="12" text-anchor="middle">직접 바꾸면 예외 — 엔진 객체는 메인 스레드 전용</text>
</svg>
