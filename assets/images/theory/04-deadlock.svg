<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#a04040"/>
</marker>
</defs>
<rect x="0" y="0" width="720" height="320" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">서로가 가진 걸 기다리면 둘 다 영원히 못 간다</text>
<text x="24" y="58" font-size="12.5" fill="#6b7f95">Deadlock — 아무도 잘못한 코드를 쓰지 않았는데 게임이 멈춘다</text>

<rect x="60" y="86" width="180" height="70" rx="8" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="150" y="114" font-size="13.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Thread A</text>
<text x="150" y="137" font-size="12.5" fill="#6b7f95" text-anchor="middle">Lock A 를 잡고 있음</text>

<rect x="480" y="86" width="180" height="70" rx="8" fill="#f2e6e6" stroke="#c9a0a0"/>
<text x="570" y="114" font-size="13.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Thread B</text>
<text x="570" y="137" font-size="12.5" fill="#6b7f95" text-anchor="middle">Lock B 를 잡고 있음</text>

<rect x="60" y="196" width="180" height="60" rx="8" fill="#ffffff" stroke="#d5dde6"/>
<text x="150" y="232" font-size="13.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Lock A</text>

<rect x="480" y="196" width="180" height="60" rx="8" fill="#ffffff" stroke="#d5dde6"/>
<text x="570" y="232" font-size="13.5" font-weight="700" fill="#1d3a5c" text-anchor="middle">Lock B</text>

<path d="M240,112 L470,220" stroke="#a04040" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>
<path d="M480,130 L250,226" stroke="#a04040" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>

<text x="360" y="150" font-size="12" font-weight="700" fill="#a04040" text-anchor="middle">A는 Lock B 를 기다린다</text>
<text x="360" y="196" font-size="12" font-weight="700" fill="#a04040" text-anchor="middle">B는 Lock A 를 기다린다</text>

<text x="24" y="292" font-size="12.5" font-weight="700" fill="#3d6fa8">예방법 하나 — 잠그는 순서를 팀 전체가 하나로 통일한다. 항상 A 다음 B 라면 이 그림은 만들어지지 않는다</text>
</svg>
