<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="o1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3d6fa8"/></marker>
<marker id="o2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7f95"/></marker>
</defs>
<rect x="0" y="0" width="720" height="330" rx="12" fill="#f7f9fb"/>
<text x="24" y="36" font-size="17" font-weight="700" fill="#1d3a5c">누가 치울 책임을 지는지를 타입으로 말한다</text>
<text x="24" y="58" font-size="12.5" fill="#6b7f95">화살표가 굵으면 소유, 점선이면 보기만 하는 것</text>

<rect x="24" y="80" width="212" height="200" rx="10" fill="#ffffff" stroke="#d5dde6"/>
<text x="130" y="108" font-size="14" font-weight="700" fill="#3d6fa8" text-anchor="middle">unique_ptr</text>
<text x="130" y="128" font-size="12" fill="#6b7f95" text-anchor="middle">주인이 딱 하나</text>
<rect x="52" y="146" width="72" height="34" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="88" y="168" font-size="12.5" fill="#1d3a5c" text-anchor="middle">소유자</text>
<rect x="146" y="146" width="66" height="34" rx="6" fill="#ffffff" stroke="#8fb0d4"/>
<text x="179" y="168" font-size="12.5" fill="#1d3a5c" text-anchor="middle">객체</text>
<path d="M128,163 L141,163" stroke="#3d6fa8" stroke-width="3" marker-end="url(#o1)"/>
<text x="130" y="212" font-size="12" fill="#6b7f95" text-anchor="middle">복사 금지 · move 로만 넘김</text>
<text x="130" y="238" font-size="12" font-weight="700" fill="#a04040" text-anchor="middle">넘기고 나면 원본은</text>
<text x="130" y="256" font-size="12" font-weight="700" fill="#a04040" text-anchor="middle">사라지는 게 아니라 비어 있다</text>

<rect x="254" y="80" width="212" height="200" rx="10" fill="#ffffff" stroke="#d5dde6"/>
<text x="360" y="108" font-size="14" font-weight="700" fill="#3d6fa8" text-anchor="middle">shared_ptr</text>
<text x="360" y="128" font-size="12" fill="#6b7f95" text-anchor="middle">주인이 여럿</text>
<rect x="272" y="140" width="66" height="30" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="305" y="160" font-size="12.5" fill="#1d3a5c" text-anchor="middle">소유자</text>
<rect x="272" y="176" width="66" height="30" rx="6" fill="#eaf1f9" stroke="#8fb0d4"/>
<text x="305" y="196" font-size="12.5" fill="#1d3a5c" text-anchor="middle">소유자</text>
<rect x="378" y="158" width="66" height="34" rx="6" fill="#ffffff" stroke="#8fb0d4"/>
<text x="411" y="180" font-size="12.5" fill="#1d3a5c" text-anchor="middle">객체</text>
<path d="M342,157 L373,171" stroke="#3d6fa8" stroke-width="3" marker-end="url(#o1)"/>
<path d="M342,191 L373,180" stroke="#3d6fa8" stroke-width="3" marker-end="url(#o1)"/>
<text x="360" y="228" font-size="12" fill="#6b7f95" text-anchor="middle">세는 값이 0이 될 때 해제</text>
<text x="360" y="254" font-size="12" font-weight="700" fill="#a04040" text-anchor="middle">서로 소유하면 0이 안 된다</text>

<rect x="484" y="80" width="212" height="200" rx="10" fill="#ffffff" stroke="#d5dde6"/>
<text x="590" y="108" font-size="14" font-weight="700" fill="#3d6fa8" text-anchor="middle">weak_ptr</text>
<text x="590" y="128" font-size="12" fill="#6b7f95" text-anchor="middle">주인은 아니고 구경만</text>
<rect x="512" y="146" width="72" height="34" rx="6" fill="#f7f9fb" stroke="#d5dde6"/>
<text x="548" y="168" font-size="12.5" fill="#6b7f95" text-anchor="middle">관찰자</text>
<rect x="606" y="146" width="66" height="34" rx="6" fill="#ffffff" stroke="#8fb0d4"/>
<text x="639" y="168" font-size="12.5" fill="#1d3a5c" text-anchor="middle">객체</text>
<path d="M588,163 L601,163" stroke="#6b7f95" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#o2)"/>
<text x="590" y="212" font-size="12" fill="#6b7f95" text-anchor="middle">세는 값을 올리지 않는다</text>
<text x="590" y="238" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">그래서 순환을 끊는 데</text>
<text x="590" y="256" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">쓸 수 있다</text>

<text x="24" y="308" font-size="12.5" font-weight="700" fill="#1d3a5c">고르는 기준은 성능이 아니라 "이 객체를 치울 책임이 어디에 있는가" 하나다</text>
</svg>
