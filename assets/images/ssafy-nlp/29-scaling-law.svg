<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="342" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">규모의 법칙 — 키우면 예측 가능하게 좋아진다</text><rect x="36" y="70" width="206" height="186" rx="10" fill="#fff" stroke="#d8e2ec" stroke-width="1.5"/><text x="139" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">계산량 (Compute)</text><line x1="70" y1="232" x2="220" y2="232" stroke="#5b7a99" stroke-width="1.5"/><line x1="70" y1="232" x2="70" y2="114" stroke="#5b7a99" stroke-width="1.5"/><line x1="74" y1="120" x2="220" y2="218" stroke="#3f6ea5" stroke-width="3" stroke-linecap="round"/><text x="64" y="116" text-anchor="end" font-size="10.5" font-weight="400" fill="#5b7a99">Loss</text><rect x="260" y="70" width="206" height="186" rx="10" fill="#fff" stroke="#d8e2ec" stroke-width="1.5"/><text x="363" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">데이터 크기 (Dataset)</text><line x1="294" y1="232" x2="444" y2="232" stroke="#5b7a99" stroke-width="1.5"/><line x1="294" y1="232" x2="294" y2="114" stroke="#5b7a99" stroke-width="1.5"/><line x1="298" y1="120" x2="444" y2="218" stroke="#4f8f68" stroke-width="3" stroke-linecap="round"/><text x="288" y="116" text-anchor="end" font-size="10.5" font-weight="400" fill="#5b7a99">Loss</text><rect x="484" y="70" width="206" height="186" rx="10" fill="#fff" stroke="#d8e2ec" stroke-width="1.5"/><text x="587" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">모델 크기 (Parameters)</text><line x1="518" y1="232" x2="668" y2="232" stroke="#5b7a99" stroke-width="1.5"/><line x1="518" y1="232" x2="518" y2="114" stroke="#5b7a99" stroke-width="1.5"/><line x1="522" y1="120" x2="668" y2="218" stroke="#c2703c" stroke-width="3" stroke-linecap="round"/><text x="512" y="116" text-anchor="end" font-size="10.5" font-weight="400" fill="#5b7a99">Loss</text><text x="360" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#40556b">세 축 모두 로그 스케일에서 깨끗한 직선(멱법칙)으로 감소</text><text x="360" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">→ 학습 전에 성능을 미리 계산할 수 있게 됐다</text></svg>