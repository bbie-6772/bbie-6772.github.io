<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="358" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Transformer를 어떻게 잘라 쓰느냐로 갈린다</text><rect x="40" y="76" width="200" height="228" rx="12" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><rect x="40" y="76" width="200" height="44" rx="12" fill="#3d6fa8" opacity="0.15"/><text x="140" y="104" text-anchor="middle" font-size="14" fill="#3d6fa8">인코더만</text><text x="140" y="152" text-anchor="middle" font-size="22" fill="#1d3a5c">BERT</text><text x="140" y="188" text-anchor="middle" font-size="12.5" fill="#1d3a5c">앞뒤 문맥을 모두 본다</text><text x="140" y="216" text-anchor="middle" font-size="12" fill="#5b7a99">이해하는 일에 강하다</text><line x1="60" y1="234" x2="220" y2="234" stroke="#c8d4e0"/><text x="140" y="258" text-anchor="middle" font-size="12" fill="#3d6fa8">잘하는 일</text><text x="140" y="280" text-anchor="middle" font-size="12" fill="#1d3a5c">분류</text><text x="140" y="298" text-anchor="middle" font-size="12" fill="#1d3a5c">개체명 인식</text><text x="140" y="316" text-anchor="middle" font-size="12" fill="#1d3a5c">질의응답</text><rect x="264" y="76" width="200" height="228" rx="12" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="264" y="76" width="200" height="44" rx="12" fill="#4f8f68" opacity="0.15"/><text x="364" y="104" text-anchor="middle" font-size="14" fill="#4f8f68">인코더+디코더</text><text x="364" y="152" text-anchor="middle" font-size="22" fill="#1d3a5c">T5</text><text x="364" y="188" text-anchor="middle" font-size="12.5" fill="#1d3a5c">읽고 나서 쓴다</text><text x="364" y="216" text-anchor="middle" font-size="12" fill="#5b7a99">입력과 출력이 모두 문장</text><line x1="284" y1="234" x2="444" y2="234" stroke="#c8d4e0"/><text x="364" y="258" text-anchor="middle" font-size="12" fill="#4f8f68">잘하는 일</text><text x="364" y="280" text-anchor="middle" font-size="12" fill="#1d3a5c">번역</text><text x="364" y="298" text-anchor="middle" font-size="12" fill="#1d3a5c">요약</text><rect x="488" y="76" width="200" height="228" rx="12" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="488" y="76" width="200" height="44" rx="12" fill="#c2703c" opacity="0.15"/><text x="588" y="104" text-anchor="middle" font-size="14" fill="#c2703c">디코더만</text><text x="588" y="152" text-anchor="middle" font-size="22" fill="#1d3a5c">GPT</text><text x="588" y="188" text-anchor="middle" font-size="12.5" fill="#1d3a5c">앞쪽만 보고 다음을 쓴다</text><text x="588" y="216" text-anchor="middle" font-size="12" fill="#5b7a99">생성하는 일에 강하다</text><line x1="508" y1="234" x2="668" y2="234" stroke="#c8d4e0"/><text x="588" y="258" text-anchor="middle" font-size="12" fill="#c2703c">잘하는 일</text><text x="588" y="280" text-anchor="middle" font-size="12" fill="#1d3a5c">대화</text><text x="588" y="298" text-anchor="middle" font-size="12" fill="#1d3a5c">글쓰기</text><text x="588" y="316" text-anchor="middle" font-size="12" fill="#1d3a5c">코드</text><text x="360.0" y="338" text-anchor="middle" font-size="13.5" fill="#40556b">구조를 새로 만든 게 아니라, 같은 재료에서 필요한 부분만 떼어 쓴 것이다</text></svg>