<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="326" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">창발성 — 특정 규모를 넘으면 갑자기 나타난다</text><line x1="90" y1="250" x2="630" y2="250" stroke="#5b7a99" stroke-width="1.5"/><line x1="90" y1="250" x2="90" y2="90" stroke="#5b7a99" stroke-width="1.5"/><text x="82" y="100" text-anchor="end" font-size="11" font-weight="400" fill="#5b7a99">능력</text><text x="630" y="270" text-anchor="end" font-size="11" font-weight="400" fill="#5b7a99">모델 크기 →</text><path d="M100,244 L390,236 Q450,232 490,160 T610,110" fill="none" stroke="#c2703c" stroke-width="3.5" stroke-linecap="round"/><line x1="450" y1="250" x2="450" y2="90" stroke="#c0504d" stroke-width="1.6" stroke-dasharray="5 4"/><text x="450" y="84" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0504d">임계 규모</text><text x="240" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#5b7a99">작은 모델: 능력 거의 없음</text><text x="560" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2703c">툭 튀어나옴</text><text x="360" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#40556b">인-컨텍스트 학습 · 추론 능력이 대표적. 서서히가 아니라 갑자기다</text></svg>