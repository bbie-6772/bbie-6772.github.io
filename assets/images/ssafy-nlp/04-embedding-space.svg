<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="356" rx="12" fill="#f7f9fb"/><rect x="70" y="56" width="580" height="250" fill="#fff" stroke="#c8d4e0"/><text x="360" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">학습이 끝나면 비슷한 단어끼리 가까이 모인다</text><ellipse cx="182" cy="134" rx="78" ry="52" fill="#3d6fa8" opacity="0.10"/><circle cx="163" cy="126" r="5" fill="#3d6fa8"/><text x="163" y="115" text-anchor="middle" font-size="13" fill="#1d3a5c">사과</text><circle cx="209" cy="106" r="5" fill="#3d6fa8"/><text x="209" y="95" text-anchor="middle" font-size="13" fill="#1d3a5c">배</text><circle cx="128" cy="154" r="5" fill="#3d6fa8"/><text x="128" y="142" text-anchor="middle" font-size="13" fill="#1d3a5c">포도</text><circle cx="227" cy="148" r="5" fill="#3d6fa8"/><text x="227" y="138" text-anchor="middle" font-size="13" fill="#1d3a5c">딸기</text><text x="182" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">과일</text><ellipse cx="473" cy="117" rx="78" ry="52" fill="#c2703c" opacity="0.10"/><circle cx="430" cy="121" r="5" fill="#c2703c"/><text x="430" y="110" text-anchor="middle" font-size="13" fill="#1d3a5c">축구</text><circle cx="488" cy="141" r="5" fill="#c2703c"/><text x="488" y="130" text-anchor="middle" font-size="13" fill="#1d3a5c">야구</text><circle cx="453" cy="96" r="5" fill="#c2703c"/><text x="453" y="85" text-anchor="middle" font-size="13" fill="#1d3a5c">농구</text><circle cx="522" cy="108" r="5" fill="#c2703c"/><text x="522" y="98" text-anchor="middle" font-size="13" fill="#1d3a5c">배구</text><text x="473" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2703c">운동</text><ellipse cx="331" cy="234" rx="78" ry="52" fill="#4f8f68" opacity="0.10"/><circle cx="325" cy="246" r="5" fill="#4f8f68"/><text x="325" y="235" text-anchor="middle" font-size="13" fill="#1d3a5c">버스</text><circle cx="3