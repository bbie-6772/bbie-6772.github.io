<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="284" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">CLIP — 글과 그림을 같은 공간에 놓는다</text><rect x="70" y="74" width="150" height="44" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><text x="145" y="101" text-anchor="middle" font-size="12" font-weight="400" fill="#3f6ea5">이미지 Encoder</text><rect x="70" y="150" width="150" height="44" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="145" y="177" text-anchor="middle" font-size="12" font-weight="400" fill="#4f8f68">텍스트 Encoder</text><defs><marker id="m19" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="222" y1="96" x2="300" y2="120" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m19)"/><defs><marker id="m20" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="222" y1="172" x2="300" y2="148" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m20)"/><circle cx="380" cy="134" r="58" fill="#eef4fa" stroke="#5b7a99" stroke-dasharray="4 4"/><text x="380" y="120" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b7a99">공동 벡터</text><text x="380" y="138" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b7a99">공간</text><circle cx="360" cy="158" r="4" fill="#3f6ea5"/><circle cx="372" cy="162" r="4" fill="#4f8f68"/><text x="456" y="110" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">맞는 이미지-문장 쌍</text><text x="456" y="130" text-anchor="700" font-size="12" font-weight="400" fill="#4f8f68">→ 가까워지게</text><text x="456" y="158" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">틀린 쌍</text><text x="456" y="178" text-anchor="700" font-size="12" font-weight="400" fill="#c0504d">→ 멀어지게 (대조학습)</text><rect x="40" y="214" width="640" height="52" rx="10" fill="#eef4fa" stroke="#c2703c" stroke-width="1.5"/><text x="360" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2703c">CLIP 자체는 그림을 그리는 모델이 아니다</text><text x="360" y="255" text-anchor="middle" font-size="12" font-weight="400" fill="#40556b">글과 그림이 얼마나 맞는지 잇고 비교하는 멀티모달 다리</text></svg>