<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="428" rx="12" fill="#f7f9fb"/><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2703c"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">BERT의 학습법 — 가려놓고 맞히게 한다</text><rect x="140" y="104" width="100" height="42" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="190.0" y="130.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">오늘</text><rect x="258" y="104" width="100" height="42" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="308.0" y="130.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">[가림]</text><rect x="376" y="104" width="100" height="42" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="426.0" y="130.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">정말</text><rect x="494" y="104" width="100" height="42" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="544.0" y="130.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">맛있었다</text><path d="M308.0 98 L308.0 70" stroke="#c2703c" stroke-width="2.4" marker-end="url(#ar0)"/><text x="308.0" y="64" text-anchor="middle" font-size="13" fill="#c2703c">여기에 뭐가 들어갈까?</text><text x="250" y="202" text-anchor="end" font-size="13" fill="#1d3a5c">점심이</text><rect x="262" y="188" width="260" height="20" rx="4" fill="#eef2f7"/><rect x="262" y="188" width="135" height="20" rx="4" fill="#3d6fa8"/><text x="534" y="202" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.52</text><text x="250" y="234" text-anchor="end" font-size="13" fill="#1d3a5c">저녁이</text><rect x="262" y="220" width="260" height="20" rx="4" fill="#eef2f7"/><rect x="262" y="220" width="62" height="20" rx="4" fill="#3d6fa8"/><text x="534" y="234" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.24</text><text x="250" y="266" text-anchor="end" font-size="13" fill="#1d3a5c">커피가</text><rect x="262" y="252" width="260" height="20" rx="4" fill="#eef2f7"/><rect x="262" y="252" width="29" height="20" rx="4" fill="#3d6fa8"/><text x="534" y="266" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.11</text><text x="250" y="298" text-anchor="end" font-size="13" fill="#1d3a5c">의자가</text><rect x="262" y="284" width="260" height="20" rx="4" fill="#eef2f7"/><rect x="262" y="284" width="3" height="20" rx="4" fill="#b9c4d0"/><text x="534" y="298" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.01</text><text x="60" y="346" text-anchor="start" font-size="13" fill="#1d3a5c">앞뒤를 다 볼 수 있어야 풀 수 있는 문제다 — 그래서 인코더 구조가 맞는다</text><text x="60" y="370" text-anchor="start" font-size="12.5" fill="#5b7a99">정답표를 사람이 만들 필요도 없다. 문장에서 단어를 가리면 그게 곧 문제와 정답이다</text><text x="360.0" y="408" text-anchor="middle" font-size="13.5" fill="#40556b">빈칸 문제를 수억 번 풀리는 것만으로 언어 감각이 만들어진다</text></svg>