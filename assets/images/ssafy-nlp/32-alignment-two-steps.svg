<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="292" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">정렬 — 모델을 사용자의 의도에 맞춘다</text><text x="360" y="60" text-anchor="middle" font-size="12.5" font-weight="400" fill="#40556b">다음 토큰 예측만 배운 모델은 '지시'를 따르지 않는다</text><rect x="90" y="86" width="240" height="150" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="90" y="86" width="240" height="38" rx="10" fill="#4f8f68" opacity="0.15"/><text x="210.0" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">① 지시 학습</text><text x="210" y="150" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">주어진 지시에 대해</text><text x="210" y="172" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">어떤 응답이</text><text x="210" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#4f8f68">생성되어야 하는지</text><defs><marker id="a340161" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="340" y1="161" x2="388" y2="161" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#a340161)"/><rect x="398" y="86" width="240" height="150" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="398" y="86" width="240" height="38" rx="10" fill="#c2703c" opacity="0.15"/><text x="518.0" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#c2703c">② 선호 학습</text><text x="518" y="150" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">상대적으로 어떤 응답이</text><text x="518" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#c2703c">더 선호되는지</text><text x="518" y="194" text-anchor="middle" font-size="12" font-weight="400" fill="#5b7a99">(RLHF)</text><text x="360" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">먼저 말귀를 알아듣게, 그 다음 더 좋은 답을 고르게</text></svg>