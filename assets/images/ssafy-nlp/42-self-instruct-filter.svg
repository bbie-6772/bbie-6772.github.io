<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="292" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">합성 데이터 — 175개로 시작해 걸러가며 5만 개로</text><rect x="40" y="68" width="120" height="44" rx="10" fill="#fff" stroke="#5b7a99" stroke-width="2"/><text x="100" y="88" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1d3a5c">사람 작성</text><text x="100" y="104" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1d3a5c">175개 시드</text><defs><marker id="m7" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="162" y1="90" x2="196" y2="90" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m7)"/><rect x="198" y="68" width="150" height="44" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><text x="273" y="88" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3f6ea5">모델이 지시·응답</text><text x="273" y="104" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3f6ea5">대량 생성</text><defs><marker id="m8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="350" y1="90" x2="384" y2="90" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m8)"/><rect x="386" y="68" width="150" height="44" rx="10" fill="#eef4fa" stroke="#c2703c" stroke-width="2"/><text x="461" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2703c">ROUGE 유사도로</text><text x="461" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2703c">양끝 필터링</text><defs><marker id="m9" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="538" y1="90" x2="572" y2="90" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m9)"/><rect x="574" y="68" width="110" height="44" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="629" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4f8f68">5.2만 개</text><text x="629" y="104" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4f8f68">합성 데이터</text><rect x="40" y="150" width="644" height="96" rx="8" fill="#e9eef3"/><rect x="52" y="162" width="180" height="72" rx="6" fill="#c0504d" opacity="0.12" stroke="#c0504d" stroke-dasharray="4 3"/><rect x="252" y="162" width="220" height="72" rx="6" fill="#4f8f68" opacity="0.16" stroke="#4f8f68"/><rect x="492" y="162" width="180" height="72" rx="6" fill="#c0504d" opacity="0.12" stroke="#c0504d" stroke-dasharray="4 3"/><text x="142" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#c0504d">유사도 낮음</text><text x="142" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#40556b">엉뚱한 노이즈</text><text x="142" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#c0504d">버린다</text><text x="362" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#4f8f68">유사도 중간</text><text x="362" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#40556b">기존과 다르면서 말이 됨</text><text x="362" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#4f8f68">남긴다 → 다양성 확보</text><text x="582" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#c0504d">유사도 높음</text><text x="582" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#40556b">이미 있는 중복</text><text x="582" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#c0504d">버린다</text><text x="360" y="272" text-anchor="middle" font-size="12.5" font-weight="400" fill="#40556b">무작정 많이가 아니라 '겹치지 않게 많이'</text></svg>