<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="330" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">파운데이션 모델을 떠받치는 세 가지 재료</text><rect x="40" y="72" width="208" height="200" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><rect x="40" y="72" width="208" height="38" rx="10" fill="#3f6ea5" opacity="0.15"/><text x="144.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#3f6ea5">빅데이터</text><text x="144" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">인터넷 데이터가</text><text x="144" y="162" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">기하급수적으로 증가</text><rect x="64" y="196" width="160" height="44" rx="8" fill="#eef4fa" stroke="#3f6ea5" stroke-width="1.5"/><text x="144" y="224" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3f6ea5">많을수록 성능 ↑</text><rect x="272" y="72" width="208" height="200" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="272" y="72" width="208" height="38" rx="10" fill="#4f8f68" opacity="0.15"/><text x="376.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">자가 학습</text><text x="376" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">다음 토큰 예측</text><text x="376" y="162" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">정답을 사람이 안 만듦</text><rect x="296" y="196" width="160" height="44" rx="8" fill="#eef4fa" stroke="#4f8f68" stroke-width="1.5"/><text x="376" y="224" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f8f68">라벨 비용 = 0</text><rect x="504" y="72" width="208" height="200" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="504" y="72" width="208" height="38" rx="10" fill="#c2703c" opacity="0.15"/><text x="608.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#c2703c">트랜스포머</text><text x="608" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">어텐션 기반</text><text x="608" y="162" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">신경망 구조</text><rect x="528" y="196" width="160" height="44" rx="8" fill="#eef4fa" stroke="#c2703c" stroke-width="1.5"/><text x="608" y="224" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2703c">많은 데이터를 소화</text><text x="360" y="306" text-anchor="middle" font-size="13.5" font-weight="400" fill="#40556b">하나라도 빠지면 파운데이션 모델은 성립하지 않는다</text></svg>