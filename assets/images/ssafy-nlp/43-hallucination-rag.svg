<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="268" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">환각과 RAG — 답하기 전에 근거를 찾아 넣는다</text><rect x="40" y="66" width="316" height="150" rx="10" fill="#fff" stroke="#c0504d" stroke-width="2"/><rect x="40" y="66" width="316" height="38" rx="10" fill="#c0504d" opacity="0.15"/><text x="198.0" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#c0504d">환각 (그냥)</text><text x="58" y="132" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">모델은 '그럴듯한 다음 단어'를</text><text x="58" y="152" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">고를 뿐, '사실인 단어'가 아님</text><text x="58" y="178" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">+ 지식이 특정 시점까지만</text><text x="198" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#c0504d">→ 자신감 있게 지어냄</text><rect x="364" y="66" width="316" height="150" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="364" y="66" width="316" height="38" rx="10" fill="#4f8f68" opacity="0.15"/><text x="522.0" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">RAG 적용</text><text x="382" y="132" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">질문 →</text><text x="452" y="132" text-anchor="700" font-size="12" font-weight="400" fill="#4f8f68">관련 문서 검색</text><text x="382" y="158" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">→ 찾은 근거를 프롬프트에 삽입</text><text x="382" y="184" text-anchor="start" font-size="12" font-weight="400" fill="#1d3a5c">→ 기억이 아니라 '근거를 보고' 답</text><text x="522" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="#5b7a99">챗봇의 '검색' 버튼</text><text x="360" y="246" text-anchor="middle" font-size="12.5" font-weight="400" fill="#40556b">18편 '비슷한 예시 찾아 넣기'와 같은 발상 — 대상이 예시 대신 사실 문서</text></svg>