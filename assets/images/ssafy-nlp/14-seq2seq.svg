f" stroke="#c8d4e0" stroke-width="2"/><text x="559.0" y="89.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">like</text><path d="M559.0 116 L559.0 102" stroke="#c2703c" stroke-width="2" marker-end="url(#ar2)"/><path d="M596 142 L604 142" stroke="#c2703c" stroke-width="2.4" marker-end="url(#ar2)"/><rect x="607" y="120" width="72" height="44" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="643.0" y="147.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c"></text><rect x="607" y="68" width="72" height="32" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="2"/><text x="643.0" y="89.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">cats</text><path d="M643.0 116 L643.0 102" stroke="#c2703c" stroke-width="2" marker-end="url(#ar2)"/><path d="M415 142 L435 142" stroke="#4f8f68" stroke-width="2.6" marker-end="url(#ar3)"/><text x="559.0" y="236" text-anchor="middle" font-size="13" fill="#c2703c">디코더 — 문장을 쓴다</text><text x="45" y="276" text-anchor="start" font-size="13" fill="#1d3a5c">입력이 3단어인데 출력도 3단어일 필요가 없다 — 길이가 달라도 된다</text><text x="360.0" y="316" text-anchor="middle" font-size="13.5" fill="#40556b">번역·요약·챗봇이 전부 이 구조 위에서 만들어졌다</text></svg>