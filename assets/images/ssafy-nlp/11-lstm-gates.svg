<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="412" rx="12" fill="#f7f9fb"/><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a04040"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">LSTM 한 칸 안에서 벌어지는 일</text><path d="M40 86 L680 86" stroke="#4f8f68" stroke-width="6" opacity="0.45"/><text x="40" y="70" text-anchor="start" font-size="12.5" fill="#4f8f68">이전 기억 (cell state)</text><text x="680" y="70" text-anchor="end" font-size="12.5" fill="#4f8f68">새 기억</text><circle cx="200" cy="86" r="19" fill="#fff" stroke="#a04040" stroke-width="2.5"/><text x="200" y="93" text-anchor="middle" font-size="19" fill="#a04040">×</text><path d="M200 136 L200 110" stroke="#a04040" stroke-width="2" marker-end="url(#ar0)"/><rect x="114" y="142" width="172" height="60" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="200" y="166" text-anchor="middle" font-size="13.5" fill="#a04040">Forget gate</text><text x="200" y="186" text-anchor="middle" font-size="12" fill="#5b7a99">무엇을 버릴지 정한다</text><circle cx="400" cy="86" r="19" fill="#fff" stroke="#3d6fa8" stroke-width="2.5"/><text x="400" y="93" text-anchor="middle" font-size="19" fill="#3d6fa8">+</text><path d="M400 136 L400 110" stroke="#3d6fa8" stroke-width="2" marker-end="url(#ar0)"/><rect x="314" y="142" width="172" height="60" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="400" y="166" text-anchor="middle" font-size="13.5" fill="#3d6fa8">Input gate</text><text x="400" y="186" text-anchor="middle" font-size="12" fill="#5b7a99">무엇을 새로 쓸지 정한다</text><circle cx="600" cy="86" r="19" fill="#fff" stroke="#c2703c" stroke-width="2.5"/><text x="600" y="93" text-anchor="middle" font-size="19" fill="#c2703c">↑</text><path d="M600 136 L600 110" stroke="#c2703c" stroke-width="2" marker-end="url(#ar0)"/><rect x="514" y="142" width="172" height="60" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="600" y="166" text-anchor="middle" font-size="13.5" fill="#c2703c">Output gate</text><text x="600" y="186" text-anchor="middle" font-size="12" fill="#5b7a99">무엇을 꺼내 쓸지 정한다</text><text x="60" y="238" text-anchor="start" font-size="13.5" fill="#a04040">1. 버리기</text><text x="170" y="238" text-anchor="start" font-size="13" fill="#1d3a5c">지난 기억 중 필요 없어진 부분을 지운다</text><text x="60" y="272" text-anchor="start" font-size="13.5" fill="#3d6fa8">2. 채우기</text><text x="170" y="272" text-anchor="start" font-size="13" fill="#1d3a5c">이번 단어에서 남길 만한 내용을 더한다</text><text x="60" y="306" text-anchor="start" font-size="13.5" fill="#c2703c">3. 꺼내기</text><text x="170" y="306" text-anchor="start" font-size="13" fill="#1d3a5c">갱신된 기억 중 지금 쓸 부분만 밖으로 내보낸다</text><text x="60" y="354" text-anchor="start" font-size="12.5" fill="#5b7a99">밖으로 나간 것이 hidden state, 옆으로 계속 흐르는 것이 cell state다</text><text x="360.0" y="392" text-anchor="middle" font-size="13.5" fill="#40556b">지우고 · 쓰고 · 읽는다 — 기억을 다루는 세 가지 동작이 전부다</text></svg>