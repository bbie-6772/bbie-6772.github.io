<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="286" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">프롬프트의 구조</text><rect x="60" y="66" width="600" height="74" rx="10" fill="#fff" stroke="#1d3a5c" stroke-width="2"/><text x="360" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#5b7a99">입력 프롬프트</text><rect x="80" y="104" width="270" height="26" rx="6" fill="#eef4fa" stroke="#4f8f68" stroke-width="1.5"/><text x="215" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#4f8f68">지시 (instruction)</text><rect x="370" y="104" width="270" height="26" rx="6" fill="#eef4fa" stroke="#c2703c" stroke-width="1.5"/><text x="505" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#c2703c">예시 (few-shot examples)</text><defs><marker id="a215150" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="215" y1="150" x2="215" y2="178" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#a215150)"/><rect x="60" y="186" width="600" height="80" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="360" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#5b7a99">지시 = 시스템 프롬프트 + 유저 쿼리</text><rect x="90" y="224" width="250" height="30" rx="6" fill="#eef4fa" stroke="#3f6ea5" stroke-width="1.5"/><text x="215" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#3f6ea5">시스템 프롬프트 (기본값)</text><rect x="370" y="224" width="260" height="30" rx="6" fill="#eef4fa" stroke="#1d3a5c" stroke-width="1.5"/><text x="500" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">유저 쿼리 (실제 질문)</text><text x="505" y="206" text-anchor="middle" font-size="11" font-weight="400" fill="#5b7a99">인-컨텍스트 학습: 모델을 안 고치고 예시만 본다</text></svg>