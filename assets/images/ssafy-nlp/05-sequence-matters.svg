<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="386" rx="12" fill="#f7f9fb"/><text x="360" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">같은 단어, 다른 순서 — 뜻이 뒤집힌다</text><rect x="150" y="74" width="60" height="40" rx="8" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="180.0" y="99.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">형이</text><rect x="222" y="74" width="77" height="40" rx="8" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="260.5" y="99.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">동생을</text><rect x="311" y="74" width="77" height="40" rx="8" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="349.5" y="99.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">업었다</text><text x="406" y="99" text-anchor="start" font-size="12.5" fill="#3d6fa8">업힌 사람이 다르다</text><rect x="150" y="138" width="77" height="40" rx="8" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="188.5" y="163.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">동생이</text><rect x="239" y="138" width="60" height="40" rx="8" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="269.0" y="163.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">형을</text><rect x="311" y="138" width="77" height="40" rx="8" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="349.5" y="163.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">업었다</text><text x="406" y="163" text-anchor="start" font-size="12.5" fill="#c2703c">업힌 사람이 다르다</text><text x="150" y="200" text-anchor="start" font-size="13" fill="#1d3a5c">단어 세 개는 완전히 같다. 바뀐 것은 자리뿐인데 상황이 반대가 된다</text><text x="360" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">순차적 데이터의 세 가지 특징</text><rect x="40" y="266" width="200" height="66" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="140.0" y="300.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">순서가 중요</text><text x="140.0" y="317.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">자리가 바뀌면 뜻도 바뀐다</text><rect x="260" y="266" width="200" height="66" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="360.0" y="300.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">멀리서도 영향</text><text x="360.0" y="317.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">앞말이 한참 뒤를 정한다</text><rect x="480" y="266" width="200" height="66" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="580.0" y="300.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">길이가 제각각</text><text x="580.0" y="317.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">3단어도 30단어도 문장</text><text x="360.0" y="366" text-anchor="middle" font-size="13.5" fill="#40556b">이 세 가지를 한꺼번에 감당해야 언어를 다룰 수 있다</text></svg>