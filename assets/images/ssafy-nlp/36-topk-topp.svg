<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="300" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">Top-K vs Top-P — 어디서 자를 것인가</text><rect x="50" y="66" width="300" height="214" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="50" y="66" width="300" height="38" rx="10" fill="#c2703c" opacity="0.15"/><text x="200.0" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#c2703c">Top-K (K 고정)</text><text x="200" y="132" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">상위 K개만 남긴다</text><rect x="74" y="150" width="120" height="44" rx="8" fill="#eef4fa" stroke="#c2703c" stroke-width="1.5"/><text x="134" y="177" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2703c">'The' 다음</text><rect x="206" y="150" width="120" height="44" rx="8" fill="#eef4fa" stroke="#c2703c" stroke-width="1.5"/><text x="266" y="177" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2703c">'The car' 다음</text><text x="134" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#5b7a99">합 0.68 → 좋은 후보도 버림</text><text x="266" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#5b7a99">합 0.99 → 잡음도 포함</text><text x="200" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#c0504d">문맥 폭이 다른데 K가 고정</text><rect x="370" y="66" width="300" height="214" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="370" y="66" width="300" height="38" rx="10" fill="#4f8f68" opacity="0.15"/><text x="520.0" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">Top-P (자동 조절)</text><text x="520" y="132" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">누적 확률 P까지만 남긴다</text><rect x="394" y="150" width="120" height="44" rx="8" fill="#eef4fa" stroke="#4f8f68" stroke-width="1.5"/><text x="454" y="177" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4f8f68">'The' → 9개</text><rect x="526" y="150" width="120" height="44" rx="8" fill="#eef4fa" stroke="#4f8f68" stroke-width="1.5"/><text x="586" y="177" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4f8f68">'The car' → 3개</text><text x="520" y="232" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b7a99">선택지가 많으면 넓게,</text><text x="520" y="250" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b7a99">적으면 좁게 알아서</text><text x="520" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#4f8f68">K가 자동으로 조절된다</text></svg>