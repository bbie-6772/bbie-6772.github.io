<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 494" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="494" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">모델을 고치는가, 말만 거는가</text><rect x="40" y="76" width="316" height="256" rx="12" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="40" y="76" width="316" height="42" rx="12" fill="#c2703c" opacity="0.15"/><text x="198" y="103" text-anchor="middle" font-size="15" fill="#c2703c">파인튜닝</text><text x="58" y="144" text-anchor="start" font-size="12" fill="#c2703c">준비물</text><text x="140" y="144" text-anchor="start" font-size="12.5" fill="#1d3a5c">라벨 붙인 학습 데이터 수백~수천 건</text><text x="58" y="182" text-anchor="start" font-size="12" fill="#c2703c">과정</text><text x="140" y="182" text-anchor="start" font-size="12.5" fill="#1d3a5c">역전파를 돌려 모델 값을 갱신</text><text x="58" y="220" text-anchor="start" font-size="12" fill="#c2703c">결과</text><text x="140" y="220" text-anchor="start" font-size="12.5" fill="#1d3a5c">그 작업 전용 모델이 하나 생김</text><text x="58" y="258" text-anchor="start" font-size="12" fill="#c2703c">비용</text><text x="140" y="258" text-anchor="start" font-size="12.5" fill="#1d3a5c">학습 시간과 장비가 필요</text><text x="58" y="296" text-anchor="start" font-size="12" fill="#c2703c">바뀌는 것</text><text x="140" y="296" text-anchor="start" font-size="12.5" fill="#1d3a5c">모델 자체가 바뀐다</text><rect x="380" y="76" width="316" height="256" rx="12" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="380" y="76" width="316" height="42" rx="12" fill="#4f8f68" opacity="0.15"/><text x="538" y="103" text-anchor="middle" font-size="15" fill="#4f8f68">In-Context Learning</text><text x="398" y="144" text-anchor="start" font-size="12" fill="#4f8f68">준비물</text><text x="480" y="144" text-anchor="start" font-size="12.5" fill="#1d3a5c">설명 한 줄, 예시 몇 개</text><text x="398" y="182" text-anchor="start" font-size="12" fill="#4f8f68">과정</text><text x="480" y="182" text-anchor="start" font-size="12.5" fill="#1d3a5c">그냥 입력에 같이 적어 넣는다</text><text x="398" y="220" text-anchor="start" font-size="12" fill="#4f8f68">결과</text><text x="480" y="220" text-anchor="start" font-size="12.5" fill="#1d3a5c">모델은 그대로, 답만 달라짐</text><text x="398" y="258" text-anchor="start" font-size="12" fill="#4f8f68">비용</text><text x="480" y="258" text-anchor="start" font-size="12.5" fill="#1d3a5c">거의 없음 (입력이 길어질 뿐)</text><text x="398" y="296" text-anchor="start" font-size="12" fill="#4f8f68">바뀌는 것</text><text x="480" y="296" text-anchor="start" font-size="12.5" fill="#1d3a5c">모델은 그대로다</text><text x="40" y="358" text-anchor="start" font-size="13" fill="#1d3a5c">예시를 몇 개 주느냐에 따라 부르는 이름이 다르다</text><rect x="40" y="376" width="200" height="56" rx="8" fill="#eef4fa" stroke="#4f8f68" stroke-width="2"/><text x="140.0" y="405.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">Zero-shot</text><text x="140.0" y="422.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">설명만 주고 시킨다</text><rect x="264" y="376" width="200" height="56" rx="8" fill="#eef4fa" stroke="#4f8f68" stroke-width="2"/><text x="364.0" y="405.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">One-shot</text><text x="364.0" y="422.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">예시 하나를 보여준다</text><rect x="488" y="376" width="200" height="56" rx="8" fill="#eef4fa" stroke="#4f8f68" stroke-width="2"/><text x="588.0" y="405.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">Few-shot</text><text x="588.0" y="422.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">예시 몇 개를 보여준다</text><text x="360.0" y="474" text-anchor="middle" font-size="13.5" fill="#40556b">모델을 고치지 않고도 새 일을 시킬 수 있다는 것이 큰 전환이었다</text></svg>