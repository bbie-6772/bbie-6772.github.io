<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="344" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">디코딩 알고리즘 — 확률 분포에서 무엇을 고를까</text><rect x="40" y="72" width="312" height="72" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><text x="58" y="102" text-anchor="start" font-size="14" font-weight="700" fill="#3f6ea5">① Greedy</text><text x="58" y="126" text-anchor="start" font-size="12.5" font-weight="400" fill="#1d3a5c">1등만 집는다</text><rect x="368" y="72" width="312" height="72" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><text x="386" y="102" text-anchor="start" font-size="14" font-weight="700" fill="#3f6ea5">② Beam Search</text><text x="386" y="126" text-anchor="start" font-size="12.5" font-weight="400" fill="#1d3a5c">후보 k개를 들고 간다</text><rect x="40" y="160" width="312" height="72" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="58" y="190" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">③ Sampling</text><text x="58" y="214" text-anchor="start" font-size="12.5" font-weight="400" fill="#1d3a5c">확률대로 뽑는다</text><rect x="368" y="160" width="312" height="72" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="386" y="190" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">④ w/ Temperature</text><text x="386" y="214" text-anchor="start" font-size="12.5" font-weight="400" fill="#1d3a5c">분포를 조작해 뽑는다</text><rect x="40" y="248" width="312" height="72" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="58" y="278" text-anchor="start" font-size="14" font-weight="700" fill="#c2703c">⑤ Top-K</text><text x="58" y="302" text-anchor="start" font-size="12.5" font-weight="400" fill="#1d3a5c">상위 K개 안에서 뽑는다</text><rect x="368" y="248" width="312" height="72" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="386" y="278" text-anchor="start" font-size="14" font-weight="700" fill="#c2703c">⑥ Top-P (Nucleus)</text><text x="386" y="302" text-anchor="start" font-size="12.5" font-weight="400" fill="#1d3a5c">누적 P까지 남기고 뽑는다</text></svg>