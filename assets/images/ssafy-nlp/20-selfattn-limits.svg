<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="444" rx="12" fill="#f7f9fb"/><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a04040"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Self-Attention만으로는 부족한 세 가지</text><rect x="45" y="76" width="290" height="92" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="62" y="102" text-anchor="start" font-size="14" fill="#a04040">순서를 모른다</text><text x="62" y="126" text-anchor="start" font-size="12" fill="#5b7a99">단어끼리 얼마나 비슷한지만 볼 뿐,</text><text x="62" y="145" text-anchor="start" font-size="12" fill="#5b7a99">누가 먼저 나왔는지는 안 본다</text><path d="M340 122 L378 122" stroke="#a04040" stroke-width="2.4" marker-end="url(#ar0)"/><rect x="386" y="76" width="290" height="92" rx="10" fill="#eef4fa" stroke="#a04040" stroke-width="2"/><text x="403" y="110" text-anchor="start" font-size="14" fill="#1d3a5c">Positional Encoding</text><text x="403" y="136" text-anchor="start" font-size="12" fill="#5b7a99">위치를 나타내는 값을 더해서 넣어준다</text><rect x="45" y="184" width="290" height="92" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="62" y="210" text-anchor="start" font-size="14" fill="#c2703c">표현력이 약하다</text><text x="62" y="234" text-anchor="start" font-size="12" fill="#5b7a99">가중 평균은 결국 덧셈과 곱셈이라</text><text x="62" y="253" text-anchor="start" font-size="12" fill="#5b7a99">복잡한 패턴을 담기 어렵다</text><path d="M340 230 L378 230" stroke="#c2703c" stroke-width="2.4" marker-end="url(#ar0)"/><rect x="386" y="184" width="290" height="92" rx="10" fill="#eef4fa" stroke="#c2703c" stroke-width="2"/><text x="403" y="218" text-anchor="start" font-size="14" fill="#1d3a5c">Feed-Forward 층 추가</text><text x="403" y="244" text-anchor="start" font-size="12" fill="#5b7a99">각 단어마다 비선형 변환을 한 번 더 건다</text><rect x="45" y="292" width="290" height="92" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="62" y="318" text-anchor="start" font-size="14" fill="#3d6fa8">미래를 훔쳐본다</text><text x="62" y="342" text-anchor="start" font-size="12" fill="#5b7a99">생성할 때는 아직 안 쓴 뒤 단어까지</text><text x="62" y="361" text-anchor="start" font-size="12" fill="#5b7a99">같이 보게 된다</text><path d="M340 338 L378 338" stroke="#3d6fa8" stroke-width="2.4" marker-end="url(#ar0)"/><rect x="386" y="292" width="290" height="92" rx="10" fill="#eef4fa" stroke="#3d6fa8" stroke-width="2"/><text x="403" y="326" text-anchor="start" font-size="14" fill="#1d3a5c">Masked Self-Attention</text><text x="403" y="352" text-anchor="start" font-size="12" fill="#5b7a99">뒤쪽 단어의 점수를 아예 막아버린다</text><text x="360.0" y="424" text-anchor="middle" font-size="13.5" fill="#40556b">세 가지를 다 붙이고 나면 우리가 아는 Transformer 블록이 된다</text></svg>