<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="332" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">InstructGPT의 3단계 (RLHF)</text><rect x="40" y="72" width="204" height="168" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="40" y="72" width="204" height="38" rx="10" fill="#4f8f68" opacity="0.15"/><text x="142.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">Step 1. 지시 학습</text><text x="142" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">사람이 정답을 작성</text><text x="142" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">GPT-3를 지도 학습</text><defs><marker id="a244156" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="244" y1="156" x2="268" y2="156" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#a244156)"/><rect x="268" y="72" width="204" height="168" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><rect x="268" y="72" width="204" height="38" rx="10" fill="#3f6ea5" opacity="0.15"/><text x="370.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#3f6ea5">Step 2. 보상 모델 학습</text><text x="370" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">응답 순위를 사람이 매김</text><text x="370" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">선호를 흉내내는 RM</text><defs><marker id="a472156" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="472" y1="156" x2="496" y2="156" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#a472156)"/><rect x="496" y="72" width="204" height="168" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="496" y="72" width="204" height="38" rx="10" fill="#c2703c" opacity="0.15"/><text x="598.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#c2703c">Step 3. 강화 학습</text><text x="598" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">RM 점수가 높아지도록</text><text x="598" y="162" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">모델 갱신 (PPO)</text><rect x="40" y="256" width="640" height="58" rx="10" fill="#eef4fa" stroke="#c0504d" stroke-width="1.5"/><text x="360" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c0504d">Step 3에서는 사람의 개입이 없다</text><text x="360" y="302" text-anchor="middle" font-size="12.5" font-weight="400" fill="#40556b">보상 모델(조교)을 한 번 만들면 무한히 반복 학습 → 규모가 나온다</text></svg>