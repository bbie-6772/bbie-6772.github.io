<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="344" rx="12" fill="#f7f9fb"/>
<text x="360" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">Temperature는 로짓을 T로 나눈 뒤 softmax를 다시 태우는 것</text>
<text x="360" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#3f6ea5">p(i) = exp(z(i) / T) ÷ Σ exp(z(j) / T)</text>
<text x="360" y="86" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b7a99">같은 로짓 z = [3, 2, 1, 0] 을 놓고 T만 바꾼 결과</text>

