<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="396" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">언어 모델 — 다음에 올 단어에 확률을 매긴다</text><text x="60" y="80" text-anchor="start" font-size="17" fill="#1d3a5c">오늘 저녁에 친구랑 영화 보러</text><rect x="352" y="60" width="90" height="30" rx="6" fill="#fff" stroke="#c2703c" stroke-width="2" stroke-dasharray="5 4"/><text x="397" y="81" text-anchor="middle" font-size="18" fill="#c2703c">?</text><text x="138" y="134" text-anchor="end" font-size="13.5" fill="#1d3a5c">갈까</text><rect x="150" y="120" width="340" height="20" rx="4" fill="#eef2f7"/><rect x="150" y="120" width="139" height="20" rx="4" fill="#3d6fa8"/><text x="502" y="134" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.41</text><text x="138" y="168" text-anchor="end" font-size="13.5" fill="#1d3a5c">간다</text><rect x="150" y="154" width="340" height="20" rx="4" fill="#eef2f7"/><rect x="150" y="154" width="92" height="20" rx="4" fill="#3d6fa8"/><text x="502" y="168" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.27</text><text x="138" y="202" text-anchor="end" font-size="13.5" fill="#1d3a5c">갔다</text><rect x="150" y="188" width="340" height="20" rx="4" fill="#eef2f7"/><rect x="150" y="188" width="54" height="20" rx="4" fill="#3d6fa8"/><text x="502" y="202" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.16</text><text x="138" y="236" text-anchor="end" font-size="13.5" fill="#1d3a5c">먹자</text><rect x="150" y="222" width="340" height="20" rx="4" fill="#eef2f7"/><rect x="150" y="222" width="14" height="20" rx="4" fill="#b9c4d0"/><text x="502" y="236" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.04</text><text x="138" y="270" text-anchor="end" font-size="13.5" fill="#1d3a5c">파랗다</text><rect x="150" y="256" width="340" height="20" rx="4" fill="#eef2f7"/><rect x="150" y="256" width="3" height="20" rx="4" fill="#b9c4d0"/><text x="502" y="270" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.001</text><text x="60" y="316" text-anchor="start" font-size="13" fill="#1d3a5c">문장이 자연스러울수록 높은 확률, 어색할수록 낮은 확률을 준다</text><text x="60" y="338" text-anchor="start" font-size="12.5" fill="#5b7a99">우리가 매일 쓰는 자동완성과 검색어 추천이 바로 이 일을 한다</text><text x="360.0" y="376" text-anchor="middle" font-size="13.5" fill="#40556b">문장 전체의 확률은 '앞을 보고 다음 단어를 맞히는 일'을 끝까지 이어 붙인 값이다</text></svg>