<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="454" rx="12" fill="#f7f9fb"/><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f8f68"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">RNN — 통로가 하나뿐이라 갈수록 흐려진다</text><rect x="70" y="92" width="96" height="42" rx="8" fill="#3d6fa8" opacity="1.00"/><text x="118" y="119" text-anchor="middle" font-size="13.5" fill="#fff">h1</text><path d="M168 113 L216 113" stroke="#3d6fa8" stroke-width="2.4" opacity="1.00" marker-end="url(#ar0)"/><rect x="220" y="92" width="96" height="42" rx="8" fill="#3d6fa8" opacity="0.76"/><text x="268" y="119" text-anchor="middle" font-size="13.5" fill="#fff">h2</text><path d="M318 113 L366 113" stroke="#3d6fa8" stroke-width="2.4" opacity="0.76" marker-end="url(#ar0)"/><rect x="370" y="92" width="96" height="42" rx="8" fill="#3d6fa8" opacity="0.52"/><text x="418" y="119" text-anchor="middle" font-size="13.5" fill="#fff">h3</text><path d="M468 113 L516 113" stroke="#3d6fa8" stroke-width="2.4" opacity="0.52" marker-end="url(#ar0)"/><rect x="520" y="92" width="96" height="42" rx="8" fill="#3d6fa8" opacity="0.28"/><text x="568" y="119" text-anchor="middle" font-size="13.5" fill="#fff">h4</text><text x="70" y="168" text-anchor="start" font-size="12.5" fill="#c2703c">앞에서 온 정보가 매 단계 새로 섞이면서 조금씩 덮어써진다</text><text x="360" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">LSTM — 통로를 둘로 나눈다</text><path d="M60 276 L630 276" stroke="#4f8f68" stroke-width="6" opacity="0.5"/><text x="636" y="281" text-anchor="start" font-size="12.5" fill="#4f8f68">cell state</text><text x="636" y="298" text-anchor="start" font-size="11.5" fill="#5b7a99">오래 남길 기억</text><rect x="70" y="310" width="96" height="42" rx="8" fill="#3d6fa8"/><text x="118" y="337" text-anchor="middle" font-size="13.5" fill="#fff">h1</text><path d="M118 308 L118 284" stroke="#4f8f68" stroke-width="2" marker-end="url(#ar1)"/><path d="M168 331 L216 331" stroke="#3d6fa8" stroke-width="2.4" marker-end="url(#ar0)"/><rect x="220" y="310" width="96" height="42" rx="8" fill="#3d6fa8"/><text x="268" y="337" text-anchor="middle" font-size="13.5" fill="#fff">h2</text><path d="M268 308 L268 284" stroke="#4f8f68" stroke-width="2" marker-end="url(#ar1)"/><path d="M318 331 L366 331" stroke="#3d6fa8" stroke-width="2.4" marker-end="url(#ar0)"/><rect x="370" y="310" width="96" height="42" rx="8" fill="#3d6fa8"/><text x="418" y="337" text-anchor="middle" font-size="13.5" fill="#fff">h3</text><path d="M418 308 L418 284" stroke="#4f8f68" stroke-width="2" marker-end="url(#ar1)"/><path d="M468 331 L516 331" stroke="#3d6fa8" stroke-width="2.4" marker-end="url(#ar0)"/><rect x="520" y="310" width="96" height="42" rx="8" fill="#3d6fa8"/><text x="568" y="337" text-anchor="middle" font-size="13.5" fill="#fff">h4</text><path d="M568 308 L568 284" stroke="#4f8f68" stroke-width="2" marker-end="url(#ar1)"/><text x="636" y="336" text-anchor="start" font-size="12.5" fill="#3d6fa8">hidden state</text><text x="636" y="353" text-anchor="start" font-size="11.5" fill="#5b7a99">지금 쓸 기억</text><text x="70" y="392" text-anchor="start" font-size="12.5" fill="#4f8f68">위쪽 굵은 선은 곱셈·덧셈만 지나간다 — 그래서 멀리까지 값이 살아남는다</text><text x="360.0" y="434" text-anchor="middle" font-size="13.5" fill="#40556b">장기 기억과 단기 기억을 분리한 것이 LSTM의 핵심 아이디어다</text></svg>