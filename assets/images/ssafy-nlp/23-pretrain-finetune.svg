<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="418" rx="12" fill="#f7f9fb"/><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7a99"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">처음부터 배우기 vs 배워둔 것 위에 얹기</text><rect x="45" y="76" width="290" height="200" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="62" y="104" text-anchor="start" font-size="14" fill="#a04040">예전 방식</text><text x="62" y="136" text-anchor="start" font-size="13" fill="#1d3a5c">· 모델을 아무 값으로 시작</text><text x="62" y="166" text-anchor="start" font-size="13" fill="#1d3a5c">· 내 작업 데이터만으로 학습</text><text x="62" y="196" text-anchor="start" font-size="13" fill="#1d3a5c">· 데이터가 적으면 실력도 낮다</text><text x="62" y="226" text-anchor="start" font-size="13" fill="#1d3a5c">· 작업마다 처음부터 다시</text><text x="62" y="258" text-anchor="start" font-size="12.5" fill="#a04040">언어 자체를 배울 기회가 없다</text><rect x="386" y="76" width="290" height="200" rx="10" fill="#eef4fa" stroke="#3d6fa8" stroke-width="2"/><text x="403" y="104" text-anchor="start" font-size="14" fill="#3d6fa8">사전학습 방식</text><text x="403" y="136" text-anchor="start" font-size="13" fill="#1d3a5c">· 인터넷의 방대한 글로 먼저 학습</text><text x="403" y="166" text-anchor="start" font-size="13" fill="#1d3a5c">· 언어 감각을 갖춘 상태에서 시작</text><text x="403" y="196" text-anchor="start" font-size="13" fill="#1d3a5c">· 내 작업 데이터는 조금만 있어도 됨</text><text x="403" y="226" text-anchor="start" font-size="13" fill="#1d3a5c">· 한 번 학습해두고 여러 곳에 재사용</text><text x="403" y="258" text-anchor="start" font-size="12.5" fill="#3d6fa8">언어를 아는 상태에서 일만 배운다</text><rect x="120" y="302" width="190" height="52" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="215.0" y="329.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">1단계 · 사전학습</text><text x="215.0" y="346.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">방대한 글로 언어 배우기</text><path d="M318 328 L400 328" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#ar0)"/><rect x="408" y="302" width="190" height="52" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="503.0" y="329.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">2단계 · 파인튜닝</text><text x="503.0" y="346.0" text-anchor="middle" font-size="11.5" fill="#5b7a99">내 작업에 맞게 다듬기</text><text x="360.0" y="398" text-anchor="middle" font-size="13.5" fill="#40556b">외국어를 배운 사람에게 업무를 가르치는 것과, 아무것도 모르는 사람에게 둘 다 가르치는 것의 차이</text></svg>