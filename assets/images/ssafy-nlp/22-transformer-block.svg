<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="456" rx="12" fill="#f7f9fb"/><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7a99"/></marker></defs><text x="200" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Transformer 블록 하나</text><rect x="80" y="76" width="240" height="42" rx="8" fill="#eef2f7" stroke="#5b7a99" stroke-width="2"/><text x="200.0" y="102" text-anchor="middle" font-size="13" fill="#1d3a5c">Add &amp; Norm</text><path d="M200.0 132 L200.0 122" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><rect x="80" y="134" width="240" height="42" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="200.0" y="160" text-anchor="middle" font-size="13" fill="#1d3a5c">Feed-Forward</text><path d="M200.0 190 L200.0 180" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><rect x="80" y="192" width="240" height="42" rx="8" fill="#eef2f7" stroke="#5b7a99" stroke-width="2"/><text x="200.0" y="218" text-anchor="middle" font-size="13" fill="#1d3a5c">Add &amp; Norm</text><path d="M200.0 248 L200.0 238" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><rect x="80" y="250" width="240" height="42" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="200.0" y="276" text-anchor="middle" font-size="13" fill="#1d3a5c">Multi-Head Attention</text><rect x="80" y="308" width="240" height="42" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="200.0" y="334" text-anchor="middle" font-size="12.5" fill="#1d3a5c">단어 임베딩 + 위치 정보</text><path d="M200.0 306 L200.0 296" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><text x="80" y="384" text-anchor="start" font-size="13" fill="#1d3a5c">이 블록을 여러 번 쌓아 올린다</text><text x="80" y="406" text-anchor="start" font-size="12" fill="#5b7a99">Add &amp; Norm = 입력을 더해주고 값을 정돈하는 안전장치</text><text x="520" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Multi-Head — 여러 관점으로 동시에</text><rect x="370" y="84" width="290" height="58" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="386" y="108" text-anchor="start" font-size="13" fill="#3d6fa8">Head 1</text><text x="386" y="128" text-anchor="start" font-size="13" fill="#1d3a5c">문법 관계</text><circle cx="520" cy="113" r="4" fill="#3d6fa8" opacity="0.55"/><circle cx="542" cy="113" r="6" fill="#3d6fa8" opacity="0.55"/><circle cx="564" cy="113" r="8" fill="#3d6fa8" opacity="0.55"/><circle cx="586" cy="113" r="4" fill="#3d6fa8" opacity="0.55"/><circle cx="608" cy="113" r="6" fill="#3d6fa8" opacity="0.55"/><circle cx="630" cy="113" r="8" fill="#3d6fa8" opacity="0.55"/><rect x="370" y="158" width="290" height="58" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="386" y="182" text-anchor="start" font-size="13" fill="#c2703c">Head 2</text><text x="386" y="202" text-anchor="start" font-size="13" fill="#1d3a5c">가리키는 대상</text><circle cx="520" cy="187" r="8" fill="#c2703c" opacity="0.55"/><circle cx="542" cy="187" r="4" fill="#c2703c" opacity="0.55"/><circle cx="564" cy="187" r="6" fill="#c2703c" opacity="0.55"/><circle cx="586" cy="187" r="8" fill="#c2703c" opacity="0.55"/><circle cx="608" cy="187" r="4" fill="#c2703c" opacity="0.55"/><circle cx="630" cy="187" r="6" fill="#c2703c" opacity="0.55"/><rect x="370" y="232" width="290" height="58" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="386" y="256" text-anchor="start" font-size="13" fill="#4f8f68">Head 3</text><text x="386" y="276" text-anchor="start" font-size="13" fill="#1d3a5c">시제·태도</text><circle cx="520" cy="261" r="6" fill="#4f8f68" opacity="0.55"/><circle cx="542" cy="261" r="8" fill="#4f8f68" opacity="0.55"/><circle cx="564" cy="261" r="4" fill="#4f8f68" opacity="0.55"/><circle cx="586" cy="261" r="6" fill="#4f8f68" opacity="0.55"/><circle cx="608" cy="261" r="8" fill="#4f8f68" opacity="0.55"/><circle cx="630" cy="261" r="4" fill="#4f8f68" opacity="0.55"/><text x="370" y="318" text-anchor="start" font-size="13" fill="#1d3a5c">같은 단어라도 볼 이유는 여러 가지다</text><text x="370" y="340" text-anchor="start" font-size="12.5" fill="#5b7a99">여러 개를 동시에 돌리고 마지막에 합친다</text><text x="360.0" y="436" text-anchor="middle" font-size="13.5" fill="#40556b">순서대로 처리하지 않으니 전부 한꺼번에 계산할 수 있다 — GPU가 좋아하는 모양</text></svg>