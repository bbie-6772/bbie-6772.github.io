<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="468" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">앞을 잘라내면 — 그럴듯한 오답이 1등이 된다</text><rect x="45" y="70" width="62" height="34" rx="7" fill="#f3f5f8" stroke="#c8d4e0"/><text x="76.0" y="93" text-anchor="middle" font-size="13" fill="#aab6c2">나는</text><rect x="117" y="70" width="62" height="34" rx="7" fill="#f3f5f8" stroke="#c8d4e0"/><text x="148.0" y="93" text-anchor="middle" font-size="13" fill="#aab6c2">매운</text><rect x="189" y="70" width="62" height="34" rx="7" fill="#f3f5f8" stroke="#c8d4e0"/><text x="220.0" y="93" text-anchor="middle" font-size="13" fill="#aab6c2">걸</text><rect x="261" y="70" width="62" height="34" rx="7" fill="#f3f5f8" stroke="#c8d4e0"/><text x="292.0" y="93" text-anchor="middle" font-size="13" fill="#aab6c2">전혀</text><rect x="333" y="70" width="62" height="34" rx="7" fill="#f3f5f8" stroke="#c8d4e0"/><text x="364.0" y="93" text-anchor="middle" font-size="13" fill="#aab6c2">못</text><rect x="405" y="70" width="62" height="34" rx="7" fill="#f3f5f8" stroke="#c8d4e0"/><text x="436.0" y="93" text-anchor="middle" font-size="13" fill="#aab6c2">먹어서</text><rect x="477" y="70" width="62" height="34" rx="7" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="508.0" y="93" text-anchor="middle" font-size="13" fill="#1d3a5c">오늘</text><rect x="549" y="70" width="62" height="34" rx="7" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="580.0" y="93" text-anchor="middle" font-size="13" fill="#1d3a5c">점심으로</text><rect x="621" y="70" width="62" height="34" rx="7" fill="#fff" stroke="#c2703c" stroke-width="2" stroke-dasharray="5 4"/><text x="652.0" y="94" text-anchor="middle" font-size="16" fill="#c2703c">?</text><line x1="45" y1="120" x2="463" y2="120" stroke="#a04040" stroke-width="2"/><text x="254.0" y="140" text-anchor="middle" font-size="12.5" fill="#a04040">3-gram이 버리는 부분</text><line x1="477" y1="120" x2="683" y2="120" stroke="#3d6fa8" stroke-width="2"/><text x="580.0" y="140" text-anchor="middle" font-size="12.5" fill="#3d6fa8">실제로 보는 부분</text><text x="45" y="176" text-anchor="start" font-size="13.5" fill="#1d3a5c">직전 2단어만 세어보면</text><text x="150" y="217" text-anchor="end" font-size="13.5" fill="#1d3a5c">떡볶이</text><rect x="162" y="202" width="300" height="22" rx="4" fill="#eef2f7"/><rect x="162" y="202" width="126" height="22" rx="4" fill="#a04040" opacity="0.8"/><text x="474" y="217" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.42</text><text x="520" y="217" text-anchor="start" font-size="12" fill="#a04040">말뭉치에서 제일 흔한 조합</text><text x="150" y="251" text-anchor="end" font-size="13.5" fill="#1d3a5c">라면</text><rect x="162" y="236" width="300" height="22" rx="4" fill="#eef2f7"/><rect x="162" y="236" width="60" height="22" rx="4" fill="#5b7a99" opacity="0.8"/><text x="474" y="251" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.20</text><text x="150" y="285" text-anchor="end" font-size="13.5" fill="#1d3a5c">김밥</text><rect x="162" y="270" width="300" height="22" rx="4" fill="#eef2f7"/><rect x="162" y="270" width="33" height="22" rx="4" fill="#4f8f68" opacity="0.8"/><text x="474" y="285" text-anchor="start" font-size="12.5" fill="#1d3a5c">0.11</text><text x="520" y="285" text-anchor="start" font-size="12" fill="#4f8f68">확률로는 3위</text><rect x="45" y="324" width="630" height="86" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="62" y="352" text-anchor="start" font-size="13.5" fill="#1d3a5c">그런데 잘려나간 앞부분에 "매운 걸 못 먹어서"가 있었다</text><text x="62" y="378" text-anchor="start" font-size="13" fill="#4f8f68">이걸 봤다면 1등이던 떡볶이는 후보에서 빠지고, 확률 3위였던 김밥이 정답이 된다</text><text x="62" y="398" text-anchor="start" font-size="12.5" fill="#5b7a99">확률이 높다고 맞는 답이 아니다 — 무엇을 보고 센 확률이냐가 먼저다</text><text x="360.0" y="448" text-anchor="middle" font-size="13.5" fill="#40556b">N을 키우면 더 볼 수 있지만, 그만큼 그 조합이 말뭉치에 없을 확률도 커진다</text></svg>