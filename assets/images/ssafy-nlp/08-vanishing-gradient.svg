<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="452" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">작은 값을 계속 곱하면 — 신호가 사라진다</text><rect x="70" y="70" width="580" height="150" fill="#fff" stroke="#c8d4e0"/><rect x="91.0" y="100.0" width="26" height="104.0" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="104.0" y="94.0" text-anchor="middle" font-size="10.5" fill="#1d3a5c">1.000</text><text x="104.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">0</text><rect x="155.0" y="152.0" width="26" height="52.0" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="168.0" y="146.0" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.500</text><text x="168.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">1</text><rect x="219.0" y="178.0" width="26" height="26.0" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="232.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.250</text><text x="232.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">2</text><rect x="283.0" y="191.0" width="26" height="13.0" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="296.0" y="185.0" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.125</text><text x="296.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">3</text><rect x="347.0" y="197.5" width="26" height="6.5" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="360.0" y="191.5" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.062</text><text x="360.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">4</text><rect x="411.0" y="200.8" width="26" height="3.2" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="424.0" y="194.75" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.031</text><text x="424.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">5</text><rect x="475.0" y="202.4" width="26" height="1.6" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="488.0" y="196.375" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.016</text><text x="488.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">6</text><rect x="539.0" y="202.5" width="26" height="1.5" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="552.0" y="196.5" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.008</text><text x="552.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">7</text><rect x="603.0" y="202.5" width="26" height="1.5" rx="3" fill="#3d6fa8" opacity="0.85"/><text x="616.0" y="196.5" text-anchor="middle" font-size="10.5" fill="#1d3a5c">0.004</text><text x="616.0" y="216" text-anchor="middle" font-size="11" fill="#5b7a99">8</text><text x="360.0" y="242" text-anchor="middle" font-size="12" fill="#5b7a99">거슬러 올라간 시점 수</text><text x="70" y="264" text-anchor="start" font-size="12.5" fill="#c2703c">한 시점 거슬러 갈 때마다 0.5배씩 줄어든다고 가정한 경우</text><text x="90" y="292" text-anchor="start" font-size="13.5" fill="#1d3a5c">2시점 전</text><text x="210" y="292" text-anchor="start" font-size="13.5" fill="#4f8f68">0.25배</text><text x="330" y="292" text-anchor="start" font-size="13" fill="#5b7a99">아직 신호가 남아 있다</text><text x="90" y="332" text-anchor="start" font-size="13.5" fill="#1d3a5c">8시점 전</text><text x="210" y="332" text-anchor="start" font-size="13.5" fill="#a04040">0.004배</text><text x="330" y="332" text-anchor="start" font-size="13" fill="#5b7a99">거의 0 — 사실상 안 배운다</text><text x="90" y="372" text-anchor="start" font-size="13.5" fill="#1d3a5c">20시점 전</text><text x="210" y="372" text-anchor="start" font-size="13.5" fill="#a04040">0.000001배</text><text x="330" y="372" text-anchor="start" font-size="13" fill="#5b7a99">완전히 사라진다</text><text x="360.0" y="432" text-anchor="middle" font-size="13.5" fill="#40556b">그래서 RNN은 최근 몇 단어만 기억하고, 멀리 있는 말은 잊어버린다</text></svg>