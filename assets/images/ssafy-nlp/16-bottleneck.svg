<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="428" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Seq2Seq의 병목 — 문장 전체가 벡터 하나를 통과한다</text><rect x="60" y="96" width="82" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="101.0" y="121.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">나는</text><path d="M101.0 140 L330 192" stroke="#3d6fa8" stroke-width="1.8" opacity="0.7"/><rect x="156" y="96" width="82" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="197.0" y="121.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">고양이를</text><path d="M197.0 140 L330 192" stroke="#3d6fa8" stroke-width="1.8" opacity="0.7"/><rect x="252" y="96" width="82" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="293.0" y="121.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">정말</text><path d="M293.0 140 L330 192" stroke="#3d6fa8" stroke-width="1.8" opacity="0.7"/><rect x="348" y="96" width="82" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="389.0" y="121.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">좋아해</text><path d="M389.0 140 L330 192" stroke="#3d6fa8" stroke-width="1.8" opacity="0.7"/><rect x="314" y="196" width="92" height="40" rx="10" fill="#4f8f68" opacity="0.85"/><text x="360" y="221" text-anchor="middle" font-size="13" fill="#fff">벡터 하나</text><text x="470" y="221" text-anchor="start" font-size="13" fill="#a04040">여기가 좁다</text><rect x="60" y="272" width="82" height="40" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="101.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">I</text><path d="M350 238 L101.0 268" stroke="#c2703c" stroke-width="1.8" opacity="0.7"/><rect x="156" y="272" width="82" height="40" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="197.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">like</text><path d="M350 238 L197.0 268" stroke="#c2703c" stroke-width="1.8" opacity="0.7"/><rect x="252" y="272" width="82" height="40" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="293.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">cats</text><path d="M350 238 L293.0 268" stroke="#c2703c" stroke-width="1.8" opacity="0.7"/><rect x="348" y="272" width="82" height="40" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="389.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">a lot</text><path d="M350 238 L389.0 268" stroke="#c2703c" stroke-width="1.8" opacity="0.7"/><text x="60" y="346" text-anchor="start" font-size="13" fill="#1d3a5c">문장이 10단어든 100단어든 통로의 크기는 똑같다</text><text x="60" y="368" text-anchor="start" font-size="12.5" fill="#a04040">길어질수록 앞부분이 뭉개진다 — 이것이 bottleneck problem</text><text x="360.0" y="408" text-anchor="middle" font-size="13.5" fill="#40556b">요약을 잘 만드는 게 문제가 아니라, 요약 하나만 보게 한 것이 문제였다</text></svg>