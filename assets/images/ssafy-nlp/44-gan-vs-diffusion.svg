<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="278" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">GAN vs Diffusion — 경쟁이냐 복원이냐</text><rect x="40" y="66" width="316" height="192" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><rect x="40" y="66" width="316" height="38" rx="10" fill="#3f6ea5" opacity="0.15"/><text x="198.0" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#3f6ea5">GAN — 경쟁</text><rect x="70" y="118" width="110" height="40" rx="10" fill="#eef4fa" stroke="#3f6ea5" stroke-width="2"/><text x="125" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#3f6ea5">생성자</text><rect x="216" y="118" width="110" height="40" rx="10" fill="#eef4fa" stroke="#3f6ea5" stroke-width="2"/><text x="271" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#3f6ea5">판별자</text><defs><marker id="m10" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="182" y1="132" x2="214" y2="132" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m10)"/><defs><marker id="m11" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="214" y1="150" x2="182" y2="150" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m11)"/><text x="198" y="190" text-anchor="middle" font-size="11.5" font-weight="400" fill="#40556b">서로 속이고 잡으며 경쟁</text><text x="198" y="214" text-anchor="middle" font-size="11.5" font-weight="400" fill="#c0504d">선명하나 균형 어렵고</text><text x="198" y="232" text-anchor="middle" font-size="11.5" font-weight="400" fill="#c0504d">Mode Collapse 위험</text><rect x="364" y="66" width="316" height="192" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><rect x="364" y="66" width="3