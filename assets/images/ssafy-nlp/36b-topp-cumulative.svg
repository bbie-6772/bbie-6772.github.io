<text x="360" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b7a99">자른 뒤 남은 5개를 다시 정규화한다 &#160; 0.40 ÷ 0.92 = <tspan font-weight="700" fill="#1d3a5c">0.435</tspan> &#160;·&#160; 0.22 ÷ 0.92 = <tspan font-weight="700" fill="#1d3a5c">0.239</tspan> &#160;·&#160; …</text>
<text x="360" y="340" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5b7a99">파란 선 = 누적 확률 &#160;/&#160; 막대 = 각 토큰의 확률 (확률 내림차순 정렬)</text>
