<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="386" rx="12" fill="#f7f9fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7a99"/></marker></defs><rect x="60" y="44" width="600" height="40" rx="8" fill="#fff" stroke="#dde5ee"/><text x="80" y="70" font-size="15" fill="#1d3a5c">어제 친구랑 <tspan font-weight="700" fill="#c2703c">○○</tspan> 가서 라떼 마셨어</text><rect x="60" y="100" width="600" height="40" rx="8" fill="#fff" stroke="#dde5ee"/><text x="80" y="126" font-size="15" fill="#1d3a5c">역 앞에 새로 생긴 <tspan font-weight="700" fill="#c2703c">○○</tspan> 사람이 많더라</text><rect x="60" y="156" width="600" height="40" rx="8" fill="#fff" stroke="#dde5ee"/><text x="80" y="182" font-size="15" fill="#1d3a5c">공부하러 <tspan font-weight="700" fill="#c2703c">○○</tspan> 자리를 잡았다</text><text x="360" y="242" text-anchor="middle" font-size="13.5" fill="#5b7a99">주변 단어가 라떼 · 자리 · 사람이라면?</text><path d="M360 254 L360 282" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="290" width="180" height="44" rx="10" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="360" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3a5c">카페</text><text x="360.0" y="364" text-anchor="middle" font-size="13.5" fill="#40556b">단어의 뜻은 사전이 아니라 '같이 등장하는 이웃'이 알려준다</text></svg>