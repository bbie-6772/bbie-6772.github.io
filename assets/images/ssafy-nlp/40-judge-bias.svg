<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="308" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">LLM-as-judge의 세 가지 편향</text><rect x="40" y="72" width="204" height="182" rx="10" fill="#fff" stroke="#c0504d" stroke-width="2"/><rect x="40" y="72" width="204" height="38" rx="10" fill="#c0504d" opacity="0.15"/><text x="142.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#c0504d">① 위치 편향</text><text x="142" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">특정 위치의 응답을</text><text x="142" y="162" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">상대적으로 선호</text><rect x="56" y="192" width="172" height="46" rx="8" fill="#eef4fa" stroke="#c0504d" stroke-width="1.5"/><text x="142" y="220" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0504d">순서만 바꿔도 결론이 뒤집힘</text><rect x="268" y="72" width="204" height="182" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="268" y="72" width="204" height="38" rx="10" fill="#c2703c" opacity="0.15"/><text x="370.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#c2703c">② 길이 편향</text><text x="370" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">품질과 무관하게</text><text x="370" y="162" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">긴 응답을 선호</text><rect x="284" y="192" width="172" height="46" rx="8" fill="#eef4fa" stroke="#c2703c" stroke-width="1.5"/><text x="370" y="220" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2703c">중복해 늘린 답에 속음</text><rect x="496" y="72" width="204" height="182" rx="10" fill="#fff" stroke="#3f6ea5" stroke-width="2"/><rect x="496" y="72" width="204" height="38" rx="10" fill="#3f6ea5" opacity="0.15"/><text x="598.0" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#3f6ea5">③ 자기 선호 편향</text><text x="598" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">평가 모델과 같은</text><text x="598" y="162" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d3a5c">모델의 답을 선호</text><rect x="512" y="192" width="172" height="46" rx="8" fill="#eef4fa" stroke="#3f6ea5" stroke-width="1.5"/><text x="598" y="220" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f6ea5">자기 답안 자기가 채점</text><text x="360" y="286" text-anchor="middle" font-size="12.5" font-weight="400" fill="#40556b">보완 — 순서 바꿔 두 번 평가 · 길이 영향 통계적 제거 (AlpacaEval 2)</text></svg>