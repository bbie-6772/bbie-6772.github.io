<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="244" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">Latent Diffusion — 픽셀 대신 작은 설계도에서</text><rect x="40" y="84" width="130" height="56" rx="10" fill="#fff" stroke="#5b7a99" stroke-width="2"/><text x="105" y="110" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">원본 이미지</text><text x="105" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#5b7a99">(큰 픽셀)</text><defs><marker id="m16" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="172" y1="112" x2="206" y2="112" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m16)"/><text x="189" y="102" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5b7a99">Encoder</text><rect x="208" y="90" width="120" height="44" rx="10" fill="#eef4fa" stroke="#c2703c" stroke-width="2"/><text x="268" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#c2703c">Latent</text><text x="268" y="127" text-anchor="middle" font-size="10.5" font-weight="400" fill="#c2703c">(작은 압축본)</text><defs><marker id="m17" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="330" y1="112" x2="364" y2="112" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m17)"/><rect x="366" y="90" width="150" height="44" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="441" y="110" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4f8f68">Noise 예측·제거</text><text x="441" y="127" text-anchor="middle" font-size="10.5" font-weight="400" fill="#4f8f68">(이 공간에서)</text><defs><marker id="m18" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b7a99"/></marker></defs><line x1="518" y1="112" x2="552" y2="112" stroke="#5b7a99" stroke-width="2.4" marker-end="url(#m18)"/><text x="535" y="102" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5b7a99">Decoder</text><rect x="554" y="84" width="130" height="56" rx="10" fill="#fff" stroke="#5b7a99" stroke-width="2"/><text x="619" y="110" text-anchor="middle" font-size="12" font-weight="400" fill="#1d3a5c">복원 이미지</text><text x="360" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">작은 Latent 공간에서 작업 → 계산량 대폭 감소</text><text x="360" y="204" text-anchor="middle" font-size="12" font-weight="400" fill="#40556b">단, 지나친 압축은 작은 글자·손가락 등 세부를 잃는다</text><text x="360" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#c2703c">핵심 = 계산 절감 ↔ 세부 보존의 균형</text></svg>