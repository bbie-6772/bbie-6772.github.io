<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="442" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">생각 과정을 적게 하면 답이 달라진다</text><rect x="45" y="76" width="630" height="44" rx="8" fill="#fff" stroke="#c8d4e0"/><text x="62" y="104" text-anchor="start" font-size="13" fill="#1d3a5c">연필 48자루를 4명이 똑같이 나누고, 각자 3자루씩 썼다면 남은 연필은 모두 몇 자루인가?</text><rect x="45" y="144" width="300" height="190" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="62" y="172" text-anchor="start" font-size="13.5" fill="#a04040">바로 답만 시키면</text><text x="62" y="202" text-anchor="start" font-size="13" fill="#1d3a5c">A: 답은 12자루입니다.</text><text x="62" y="240" text-anchor="start" font-size="12.5" fill="#5b7a99">어디서 틀렸는지 알 수 없다</text><text x="62" y="262" text-anchor="start" font-size="12.5" fill="#5b7a99">중간 계산을 건너뛰고</text><text x="62" y="284" text-anchor="start" font-size="12.5" fill="#5b7a99">그럴듯한 숫자를 바로 내놓는다</text><text x="62" y="314" text-anchor="start" font-size="17" fill="#a04040">✕</text><rect x="375" y="144" width="300" height="190" rx="10" fill="#eef4fa" stroke="#4f8f68" stroke-width="2"/><text x="392" y="172" text-anchor="start" font-size="13.5" fill="#4f8f68">단계를 밟게 하면</text><text x="392" y="202" text-anchor="start" font-size="12.5" fill="#1d3a5c">A: 48을 4로 나누면 12자루씩.</text><text x="392" y="228" text-anchor="start" font-size="12.5" fill="#1d3a5c">각자 3자루를 썼으니 9자루 남음.</text><text x="392" y="254" text-anchor="start" font-size="12.5" fill="#1d3a5c">9 × 4 = 36.</text><text x="392" y="280" text-anchor="start" font-size="12.5" fill="#1d3a5c">답은 36자루입니다.</text><text x="392" y="314" text-anchor="start" font-size="17" fill="#4f8f68">✓</text><text x="45" y="360" text-anchor="start" font-size="13" fill="#1d3a5c">질문 뒤에 "차근차근 단계별로 생각해보자" 한 줄만 붙여도 효과가 난다</text><text x="45" y="384" text-anchor="start" font-size="12.5" fill="#5b7a99">모델을 바꾼 게 아니라 시키는 방식만 바꾼 것이다</text><text x="360.0" y="422" text-anchor="middle" font-size="13.5" fill="#40556b">머릿속으로 암산하지 말고 풀이를 적으라고 하는 것과 같다</text></svg>