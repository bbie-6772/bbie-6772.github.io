<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="368" rx="12" fill="#f7f9fb"/><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2703c"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7a99"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">RNN — 같은 상자를 계속 다시 쓰면서, 메모만 이어 넘긴다</text><rect x="70" y="130" width="100" height="46" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="120.0" y="158.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">RNN</text><rect x="70" y="230" width="100" height="36" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="2"/><text x="120.0" y="253.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">나는</text><path d="M120.0 228 L120.0 180" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><path d="M120.0 126 L120.0 88" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><rect x="84" y="46" width="72" height="34" rx="8" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="120.0" y="68.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4f8f68">h1</text><path d="M172 153 L226 153" stroke="#c2703c" stroke-width="2.6" marker-end="url(#ar0)"/><text x="200.0" y="144" text-anchor="middle" font-size="11.5" fill="#c2703c">메모</text><rect x="230" y="130" width="100" height="46" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="280.0" y="158.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">RNN</text><rect x="230" y="230" width="100" height="36" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="2"/><text x="280.0" y="253.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">어제</text><path d="M280.0 228 L280.0 180" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><path d="M280.0 126 L280.0 88" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><rect x="244" y="46" width="72" height="34" rx="8" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="280.0" y="68.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4f8f68">h2</text><path d="M332 153 L386 153" stroke="#c2703c" stroke-width="2.6" marker-end="url(#ar0)"/><text x="360.0" y="144" text-anchor="middle" font-size="11.5" fill="#c2703c">메모</text><rect x="390" y="130" width="100" height="46" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="440.0" y="158.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">RNN</text><rect x="390" y="230" width="100" height="36" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="2"/><text x="440.0" y="253.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">도서관에</text><path d="M440.0 228 L440.0 180" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><path d="M440.0 126 L440.0 88" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><rect x="404" y="46" width="72" height="34" rx="8" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="440.0" y="68.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4f8f68">h3</text><path d="M492 153 L546 153" stroke="#c2703c" stroke-width="2.6" marker-end="url(#ar0)"/><text x="520.0" y="144" text-anchor="middle" font-size="11.5" fill="#c2703c">메모</text><rect x="550" y="130" width="100" height="46" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="600.0" y="158.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">RNN</text><rect x="550" y="230" width="100" height="36" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="2"/><text x="600.0" y="253.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">갔다</text><path d="M600.0 228 L600.0 180" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><path d="M600.0 126 L600.0 88" stroke="#5b7a99" stroke-width="2" marker-end="url(#ar1)"/><rect x="564" y="46" width="72" height="34" rx="8" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="600.0" y="68.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4f8f68">h4</text><text x="70" y="288" text-anchor="start" font-size="13" fill="#1d3a5c">아래에서 단어가 들어오고, 위로 결과가 나가고, 옆으로 메모(hidden state)가 넘어간다</text><text x="70" y="310" text-anchor="start" font-size="12.5" fill="#5b7a99">네 개의 상자는 서로 다른 상자가 아니라 같은 상자를 네 번 쓴 것이다 — 가중치가 하나다</text><text x="360.0" y="348" text-anchor="middle" font-size="13.5" fill="#40556b">그래서 문장이 몇 단어든 상관없다. 상자를 그만큼 더 돌리면 된다</text></svg>