<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="336" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Self-Attention — 같은 문장 안에서 서로를 본다</text><rect x="55" y="150" width="89" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="99.5" y="175.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">어제</text><rect x="160" y="150" width="89" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="204.5" y="175.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">카페</text><rect x="265" y="150" width="89" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="309.5" y="175.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">갔었어</text><rect x="370" y="150" width="89" height="40" rx="8" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="2"/><text x="414.5" y="175.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">거기</text><rect x="475" y="150" width="89" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="519.5" y="175.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">사람</text><rect x="580" y="150" width="89" height="40" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="624.5" y="175.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">많더라</text><path d="M414.5 146 Q 309.5 72 204.5 146" fill="none" stroke="#c2703c" stroke-width="4.1" opacity="0.8"/><path d="M414.5 146 Q 362.0 91 309.5 146" fill="none" stroke="#c2703c" stroke-width="2.0" opacity="0.8"/><path d="M414.5 146 Q 467.0 91 519.5 146" fill="none" stroke="#c2703c" stroke-width="1.5" opacity="0.8"/><path d="M414.5 146 Q 519.5 72 624.5 146" fill="none" stroke="#c2703c" stroke-width="1.4" opacity="0.8"/><text x="360" y="96" text-anchor="middle" font-size="13" fill="#c2703c">'거기'가 무엇을 가리키는지 알려면 '카페'를 봐야 한다</text><text x="55" y="228" text-anchor="start" font-size="12.5" fill="#5b7a99">선이 굵을수록 많이 참고했다는 뜻이다</text><text x="55" y="252" text-anchor="start" font-size="13" fill="#1d3a5c">번역처럼 두 문장 사이가 아니라, 한 문장 안에서 단어끼리 Attention을 한다</text><text x="55" y="276" text-anchor="start" font-size="13" fill="#1d3a5c">그래서 이름이 'Self'다</text><text x="360.0" y="316" text-anchor="middle" font-size="13.5" fill="#40556b">멀리 떨어진 단어도 한 걸음에 연결된다 — RNN처럼 거쳐 갈 필요가 없다</text></svg>