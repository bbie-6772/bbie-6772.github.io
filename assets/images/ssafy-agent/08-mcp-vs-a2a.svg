<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><marker id="ma1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#40556b"/></marker></defs>
<rect width="720" height="320" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">MCP는 아래로, A2A는 옆으로</text>

<rect x="24" y="56" width="320" height="196" rx="10" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="184" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6fa8">MCP — 에이전트와 도구 사이</text>
<rect x="130" y="98" width="108" height="32" rx="6" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.8"/>
<text x="184" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">에이전트</text>
<path d="M184 134 V152" stroke="#40556b" stroke-width="1.6" marker-end="url(#ma1)"/>
<rect x="126" y="154" width="116" height="26" rx="6" fill="#1d3a5c"/>
<text x="184" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">MCP</text>
<rect x="44" y="200" width="76" height="28" rx="6" fill="#ffffff" stroke="#8fb0d4" stroke-width="1.4"/>
<text x="82" y="219" text-anchor="middle" font-size="10" fill="#1d3a5c">파일 시스템</text>
<rect x="146" y="200" width="76" height="28" rx="6" fill="#ffffff" stroke="#8fb0d4" stroke-width="1.4"/>
<text x="184" y="219" text-anchor="middle" font-size="10" fill="#1d3a5c">데이터베이스</text>
