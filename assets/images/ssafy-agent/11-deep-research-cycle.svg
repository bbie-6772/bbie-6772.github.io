<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><marker id="dr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#40556b"/></marker></defs>
<rect width="720" height="350" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Deep Research가 도는 네 단계</text>

<rect x="30" y="62" width="130" height="52" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.8"/>
<text x="95" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">생각 (Think)</text>
<text x="95" y="102" text-anchor="middle" font-size="10" fill="#40556b">무엇을 찾을지 정한다</text>

<path d="M164 88 H196" stroke="#40556b" stroke-width="1.6" marker-end="url(#dr1)"/>

<rect x="200" y="62" width="130" height="52" rx="8" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="265" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">검색 (Search)</text>
<text x="265" y="102" text-anchor="middle" font-size="10" fill="#40556b">상위 k개 결과를 받는다</text>

<path d="M334 88 H366" stroke="#40556b" stroke-width="1.6" marker-end="url(#dr1)"/>

<rect x="370" y="62" width="130" height="52" rx="8" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="435" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">탐색 (Explore)</text>
<text x="435" y="102" text-anchor="middle" font-size="10" fill="#40556b">읽고 쓸 것만 남긴다</text>

<path d="M504 88 H536" stroke="#40556b" stroke-width="1.6" marker-end="url(#dr1)"/>

<rect x="540" y="62" width="150" height="52" rx="8" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.8"/>
<text x="615" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">답변 (Answer)</text>
<text x="615" y="102" text-anchor="middle" font-size="10" fill="#40556b">모은 근거로 결론</text>

<path d="M435 118 C435 146 95 138 95 120" stroke="#c2703c" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#dr1)"/>
<text x="265" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#c2703c">부족하면 다시 — 여기가 기존 RAG와 갈리는 지점</text>

<rect x="30" y="172" width="320" height="140" rx="10" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="190" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f8f68">시키지 않았는데 나온 행동</text>
<text x="52" y="220" font-size="11" fill="#40556b">· <tspan font-weight="700">계획</tspan> — 먼저 단계를 적고 시작한다</text>
<text x="52" y="242" font-size="11" fill="#40556b">· <tspan font-weight="700">교차 검증</tspan> — 첫 결과를 그대로 안 믿는다</text>
<text x="52" y="264" font-size="11" fill="#40556b">· <tspan font-weight="700">성찰적 재검색</tspan> — 방향이 틀렸다 싶으면 튼다</text>
<text x="52" y="286" font-size="11" fill="#40556b">· <tspan font-weight="700">솔직한 회피</tspan> — 모르면 모른다고 한다</text>

<rect x="370" y="172" width="320" height="140" rx="10" fill="#ffffff" stroke="#a04040" stroke-width="1.4"/>
<text x="530" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a04040">공짜가 아니다</text>
<text x="392" y="220" font-size="11" fill="#40556b">· 단일 에이전트 — 보통 질의응답의 <tspan font-weight="700">약 4배</tspan> 토큰</text>
<text x="392" y="242" font-size="11" fill="#40556b">· 멀티 에이전트 — <tspan font-weight="700">약 15배</tspan> 토큰</text>
<text x="392" y="264" font-size="11" fill="#40556b">· 병렬로 쪼갤 수 있는 일에만 이득</text>
<text x="392" y="286" font-size="11" fill="#40556b">· 매번 경로가 달라 공정한 평가가 어렵다</text>

<text x="360" y="336" text-anchor="middle" font-size="11.5" fill="#6b7f95">그래서 쓸 자리를 고르는 게 곧 설계다 — 아무 질문에나 붙일 물건이 아니다</text>
</svg>
