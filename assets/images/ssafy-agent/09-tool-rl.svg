<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><marker id="tr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#40556b"/></marker></defs>
<rect width="720" height="340" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">도구 쓰는 법을 무엇으로 채점했는가</text>

<rect x="24" y="56" width="212" height="184" rx="10" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="130" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6fa8">Gorilla</text>
<text x="130" y="100" text-anchor="middle" font-size="10.5" fill="#6b7f95">API 문서를 먼저 찾아 읽는다</text>
<rect x="46" y="114" width="76" height="28" rx="6" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="84" y="133" text-anchor="middle" font-size="10" fill="#1d3a5c">질문</text>
<path d="M126 128 H142" stroke="#40556b" stroke-width="1.3" marker-end="url(#tr1)"/>
<rect x="146" y="114" width="76" height="28" rx="6" fill="#ffffff" stroke="#8fb0d4" stroke-width="1.4"/>
<text x="184" y="133" text-anchor="middle" font-size="10" fill="#1d3a5c">문서 검색</text>
<path d="M184 146 V162" stroke="#40556b" stroke-width="1.3" marker-end="url(#tr1)"/>
<rect x="106" y="164" width="116" height="28" rx="6" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.6"/>
<text x="164" y="183" text-anchor="middle" font-size="10" fill="#1d3a5c">정확한 API 호출</text>
<text x="130" y="214" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4f8f68">채점 기준: 문서와 맞는가</text>
<text x="130" y="230" text-anchor="middle" font-size="10.5" fill="#6b7f95">없는 함수를 지어내는 걸 줄인다</text>

<rect x="254" y="56" width="212" height="184" rx="10" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="360" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#c2703c">ReTool</text>
<text x="360" y="100" text-anchor="middle" font-size="10.5" fill="#6b7f95">코드를 실제로 돌려본다</text>
<rect x="286" y="114" width="70" height="28" rx="6" fill="#fbeee6" stroke="#c2703c" stroke-width="1.4"/>
<text x="321" y="133" text-anchor="middle" font-size="10" fill="#1d3a5c">코드 작성</text>
<path d="M360 128 H376" stroke="#40556b" stroke-width="1.3" marker-end="url(#tr1)"/>
<rect x="380" y="114" width="70" height="28" rx="6" fill="#ffffff" stroke="#8fb0d4" stroke-width="1.4"/>
<text x="415" y="133" text-anchor="middle" font-size="10" fill="#1d3a5c">샌드박스</text>
<path d="M415 146 C415 164 360 164 360 164" stroke="#40556b" stroke-width="1.3" fill="none"/>
<path d="M340 164 H322 V148" stroke="#40556b" stroke-width="1.3" fill="none" marker-end="url(#tr1)"/>
<text x="360" y="182" text-anchor="middle" font-size="10" fill="#6b7f95">틀리면 고쳐서 다시</text>
<text x="360" y="214" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4f8f68">채점 기준: 실행 결과가 맞는가</text>
<text x="360" y="230" text-anchor="middle" font-size="10.5" fill="#6b7f95">호출 타이밍과 자기 수정을 배운다</text>

<rect x="484" y="56" width="212" height="184" rx="10" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="590" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5aa8">Search-R1</text>
<text x="590" y="100" text-anchor="middle" font-size="10.5" fill="#6b7f95">검색을 몇 번 할지 스스로 정한다</text>
<rect x="506" y="114" width="70" height="28" rx="6" fill="#efe9f7" stroke="#7a5aa8" stroke-width="1.4"/>
<text x="541" y="133" text-anchor="middle" font-size="10" fill="#1d3a5c">질의 작성</text>
<path d="M580 128 H596" stroke="#40556b" stroke-width="1.3" marker-end="url(#tr1)"/>
<rect x="600" y="114" width="70" height="28" rx="6" fill="#ffffff" stroke="#8fb0d4" stroke-width="1.4"/>
<text x="635" y="133" text-anchor="middle" font-size="10" fill="#1d3a5c">검색 엔진</text>
<path d="M635 146 C635 164 590 164 590 164" stroke="#40556b" stroke-width="1.3" fill="none"/>
<path d="M570 164 H542 V148" stroke="#40556b" stroke-width="1.3" fill="none" marker-end="url(#tr1)"/>
<text x="590" y="182" text-anchor="middle" font-size="10" fill="#6b7f95">부족하면 질의를 고쳐서 다시</text>
<text x="590" y="214" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4f8f68">채점 기준: 최종 답이 맞는가</text>
<text x="590" y="230" text-anchor="middle" font-size="10.5" fill="#6b7f95">GRPO — 여러 번 굴려 서로 비교</text>

<rect x="24" y="258" width="672" height="60" rx="8" fill="#eef3f8" stroke="#8fb0d4" stroke-width="1.2"/>
<text x="360" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">공통점 — 사람이 정답 절차를 적어주지 않는다</text>
<text x="360" y="304" text-anchor="middle" font-size="11" fill="#40556b">문서 · 실행기 · 최종 정답처럼 <tspan font-weight="700">자동으로 채점되는 것</tspan>을 찾아내 보상으로 삼았다</text>
</svg>
