<text x="212.0" y="133" text-anchor="middle" font-size="13" fill="#1d3a5c">3.1</text>
<rect x="244" y="112" width="56" height="32" rx="4" fill="#f3e3e3" stroke="#a04040" stroke-width="1.4"/>
<text x="272.0" y="133" text-anchor="middle" font-size="13" fill="#1d3a5c">0.2</text>
<rect x="304" y="112" width="56" height="32" rx="4" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="332.0" y="133" text-anchor="middle" font-size="13" fill="#1d3a5c">2.4</text>
<rect x="364" y="112" width="56" height="32" rx="4" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="392.0" y="133" text-anchor="middle" font-size="13" fill="#1d3a5c">5.6</text>
<rect x="424" y="112" width="56" height="32" rx="4" fill="#f3e3e3" stroke="#a04040" stroke-width="1.4"/>
<text x="452.0" y="133" text-anchor="middle" font-size="13" fill="#1d3a5c">0.1</text>
<rect x="484" y="112" width="56" height="32" rx="4" fill="#f3e3e3" stroke="#a04040" stroke-width="1.4"/>
<text x="512.0" y="133" text-anchor="middle" font-size="13" fill="#1d3a5c">0.3</text>
<rect x="544" y="112" width="56" height="32" rx="4" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="572.0" y="133" text-anchor="middle" font-size="13" fill="#1d3a5c">4.2</text>
<text x="30" y="168" font-size="11" fill="#a04040">붉은 칸 4개가 잘려나간다. 파란 칸 4개만 남는다.</text>
<line x1="30" y1="190" x2="690" y2="190" stroke="#d5dde6" stroke-width="1.2"/>
<text x="30" y="218" font-size="12" font-weight="700" fill="#1d3a5c">가지치기 후 — 값 4개 + 위치 4개</text>
<text x="60" y="262" font-size="11" fill="#6b7f95">값</text>
<text x="60" y="306" font-size="11" fill="#6b7f95">위치</text>
<rect x="124" y="240" width="56" height="32" rx="4" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.4"/>
<text x="152.0" y="261" text-anchor="middle" font-size="13" fill="#1d3a5c">3.1</text>
<rect x="124" y="284" width="56" height="32" rx="4" fill="#fdf0dd" stroke="#c2703c" stroke-width="1.4"/>
<text x="152.0" y="305" text-anchor="middle" font-size="13" fill="#1d3a5c">1</text>
<rect x="184" y="240" width="56" height="32" rx="4" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.4"/>
<text x="212.0" y="261" text-anchor="middle" font-size="13" fill="#1d3a5c">2.4</text>
<rect x="184" y="284" width="56" height="32" rx="4" fill="#fdf0dd" stroke="#c2703c" stroke-width="1.4"/>
<text x="212.0" y="305" text-anchor="middle" font-size="13" fill="#1d3a5c">3</text>
<rect x="244" y="240" width="56" height="32" rx="4" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.4"/>
<text x="272.0" y="261" text-anchor="middle" font-size="13" fill="#1d3a5c">5.6</text>
<rect x="244" y="284" width="56" height="32" rx="4" fill="#fdf0dd" stroke="#c2703c" stroke-width="1.4"/>
<text x="272.0" y="305" text-anchor="middle" font-size="13" fill="#1d3a5c">4</text>
<rect x="304" y="240" width="56" height="32" rx="4" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.4"/>
<text x="332.0" y="261" text-anchor="middle" font-size="13" fill="#1d3a5c">4.2</text>
<rect x="304" y="284" width="56" height="32" rx="4" fill="#fdf0dd" stroke="#c2703c" stroke-width="1.4"/>
<text x="332.0" y="305" text-anchor="middle" font-size="13" fill="#1d3a5c">7</text>
<text x="400" y="262" font-size="11" fill="#6b7f95">3.1은 원래 1번 칸,</text>
<text x="400" y="306" font-size="11" fill="#6b7f95">4.2는 원래 7번 칸에 있었다는 뜻</text>
<rect x="30" y="328" width="660" height="34" rx="8" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<text x="360" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#a04040">값 4개 + 위치 4개 = 여전히 숫자 8개. 절반을 지웠는데 저장량이 그대로다</text>
</svg>