<text x="572.0" y="105" text-anchor="middle" font-size="10" fill="#8fb0d4">7</text>
<rect x="124" y="112" width="56" height="32" rx="4" fill="#f3e3e3" stroke="#a04040" stroke-width="1.4"/>
