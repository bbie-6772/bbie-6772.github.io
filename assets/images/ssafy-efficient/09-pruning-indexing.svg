<text x="272.0" y="105" text-anchor="middle" font-size="10" fill="#8fb0d4">2</text>
<text x="332.0" y="105" text-anchor="middle" font-size="10" fill="#8fb0d4">3</text>
<text x="392.0" y="105" text-anchor="middle" font-size="10" fill="#8fb0d4">4</text>
<text x="452.0" y="105" text-anchor="middle" font-size="10" fill="#8fb0d4">5</text>
