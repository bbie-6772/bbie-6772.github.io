<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="372" rx="12" fill="#f7f9fb"/>
<text x="360" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">가지치기는 지운 자리를 기억하는 값이 따로 필요하다</text>
<text x="360" y="52" text-anchor="middle" font-size="11" fill="#6b7f95">기여도가 작은 값(2.0 미만)을 지우기로 하면</text>
<text x="30" y="88" font-size="12" font-weight="700" fill="#1d3a5c">원본 — 숫자 8개를 저장한다</text>
<text x="60" y="130" font-size="11" fill="#6b7f95">값</text>
<text x="60" y="105" font-size="10" fill="#8fb0d4">칸 번호</text>
<text x="152.0" y="105" text-anchor="middle" font-size="10" fill="#8fb0d4">0</text>
