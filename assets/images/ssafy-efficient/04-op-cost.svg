<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="350" rx="12" fill="#f7f9fb"/>
<text x="360" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">덧셈은 싸고 나눗셈은 비싸다</text>
<text x="360" y="52" text-anchor="middle" font-size="11" fill="#6b7f95">32비트 정수 연산기 기준 · 8비트 덧셈기를 1로 놓았을 때의 대략적인 배수</text>
<text x="185" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">지연 시간 (latency)</text>
<text x="185" y="100" text-anchor="middle" font-size="11" fill="#6b7f95">연산 하나가 끝나기까지 걸리는 시간</text>
