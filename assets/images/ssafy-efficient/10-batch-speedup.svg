<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="340" rx="12" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">줄인다고 항상 빨라지지는 않는다</text>
<text x="360" y="50" text-anchor="middle" font-size="11" fill="#6b7f95">Llama-3 8B · H100 80GB · FP16을 1로 놓았을 때의 속도 (자료의 사례를 옮긴 것)</text>
<text x="185" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">배치 크기 1 — 한 번에 한 요청</text>
<line x1="40" y1="272" x2="332" y2="272" stroke="#d5dde6" stroke-width="1.4"/>
<rect x="62" y="173.2" width="46" height="98.8" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="85" y="165.2" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.00×</text>
<text x="85" y="290" text-anchor="middle" font-size="11" fill="#40556b">FP16</text>
<rect x="132" y="147.5" width="46" height="124.5" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="155" y="139.5" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.26×</text>
<text x="155" y="290" text-anchor="middle" font-size="11" fill="#40556b">FP8</text>
<rect x="202" y="156.4" width="46" height="115.6" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="225" y="148.4" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.17×</text>
<text x="225" y="290" text-anchor="middle" font-size="11" fill="#40556b">INT8</text>
<rect x="272" y="117.8" width="46" height="154.2" rx="3" fill="#fdf0dd" stroke="#c2703c" stroke-width="1.4"/>
<text x="295" y="109.8" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.56×</text>
<text x="295" y="290" text-anchor="middle" font-size="11" fill="#40556b">INT4</text>
<text x="533" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">배치 크기 32 — 한 번에 32 요청</text>
<line x1="388" y1="272" x2="680" y2="272" stroke="#d5dde6" stroke-width="1.4"/>
<rect x="410" y="173.2" width="46" height="98.8" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="433" y="165.2" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.00×</text>
<text x="433" y="290" text-anchor="middle" font-size="11" fill="#40556b">FP16</text>
<rect x="480" y="128.7" width="46" height="143.3" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="503" y="120.7" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.45×</text>
<text x="503" y="290" text-anchor="middle" font-size="11" fill="#40556b">FP8</text>
<rect x="550" y="133.6" width="46" height="138.4" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.4"/>
<text x="573" y="125.6" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.40×</text>
<text x="573" y="290" text-anchor="middle" font-size="11" fill="#40556b">INT8</text>
<rect x="620" y="165.3" width="46" height="106.7" rx="3" fill="#fdf0dd" stroke="#c2703c" stroke-width="1.4"/>
<text x="643" y="157.3" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1.08×</text>
<text x="643" y="290" text-anchor="middle" font-size="11" fill="#40556b">INT4</text>
<text x="360" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#a04040">배치가 커지면 가장 많이 깎은 INT4가 꼴찌 근처로 내려온다</text>
<text x="360" y="328" text-anchor="middle" font-size="11" fill="#6b7f95">한 번에 하나씩 처리할 땐 메모리를 읽어오는 게 병목이고, 몰아서 처리할 땐 계산이 병목이기 때문</text>
</svg>