<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="400" rx="12" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">튜닝 방법은 원본 모델을 얼마나 건드리느냐로 줄 세울 수 있다</text>
<text x="200" y="66" font-size="10" fill="#8fb0d4">안 건드림</text>
<text x="420" y="66" text-anchor="end" font-size="10" fill="#8fb0d4">통째로 바꿈</text>
<text x="40" y="106" font-size="12" font-weight="700" fill="#1d3a5c">In-context 학습</text>
<rect x="200" y="94" width="220" height="12" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<rect x="200" y="94" width="17.6" height="12" rx="6" fill="#8fb0d4"/>
<text x="442" y="106" font-size="11" fill="#40556b">프롬프트만 바꾼다</text>
<text x="40" y="158" font-size="12" font-weight="700" fill="#1d3a5c">Prompt tuning</text>
<rect x="200" y="146" width="220" height="12" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<rect x="200" y="146" width="48.4" height="12" rx="6" fill="#8fb0d4"/>
<text x="442" y="158" font-size="11" fill="#40556b">입력에 가짜 토큰을 끼운다</text>
<rect x="22" y="180" width="676" height="48" rx="8" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="40" y="210" font-size="12" font-weight="700" fill="#1d3a5c">LoRA</text>
<rect x="200" y="198" width="220" height="12" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<rect x="200" y="198" width="96.8" height="12" rx="6" fill="#3d6fa8"/>
<text x="442" y="210" font-size="11" fill="#40556b">가중치 옆에 저랭크 행렬을 붙인다</text>
<text x="40" y="262" font-size="12" font-weight="700" fill="#1d3a5c">Adapter layer</text>
<rect x="200" y="250" width="220" height="12" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<rect x="200" y="250" width="154.0" height="12" rx="6" fill="#8fb0d4"/>
<text x="442" y="262" font-size="11" fill="#40556b">모델 안에 새 층을 끼운다</text>
<text x="40" y="314" font-size="12" font-weight="700" fill="#1d3a5c">Full fine tuning</text>
<rect x="200" y="302" width="220" height="12" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<rect x="200" y="302" width="220.0" height="12" rx="6" fill="#8fb0d4"/>
<text x="442" y="314" font-size="11" fill="#40556b">가중치를 전부 다시 학습한다</text>
<rect x="22" y="342" width="676" height="48" rx="8" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<text x="360" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">LoRA가 널리 쓰이는 자리는 이 줄의 가운데다</text>
<text x="360" y="383" text-anchor="middle" font-size="11" fill="#6b7f95">모델 구조를 안 바꾸면서도 표현력은 충분히 챙기는 지점</text>
</svg>