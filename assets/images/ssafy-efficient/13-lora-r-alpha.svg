<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="330" rx="12" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">LoRA에는 손잡이가 두 개 있다 — 크기와 세기</text>

<rect x="26" y="50" width="320" height="238" rx="10" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.8"/>
<text x="186" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6fa8">r (rank) — 어댑터를 얼마나 크게</text>
<text x="186" y="96" text-anchor="middle" font-size="11" fill="#6b7f95">A·B 행렬의 내부 차원 크기</text>

<rect x="70" y="116" width="14" height="86" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="77" y="220" text-anchor="middle" font-size="11" fill="#40556b">r = 4</text>
<rect x="150" y="116" width="30" height="86" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="165" y="220" text-anchor="middle" font-size="11" fill="#40556b">r = 16</text>
<rect x="240" y="116" width="58" height="86" rx="3" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="269" y="220" text-anchor="middle" font-size="11" fill="#40556b">r = 64</text>

<text x="186" y="244" text-anchor="middle" font-size="11" fill="#40556b">클수록 더 많이 배우지만</text>
<text x="186" y="261" text-anchor="middle" font-size="11" fill="#40556b">파라미터와 연산량도 같이 늘어난다</text>
<text x="186" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">보통 8, 16, 32 정도를 쓴다</text>

<rect x="374" y="50" width="320" height="238" rx="10" fill="#ffffff" stroke="#c2703c" stroke-width="1.8"/>
<text x="534" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#c2703c">alpha — 어댑터를 얼마나 세게</text>
<text x="534" y="96" text-anchor="middle" font-size="11" fill="#6b7f95">어댑터 출력에 곱해지는 크기 조절값</text>

<text x="534" y="136" text-anchor="middle" font-size="11" fill="#40556b">학습한 어댑터가 원래 모델에 줄 영향의 크기</text>
<line x1="410" y1="166" x2="658" y2="166" stroke="#d5dde6" stroke-width="6" stroke-linecap="round"/>
<line x1="410" y1="166" x2="574" y2="166" stroke="#c2703c" stroke-width="6" stroke-linecap="round"/>
<circle cx="574" cy="166" r="12" fill="#ffffff" stroke="#c2703c" stroke-width="2.4"/>
<text x="410" y="196" font-size="11" fill="#6b7f95">약하게</text>
<text x="658" y="196" text-anchor="end" font-size="11" fill="#6b7f95">세게</text>

<text x="534" y="244" text-anchor="middle" font-size="11" fill="#40556b">너무 세면 원래 능력을 덮어쓰고</text>
<text x="534" y="261" text-anchor="middle" font-size="11" fill="#40556b">너무 약하면 배운 게 안 나온다</text>
<text x="534" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">보통 alpha = 2r 로 두고 시작한다</text>

<text x="360" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">r은 어댑터 내부 크기, alpha는 어댑터 효과 크기 — 서로 다른 손잡이다</text>
</svg>
