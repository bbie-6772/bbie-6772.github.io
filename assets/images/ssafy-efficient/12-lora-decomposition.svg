<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="384" rx="12" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">큰 정사각형 하나를 학습하는 대신, 가느다란 두 개를 학습한다</text>

<text x="40" y="70" font-size="13" font-weight="700" fill="#a04040">Full fine tuning — W를 통째로 학습</text>
<rect x="60" y="86" width="120" height="120" rx="6" fill="#f3e3e3" stroke="#a04040" stroke-width="2"/>
<text x="120" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#a04040">W</text>
<text x="120" y="160" text-anchor="middle" font-size="11" fill="#40556b">d × d</text>
<text x="120" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">학습 파라미터 d²</text>
<text x="120" y="267" text-anchor="middle" font-size="11" fill="#6b7f95">d = 10,000 이면 1억 개</text>

<text x="300" y="70" font-size="13" font-weight="700" fill="#3d6fa8">LoRA — W는 얼려두고 A·B만 학습</text>
<rect x="320" y="86" width="120" height="120" rx="6" fill="#e8eef6" stroke="#8fb0d4" stroke-width="2" stroke-dasharray="6 4"/>
<text x="380" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#8fb0d4">W</text>
<text x="380" y="160" text-anchor="middle" font-size="11" fill="#6b7f95">고정 (학습 안 함)</text>
<text x="462" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#40556b">+</text>

<rect x="488" y="86" width="26" height="120" rx="4" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="2"/>
<text x="501" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">A</text>
<text x="501" y="222" text-anchor="middle" font-size="11" fill="#40556b">d × r</text>
<text x="530" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#40556b">·</text>
<rect x="546" y="86" width="120" height="26" rx="4" fill="#cfe0f2" stroke="#3d6fa8" stroke-width="2"/>
<text x="606" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">B</text>
<text x="606" y="130" text-anchor="middle" font-size="11" fill="#40556b">r × d</text>
<text x="580" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">학습 파라미터 2 × d × r</text>
<text x="580" y="267" text-anchor="middle" font-size="11" fill="#6b7f95">d = 10,000, r = 8 이면 16만 개</text>

<rect x="40" y="290" width="640" height="66" rx="8" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="360" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6fa8">1억 개 → 16만 개. 학습할 것이 600분의 1 아래로 줄어든다</text>
<text x="360" y="336" text-anchor="middle" font-size="11" fill="#6b7f95">원본 가중치는 건드리지 않으니 학습 전 지식이 지워질 일도 없고, 어댑터만 따로 저장하면 된다</text>
</svg>
