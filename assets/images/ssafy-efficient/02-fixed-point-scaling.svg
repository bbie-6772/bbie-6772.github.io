<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="350" rx="12" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">하드웨어는 정수만 더하고 곱한다 — 소수점은 사람의 약속일 뿐</text>
<text x="360" y="50" text-anchor="middle" font-size="11" fill="#6b7f95">8비트 고정소수점 (정수부 4, 소수부 4) · 배율 = 2⁻⁴</text>

<rect x="30" y="70" width="316" height="212" rx="10" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.8"/>
<text x="188" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6fa8">덧셈 — 그냥 맞는다</text>
<text x="50" y="122" font-size="12" fill="#40556b">하드웨어가 본 것</text>
<text x="50" y="144" font-size="13" font-weight="700" fill="#1d3a5c">56 + 20 = 76</text>
<text x="50" y="174" font-size="12" fill="#40556b">사람이 의도한 것</text>
<text x="50" y="196" font-size="13" font-weight="700" fill="#1d3a5c">3.5 + 1.25 = 4.75</text>
<text x="50" y="226" font-size="12" fill="#40556b">배율을 붙여 읽으면</text>
<text x="50" y="248" font-size="13" font-weight="700" fill="#3d6fa8">76 × 2⁻⁴ = 4.75</text>
<text x="50" y="270" font-size="11" fill="#6b7f95">배율이 한 번만 곱해져 있어 그대로 맞다</text>

<rect x="374" y="70" width="316" height="212" rx="10" fill="#ffffff" stroke="#a04040" stroke-width="1.8"/>
<text x="532" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#a04040">곱셈 — 한 번 더 손봐야 한다</text>
<text x="394" y="122" font-size="12" fill="#40556b">하드웨어가 본 것</text>
<text x="394" y="144" font-size="13" font-weight="700" fill="#1d3a5c">24 × 8 = 192</text>
<text x="394" y="174" font-size="12" fill="#40556b">사람이 의도한 것</text>
<text x="394" y="196" font-size="13" font-weight="700" fill="#1d3a5c">1.5 × 0.5 = 0.75</text>
<text x="394" y="226" font-size="12" fill="#40556b">배율을 한 번만 붙이면</text>
<text x="394" y="248" font-size="13" font-weight="700" fill="#a04040">192 × 2⁻⁴ = 12  ← 틀렸다</text>
<text x="394" y="270" font-size="11" fill="#6b7f95">배율이 두 번 곱해졌으니 192 × 2⁻⁸ = 0.75</text>

<rect x="30" y="298" width="660" height="34" rx="8" fill="#e8eef6" stroke="#d5dde6" stroke-width="1.2"/>
<text x="360" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">덧셈·뺄셈은 배율이 그대로 살아남고, 곱셈·나눗셈은 배율까지 같이 곱해지거나 나뉜다</text>
</svg>
