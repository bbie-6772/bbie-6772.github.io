<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#40556b"/></marker></defs>
<rect width="720" height="380" rx="12" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">언제 깎을 것인가 — 학습하면서 깎기 vs 다 학습하고 깎기</text>

