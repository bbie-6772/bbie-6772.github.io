<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="330" fill="#f7f9fb"/>
  <!-- 한 칸 50px, 격자 좌하단 (60,270) -> 5x4 = 250x200 -->
  <rect x="60" y="70" width="250" height="200" fill="#fff" stroke="#d5dde6" stroke-width="2"/>
  <path d="M110 70V270M160 70V270M210 70V270M260 70V270M60 120H310M60 170H310M60 220H310" stroke="#d5dde6"/>
  <text x="185" y="294" text-anchor="middle" font-size="13" fill="#6b7f95">5 × 4 격자 ( x 0~5, y 0~4 )</text>
  <!-- 시작점 (8,4) -> (460,70), 가장 가까운 점 (5,4) -> (310,70) -->
  <circle cx="460" cy="70" r="100" fill="#8fb0d4" opacity="0.2" stroke="#8fb0d4" stroke-dasharray="6 5"/>
  <path d="M310 70H460" stroke="#a04040" stroke-width="2.5"/>
  <circle cx="310" cy="70" r="6" fill="#a04040"/>
  <circle cx="460" cy="70" r="6" fill="#3d6fa8"/>
  <text x="460" y="48" text-anchor="middle" font-size="14" fill="#3d6fa8" font-weight="700">캐릭터 (8, 4)</text>
  <text x="306" y="48" text-anchor="end" font-size="14" fill="#a04040" font-weight="700">가장 가까운 점 (5, 4)</text>
  <text x="385" y="92" text-anchor="middle" font-size="13" fill="#a04040">거리 3</text>
  <text x="460" y="192" text-anchor="middle" font-size="13" fill="#6b7f95">청소 반경 2</text>
  <g font-size="14" fill="#1d3a5c">
    <text x="590" y="130">x: 8을 0~5로 자르면 5</text>
    <text x="590" y="156">y: 4를 0~4로 자르면 4</text>
    <text x="590" y="200" font-weight="700">3² = 9 &gt; 2² = 4</text>
    <text x="590" y="226">이 격자는 통째로 건너뛴다</text>
  </g>
</svg>
