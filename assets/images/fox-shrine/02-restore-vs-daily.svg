<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="270" fill="#f7f9fb"/>
  <g font-size="14" fill="#1d3a5c">
    <text x="250" y="36" text-anchor="middle" font-weight="700">1일차 아침</text>
    <text x="420" y="36" text-anchor="middle" font-weight="700">1일차 저녁</text>
    <text x="590" y="36" text-anchor="middle" font-weight="700">2일차 아침</text>

    <text x="24" y="100" font-weight="700">영구 복원</text>
    <text x="24" y="120" font-size="12" fill="#6b7f95">구역에 한 번 기록</text>
    <rect x="180" y="62" width="140" height="70" rx="8" fill="#fff" stroke="#d5dde6"/>
    <text x="250" y="102" text-anchor="middle" fill="#6b7f95">아직</text>
    <rect x="350" y="62" width="140" height="70" rx="8" fill="#fad06e" stroke="#d5dde6"/>
    <text x="420" y="102" text-anchor="middle">복원됨</text>
    <rect x="520" y="62" width="140" height="70" rx="8" fill="#fad06e" stroke="#3d6fa8" stroke-width="2"/>
    <text x="590" y="102" text-anchor="middle">복원됨 ( 그대로 )</text>

    <text x="24" y="190" font-weight="700">일상 오염</text>
    <text x="24" y="210" font-size="12" fill="#6b7f95">칸마다 지금 남은 양</text>
    <rect x="180" y="152" width="140" height="70" rx="8" fill="#ff8080" stroke="#d5dde6"/>
    <text x="250" y="192" text-anchor="middle">가득</text>
    <rect x="350" y="152" width="140" height="70" rx="8" fill="#fff" stroke="#d5dde6"/>
    <text x="420" y="192" text-anchor="middle">0</text>
    <rect x="520" y="152" width="140" height="70" rx="8" fill="#ffd9d9" stroke="#a04040" stroke-width="2"/>
    <text x="590" y="192" text-anchor="middle">낙엽이 조금 다시</text>
  </g>
  <text x="360" y="252" text-anchor="middle" font-size="13" fill="#6b7f95">날이 바뀌면 아래 줄만 다시 찬다</text>
</svg>
