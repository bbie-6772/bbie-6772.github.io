<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="300" fill="#f7f9fb"/>
  <rect x="40" y="70" width="270" height="140" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="2"/>
  <text x="175" y="102" text-anchor="middle" font-size="16" fill="#1d3a5c" font-weight="700">에디터 메인 스레드</text>
  <g font-size="13.5" fill="#1d3a5c" text-anchor="middle">
    <text x="175" y="134">자동화 명령을 실행하는 중</text>
    <text x="175" y="158"><tspan font-family="Consolas, monospace">Refresh()</tspan> → 테스트 실행 요청</text>
    <text x="175" y="186" fill="#a04040" font-weight="700">테스트가 끝나길 기다린다</text>
  </g>
  <rect x="410" y="70" width="270" height="140" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="2"/>
  <text x="545" y="102" text-anchor="middle" font-size="16" fill="#1d3a5c" font-weight="700">Test Runner</text>
  <g font-size="13.5" fill="#1d3a5c" text-anchor="middle">
    <text x="545" y="134">실행 준비는 메인 스레드에서</text>
    <text x="545" y="158">해야 하는데 자리가 안 난다</text>
    <text x="545" y="186" fill="#a04040" font-weight="700">메인 스레드가 비길 기다린다</text>
  </g>
  <path d="M310 110C350 90 370 90 404 108" fill="none" stroke="#a04040" stroke-width="2.5"/>
  <path d="M396 100L408 110L394 114" fill="none" stroke="#a04040" stroke-width="2.5"/>
  <path d="M410 172C370 192 350 192 316 174" fill="none" stroke="#a04040" stroke-width="2.5"/>
  <path d="M324 182L312 172L326 168" fill="none" stroke="#a04040" stroke-width="2.5"/>
  <text x="360" y="252" text-anchor="middle" font-size="14" fill="#1d3a5c">서로를 기다리니 둘 다 안 움직인다 ( CPU는 거의 놀고 있다 )</text>
  <text x="360" y="276" text-anchor="middle" font-size="13" fill="#6b7f95">화면에는 "Hold on (busy for 43:20)"만 떠 있었다</text>
</svg>
