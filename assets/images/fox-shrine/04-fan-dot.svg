<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#3d6fa8"/></marker>
  </defs>
  <rect width="720" height="340" fill="#f7f9fb"/>
  <!-- 원점 (120,200), 반지름 400, 반각 45도 -->
  <path d="M120 200L402.8 -82.8A400 400 0 0 1 402.8 482.8Z" fill="#8fb0d4" opacity="0.25"/>
  <path d="M120 200L360 -40M120 200L360 440" stroke="#8fb0d4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- 조준 방향 d -->
  <path d="M120 200H560" stroke="#3d6fa8" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="572" y="205" font-size="14" fill="#3d6fa8" font-weight="700">조준 방향 d ( 길이 1 )</text>
  <!-- v: 칸 중심 (380,90) -->
  <path d="M120 200L380 90" stroke="#1d3a5c" stroke-width="2"/>
  <circle cx="380" cy="90" r="6" fill="#1d3a5c"/>
  <text x="392" y="84" font-size="14" fill="#1d3a5c" font-weight="700">칸 중심</text>
  <text x="222" y="130" font-size="14" fill="#1d3a5c">v</text>
  <!-- 그림자 -->
  <path d="M380 90V200" stroke="#6b7f95" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M120 214H380" stroke="#a04040" stroke-width="4"/>
  <text x="250" y="236" text-anchor="middle" font-size="14" fill="#a04040" font-weight="700">그림자 = v · d</text>
  <circle cx="120" cy="200" r="6" fill="#3d6fa8"/>
  <text x="96" y="226" text-anchor="middle" font-size="13" fill="#6b7f95">캐릭터</text>
  <text x="300" y="20" font-size="13" fill="#6b7f95">반각 ( 전체 90°면 45° )</text>
  <rect x="24" y="276" width="672" height="46" rx="8" fill="#fff" stroke="#d5dde6"/>
  <text x="360" y="304" text-anchor="middle" font-size="14" fill="#1d3a5c">그림자가 |v| × cos( 반각 )보다 길거나 같으면 부채꼴 안이다</text>
</svg>
