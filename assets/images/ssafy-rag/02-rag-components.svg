<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#40556b"/></marker></defs>
<rect width="720" height="340" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">검색증강 언어모델의 네 부품</text>

<rect x="40" y="76" width="150" height="110" rx="8" fill="#ffffff" stroke="#c2703c" stroke-width="2"/>
