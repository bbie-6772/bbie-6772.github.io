<text x="115" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a04040">Datastore</text>

<path d="M194 131 H222" stroke="#40556b" stroke-width="1.6" marker-end="url(#ar2)"/>

<rect x="230" y="111" width="110" height="40" rx="6" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.8"/>
<text x="285" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">Index</text>
<rect x="238" y="52" width="94" height="34" rx="6" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="285" y="74" text-anchor="middle" font-size="12" fill="#1d3a5c">Query</text>
<path d="M285 88 V105" stroke="#40556b" stroke-width="1.4" marker-end="url(#ar2)"/>

<path d="M344 131 H372" stroke="#40556b" stroke-width="1.6" marker-end="url(#ar2)"/>

<rect x="380" y="111" width="110" height="40" rx="6" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.8"/>
<text x="435" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">LM</text>
<rect x="388" y="52" width="94" height="34" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="435" y="74" text-anchor="middle" font-size="12" fill="#40556b">사용자 질문</text>
<path d="M435 88 V105" stroke="#40556b" stroke-width="1.4" marker-end="url(#ar2)"/>

<path d="M494 131 H522" stroke="#40556b" stroke-width="1.6" marker-end="url(#ar2)"/>
<rect x="530" y="111" width="110" height="40" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="585" y="136" text-anchor="middle" font-size="12.5" fill="#1d3a5c">답변</text>

<line x1="40" y1="226" x2="680" y2="226" stroke="#d5dde6" stroke-width="1"/>
<text x="40" y="256" font-size="12" fill="#40556b"><tspan font-weight="700" fill="#a04040">Datastore</tspan>  가공되지 않은 원문 뭉치. 라벨링된 데이터셋도, 지식 그래프도 아니다</text>
<text x="40" y="280" font-size="12" fill="#40556b"><tspan font-weight="700" fill="#3d6fa8">Query</tspan>  검색에 쓸 질의. 사용자가 던진 질문과 같을 필요가 없다</text>
<text x="40" y="304" font-size="12" fill="#40556b"><tspan font-weight="700" fill="#4f8f68">Index</tspan>  빨리 찾으려고 미리 만들어 둔 색인. 검색 방식마다 만드는 법이 다르다</text>
<text x="40" y="328" font-size="12" fill="#40556b"><tspan font-weight="700" fill="#3d6fa8">LM</tspan>  찾아온 문서를 읽고 답을 다시 쓴다. 검색 결과를 그대로 뱉지 않는다</text>
