<text x="470" y="113" text-anchor="middle" font-size="12" fill="#1d3a5c">질의</text>
<text x="530" y="113" text-anchor="middle" font-size="11" fill="#6b7f95">[SEP]</text>
<text x="596" y="113" text-anchor="middle" font-size="12" fill="#1d3a5c">문서</text>
