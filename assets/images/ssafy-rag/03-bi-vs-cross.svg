<path d="M255 126 V144" stroke="#40556b" stroke-width="1.4" marker-end="url(#ar3)"/>
<rect x="46" y="150" width="110" height="34" rx="6" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.6"/>
<text x="101" y="172" text-anchor="middle" font-size="12" fill="#1d3a5c">인코더</text>
