<rect x="108" y="264" width="140" height="30" rx="6" fill="#eaf3ec" stroke="#4f8f68" stroke-width="1.6"/>
<text x="178" y="284" text-anchor="middle" font-size="11.5" fill="#1d3a5c">유사도 계산 단 한 번</text>
<text x="40" y="318" font-size="11.5" font-weight="700" fill="#4f8f68">문서 벡터를 미리 계산해 저장할 수 있다 — 빠름</text>
<text x="40" y="338" font-size="11.5" fill="#a04040">마지막에 한 번만 만나므로 정확도는 낮다</text>

<text x="392" y="76" font-size="13" font-weight="700" fill="#3d6fa8">크로스인코더 — 붙여서</text>
