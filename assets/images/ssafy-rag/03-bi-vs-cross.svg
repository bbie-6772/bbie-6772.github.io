<text x="255" y="172" text-anchor="middle" font-size="12" fill="#1d3a5c">인코더</text>
<path d="M101 186 V204" stroke="#40556b" stroke-width="1.4" marker-end="url(#ar3)"/>
<path d="M255 186 V204" stroke="#40556b" stroke-width="1.4" marker-end="url(#ar3)"/>
<rect x="56" y="210" width="90" height="24" rx="4" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<text x="101" y="227" text-anchor="middle" font-size="11" fill="#40556b">벡터 q</text>
<rect x="210" y="210" width="90" height="24" rx="4" fill="#ffffff" stroke="#d5dde6" stroke-width="1.2"/>
<text x="255" y="227" text-anchor="middle" font-size="11" fill="#40556b">벡터 d</text>
