<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#40556b"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">따로 인코딩할 것인가, 붙여서 인코딩할 것인가</text>
<line x1="360" y1="56" x2="360" y2="330" stroke="#d5dde6" stroke-width="1"/>

<text x="40" y="76" font-size="13" font-weight="700" fill="#3d6fa8">바이인코더 — 따로</text>
