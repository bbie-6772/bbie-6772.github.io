<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="720" height="350" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">검색을 붙여도 남는 네 가지 실패 지점</text>

<rect x="40" y="58" width="300" height="118" rx="8" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="60" y="86" font-size="12.5" font-weight="700" fill="#3d6fa8">1. 컨텍스트 길이</text>
<text x="60" y="112" font-size="11.5" fill="#40556b">찾아온 문서를 다 넣을 자리가 없다</text>
<text x="60" y="134" font-size="11.5" fill="#40556b">창을 늘리면 느려지고 비싸진다</text>
<text x="60" y="158" font-size="11.5" font-weight="700" fill="#4f8f68">잘 자르고 잘 고르는 쪽이 먼저다</text>

<rect x="380" y="58" width="300" height="118" rx="8" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="400" y="86" font-size="12.5" font-weight="700" fill="#3d6fa8">2. 검색 노이즈</text>
<text x="400" y="112" font-size="11.5" fill="#40556b">엉뚱한 문서가 섞여 들어온다</text>
<text x="400" y="134" font-size="11.5" fill="#40556b">답이 아예 없을 수도 있다</text>
<text x="400" y="158" font-size="11.5" font-weight="700" fill="#4f8f68">견디기 + 모르면 모른다고 하기</text>

<rect x="40" y="192" width="300" height="118" rx="8" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="60" y="220" font-size="12.5" font-weight="700" fill="#c2703c">3. 사전지식 충돌</text>
<text x="60" y="246" font-size="11.5" fill="#40556b">외운 사실과 문서 내용이 다르다</text>
<text x="60" y="268" font-size="11.5" fill="#40556b">모델은 자기가 외운 쪽을 답한다</text>
<text x="60" y="292" font-size="11.5" font-weight="700" fill="#4f8f68">접지 학습, 없으면 거절하도록</text>

<rect x="380" y="192" width="300" height="118" rx="8" fill="#ffffff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="400" y="220" font-size="12.5" font-weight="700" fill="#c2703c">4. 복합 추론</text>
<text x="400" y="246" font-size="11.5" fill="#40556b">답이 여러 문서에 흩어져 있다</text>
<text x="400" y="268" font-size="11.5" fill="#40556b">문서 자체가 틀렸을 수도 있다</text>
<text x="400" y="292" font-size="11.5" font-weight="700" fill="#4f8f68">정보 통합 + 반사실 견고성</text>

<text x="360" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#a04040">환각이 사라지는 게 아니라, 원인이 모델에서 검색으로 옮겨간다</text>
</svg>
