<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img" aria-label="속도 대입이 엔진의 밀어내기를 매 스텝 지운다">
  <rect x="0" y="0" width="720" height="320" rx="12" fill="#f7f9fb"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8fb0d4"/>
    </marker>
  </defs>
  <g font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="32" y="42" font-size="18" font-weight="700" fill="#1d3a5c">밀어내기가 쌓이지 못하는 이유</text>
    <text x="32" y="66" font-size="13" fill="#6b7f95">한 물리 스텝 안의 순서 — 내 FixedUpdate가 먼저, 엔진 시뮬레이션이 나중</text>

    <rect x="24" y="96" width="160" height="120" rx="10" fill="#ffffff" stroke="#a04040" stroke-width="1.5"/>
    <rect x="196" y="96" width="160" height="120" rx="10" fill="#ffffff" stroke="#8fb0d4" stroke-width="1.5"/>
    <rect x="368" y="96" width="160" height="120" rx="10" fill="#ffffff" stroke="#a04040" stroke-width="1.5"/>
    <rect x="540" y="96" width="160" height="120" rx="10" fill="#ffffff" stroke="#8fb0d4" stroke-width="1.5"/>

    <g font-size="11" font-weight="700">
      <text x="40" y="122" fill="#a04040">스텝 N — 내 코드</text>
      <text x="212" y="122" fill="#3d6fa8">스텝 N — 엔진</text>
      <text x="384" y="122" fill="#a04040">스텝 N+1 — 내 코드</text>
      <text x="556" y="122" fill="#3d6fa8">스텝 N+1 — 엔진</text>
    </g>

    <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#1d3a5c">
      <text x="40" y="150">v = 추적방향</text>
      <text x="212" y="150">v += 밀어내기</text>
      <text x="384" y="150">v = 추적방향</text>
      <text x="556" y="150">v += 밀어내기</text>
    </g>

    <g font-size="11" fill="#6b7f95">
      <text x="40" y="176">겹침은 아직 그대로</text>
      <text x="212" y="176">이 스텝에선 엔진이</text>
      <text x="212" y="192">이겨서 조금 벌어짐</text>
      <text x="384" y="176">대입이 밀어내기를</text>
      <text x="556" y="176">다시 처음부터</text>
    </g>
    <text x="384" y="192" font-size="11" font-weight="700" fill="#a04040">통째로 지운다</text>

    <line x1="186" y1="156" x2="194" y2="156" stroke="#8fb0d4" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="358" y1="156" x2="366" y2="156" stroke="#8fb0d4" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="530" y1="156" x2="538" y2="156" stroke="#8fb0d4" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="24" y="238" width="676" height="40" rx="8" fill="#e8eff7" stroke="#8fb0d4"/>
    <text x="44" y="263" font-size="12" fill="#1d3a5c">겹침이 풀리려면 밀어내기가 여러 스텝 쌓여야 하는데, 매 스텝 대입이 그걸 0으로 되돌린다</text>

    <text x="32" y="304" font-size="12" font-weight="700" fill="#1d3a5c">주기가 다른 두 축이 같은 값을 만질 때, 대입은 상대가 써둔 것을 지운다</text>
  </g>
</svg>
