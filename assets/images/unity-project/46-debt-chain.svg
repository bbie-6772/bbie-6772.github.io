<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="330" rx="12" fill="#f7f9fb"/>
  <text x="30" y="42" font-size="17" font-weight="700" fill="#1d3a5c">한 줄 캐싱이 네 번 청구되기까지</text>
  <text x="30" y="64" font-size="12.5" fill="#6b7f95">기록해둔 대가는 사라지지 않는다. 청구 시점만 미뤄질 뿐이다.</text>

  <line x1="40" y1="112" x2="680" y2="112" stroke="#d5dde6" stroke-width="2"/>

  <circle cx="90" cy="112" r="8" fill="#3d6fa8"/>
  <circle cx="270" cy="112" r="8" fill="#8fb0d4"/>
  <circle cx="450" cy="112" r="8" fill="#a04040"/>
  <circle cx="630" cy="112" r="8" fill="#a04040"/>

  <text x="90" y="96" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">ADR 0008</text>
  <text x="270" y="96" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">ADR 0016</text>
  <text x="450" y="96" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">ADR 0023</text>
  <text x="630" y="96" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">ADR 0027</text>

  <rect x="30" y="140" width="150" height="128" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="46" y="164" font-size="12.5" font-weight="700" fill="#3d6fa8">빌린 날</text>
  <text x="46" y="188" font-size="12" fill="#1d3a5c">WaitForSeconds를</text>
  <text x="46" y="206" font-size="12" fill="#1d3a5c">필드에 캐싱</text>
  <text x="46" y="232" font-size="11.5" fill="#6b7f95">대가: 런타임에</text>
  <text x="46" y="248" font-size="11.5" fill="#6b7f95">간격을 못 바꾼다</text>

  <rect x="210" y="140" width="150" height="128" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="226" y="164" font-size="12.5" font-weight="700" fill="#3d6fa8">미룬 날</text>
  <text x="226" y="188" font-size="12" fill="#1d3a5c">"웨이브 만들 때</text>
  <text x="226" y="206" font-size="12" fill="#1d3a5c">갚자"</text>
  <text x="226" y="232" font-size="11.5" fill="#6b7f95">스포너도 같은</text>
  <text x="226" y="248" font-size="11.5" fill="#6b7f95">패턴을 쓰고 있었다</text>

  <rect x="390" y="140" width="150" height="128" rx="10" fill="#ffffff" stroke="#a04040"/>
  <text x="406" y="164" font-size="12.5" font-weight="700" fill="#a04040">먼저 온 청구서</text>
  <text x="406" y="188" font-size="12" fill="#1d3a5c">공격속도 카드가</text>
  <text x="406" y="206" font-size="12" fill="#1d3a5c">웨이브보다 빨랐다</text>
  <text x="406" y="232" font-size="11.5" fill="#6b7f95">_wait 재생성으로</text>
  <text x="406" y="248" font-size="11.5" fill="#6b7f95">일단 막음</text>

  <rect x="570" y="140" width="120" height="128" rx="10" fill="#ffffff" stroke="#a04040"/>
  <text x="586" y="164" font-size="12.5" font-weight="700" fill="#a04040">네 번째</text>
  <text x="586" y="188" font-size="12" fill="#1d3a5c">웨이브가 간격을</text>
  <text x="586" y="206" font-size="12" fill="#1d3a5c">데이터로 바꾼다</text>
  <text x="586" y="232" font-size="11.5" fill="#6b7f95">같은 자리를</text>
  <text x="586" y="248" font-size="11.5" fill="#6b7f95">또 고쳤다</text>

  <text x="30" y="302" font-size="12.5" fill="#3d6fa8">기록해둔 덕에 매번 어디를 고칠지는 알았다. 대신 같은 자리를 네 번 고쳤다.</text>
</svg>
