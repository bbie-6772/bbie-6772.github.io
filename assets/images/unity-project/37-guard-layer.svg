<svg viewBox="0 0 720 340" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="gl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7f95"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <text x="30" y="40" font-size="19" font-weight="700" fill="#1d3a5c">막는 층이 다르면 버그의 운명이 다르다</text>

  <rect x="30" y="66" width="660" height="112" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="50" y="92" font-size="14" font-weight="700" fill="#3d6fa8">접근 제한 — 컴파일 타임</text>
  <line x1="50" y1="128" x2="530" y2="128" stroke="#6b7f95" stroke-width="2" marker-end="url(#gl)"/>
  <circle cx="120" cy="128" r="7" fill="#3d6fa8"/>
  <text x="96" y="152" font-size="12" fill="#3d6fa8" font-weight="700">여기서 빨간 줄</text>
  <text x="96" y="112" font-size="11" fill="#6b7f95">코드 작성</text>
  <text x="300" y="112" font-size="11" fill="#6b7f95">빌드</text>
  <text x="450" y="112" font-size="11" fill="#6b7f95">플레이</text>
  <text x="556" y="133" font-size="12" fill="#3d6fa8" font-weight="700">버그가 존재하지 않는다</text>

  <rect x="30" y="196" width="660" height="112" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="50" y="222" font-size="14" font-weight="700" fill="#a04040">유효성 플래그 · 널 검사 — 런타임</text>
  <line x1="50" y1="258" x2="530" y2="258" stroke="#6b7f95" stroke-width="2" marker-end="url(#gl)"/>
  <circle cx="470" cy="258" r="7" fill="#a04040"/>
  <text x="430" y="282" font-size="12" fill="#a04040" font-weight="700">여기서 로그 한 줄</text>
  <text x="96" y="242" font-size="11" fill="#6b7f95">코드 작성</text>
  <text x="300" y="242" font-size="11" fill="#6b7f95">빌드</text>
  <text x="450" y="242" font-size="11" fill="#6b7f95">플레이</text>
  <text x="556" y="263" font-size="12" fill="#a04040" font-weight="700">이미 잘못 불린 뒤다</text>
</svg>
