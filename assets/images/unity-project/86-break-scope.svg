<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-label="break가 for만 빠져나가고 while은 계속 도는 구조">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#1d3a5c">break는 for만 빠져나가야 한다</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a04040"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6fa8"/>
    </marker>
  </defs>

  <rect x="86" y="64" width="520" height="192" rx="10" fill="#ffffff" stroke="#3d6fa8" stroke-width="2"/>
  <text x="104" y="88" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#3d6fa8">while — 스포너가 사는 동안 계속 돈다</text>

  <rect x="110" y="100" width="380" height="106" rx="8" fill="#f7f9fb" stroke="#6b7f95"/>
  <text x="126" y="122" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d3a5c">for — 이번에 낼 마리 수만큼</text>

  <rect x="126" y="132" width="344" height="30" rx="6" fill="#ffffff" stroke="#a04040"/>
  <text x="140" y="152" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#a04040">if (AliveCount &gt;= 600) break;</text>
  <text x="140" y="186" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d3a5c">Spawn(); ++AliveCount;</text>

  <text x="126" y="236" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d3a5c">yield return _wait;</text>

  <path d="M 470 147 L 530 147 L 530 232 L 250 232" fill="none" stroke="#a04040" stroke-width="2" marker-end="url(#a2)"/>
  <text x="560" y="192" text-anchor="middle" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#a04040">break</text>

  <path d="M 86 244 L 58 244 L 58 76 L 82 76" fill="none" stroke="#3d6fa8" stroke-width="2" marker-end="url(#a3)"/>
  <text x="30" y="164" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#3d6fa8">다시</text>

  <line x1="32" y1="284" x2="688" y2="284" stroke="#d5dde6"/>
  <text x="360" y="308" text-anchor="middle" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#6b7f95">while까지 빠져나가면 좀비가 죽어 자리가 나도 다시는 안 만든다</text>
</svg>
