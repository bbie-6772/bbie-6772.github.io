<svg viewBox="0 0 720 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="cb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d6fa8"/>
    </marker>
    <marker id="cr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a04040"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="300" rx="12" fill="#f7f9fb"/>
  <text x="36" y="42" font-size="19" font-weight="700" fill="#1d3a5c">화살표가 양쪽으로 나면 좀비는 스포너 없이 죽지 못한다</text>

  <text x="36" y="82" font-size="13" fill="#a04040" font-weight="700">후보 2 — 좀비가 스포너를 참조</text>
  <rect x="36" y="96" width="130" height="52" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="101" y="127" font-size="13" text-anchor="middle" fill="#1d3a5c">스포너</text>
  <rect x="236" y="96" width="130" height="52" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="301" y="127" font-size="13" text-anchor="middle" fill="#1d3a5c">좀비</text>
  <line x1="170" y1="113" x2="230" y2="113" stroke="#a04040" stroke-width="2" marker-end="url(#cr)"/>
  <line x1="232" y1="133" x2="172" y2="133" stroke="#a04040" stroke-width="2" marker-end="url(#cr)"/>
  <text x="386" y="118" font-size="13" fill="#a04040">서로를 안다</text>
  <text x="386" y="138" font-size="12" fill="#6b7f95">씬 배치·보스 소환·테스트가 막힌다</text>

  <text x="36" y="196" font-size="13" fill="#3d6fa8" font-weight="700">후보 4 — 콜백 주입 ( 채택 )</text>
  <rect x="36" y="210" width="130" height="52" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="101" y="241" font-size="13" text-anchor="middle" fill="#1d3a5c">스포너</text>
  <rect x="236" y="210" width="130" height="52" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="301" y="234" font-size="13" text-anchor="middle" fill="#1d3a5c">좀비</text>
  <text x="301" y="252" font-size="10" text-anchor="middle" fill="#6b7f95">상대 타입을 모름</text>
  <line x1="170" y1="236" x2="230" y2="236" stroke="#3d6fa8" stroke-width="2" marker-end="url(#cb)"/>
  <text x="200" y="226" font-size="10" text-anchor="middle" fill="#3d6fa8" font-family="monospace">함수 하나</text>
  <text x="386" y="232" font-size="13" fill="#3d6fa8">화살표가 한 방향뿐이다</text>
  <text x="386" y="252" font-size="12" fill="#6b7f95">스포너 없이 놓아도 좀비는 그냥 산다</text>
</svg>
