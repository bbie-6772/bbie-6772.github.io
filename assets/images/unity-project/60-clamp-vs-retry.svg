<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="330" rx="12" fill="#f7f9fb"/>

  <text x="30" y="40" font-size="17" font-weight="700" fill="#1d3a5c">벽 밖에 생기는 좀비를 어떻게 막을까</text>
  <text x="30" y="62" font-size="12.5" fill="#6b7f95">플레이어를 중심으로 한 원에서 뽑으므로, 가장자리에 서면 원의 절반이 맵 밖이다.</text>

  <rect x="40" y="86" width="200" height="170" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="60" y="114" font-size="13" font-weight="700" fill="#a04040">벽 충돌 끄기</text>
  <text x="60" y="142" font-size="12" fill="#1d3a5c">밖에 생겨도 통과해서</text>
  <text x="60" y="162" font-size="12" fill="#1d3a5c">들어온다</text>
  <text x="60" y="196" font-size="12" fill="#a04040">벽이 벽 역할을 잃는다</text>
  <text x="60" y="218" font-size="12" fill="#6b7f95">숨는 플레이가 사라진다</text>
  <text x="60" y="242" font-size="12.5" font-weight="700" fill="#a04040">기각</text>

  <rect x="260" y="86" width="200" height="170" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="280" y="114" font-size="13" font-weight="700" fill="#a04040">밖이면 다시 뽑기</text>
  <text x="280" y="142" font-size="12" fill="#1d3a5c">될 때까지 다시 뽑는다</text>
  <text x="280" y="176" font-size="12" fill="#6b7f95">분포는 가장 자연스럽다</text>
  <text x="280" y="200" font-size="12" fill="#a04040">한 번에 끝날 때도,</text>
  <text x="280" y="220" font-size="12" fill="#a04040">여러 번 걸릴 때도 있다</text>
  <text x="280" y="242" font-size="12.5" font-weight="700" fill="#a04040">기각</text>

  <rect x="480" y="86" width="200" height="170" rx="10" fill="#ffffff" stroke="#3d6fa8"/>
  <text x="500" y="114" font-size="13" font-weight="700" fill="#3d6fa8">경계 안으로 밀기</text>
  <text x="500" y="142" font-size="12" fill="#1d3a5c">밖이면 맵 끝으로</text>
  <text x="500" y="162" font-size="12" fill="#1d3a5c">붙여버린다</text>
  <text x="500" y="196" font-size="12" fill="#6b7f95">모서리에 몰리는 대신</text>
  <text x="500" y="220" font-size="12" fill="#3d6fa8">걸리는 시간이 항상 같다</text>
  <text x="500" y="242" font-size="12.5" font-weight="700" fill="#3d6fa8">채택</text>

  <text x="40" y="292" font-size="12.5" fill="#3d6fa8">고른 이유는 빠르기가 아니다. 곧 성능을 잴 참이라 &quot;때에 따라 다른 코드&quot;를 넣고 싶지 않았다.</text>
</svg>
