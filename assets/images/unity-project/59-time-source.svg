<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <defs>
    <marker id="t1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#a04040"/>
    </marker>
    <marker id="t2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#3d6fa8"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="17" font-weight="700" fill="#1d3a5c">시계가 둘이면 둘은 반드시 어긋난다</text>

  <text x="40" y="80" font-size="13.5" font-weight="700" fill="#a04040">코루틴으로 웨이브를 셀 때</text>
  <rect x="40" y="94" width="290" height="160" rx="10" fill="#ffffff" stroke="#a04040"/>
  <text x="60" y="124" font-size="12.5" fill="#1d3a5c">화면의 남은 시간</text>
  <text x="60" y="146" font-size="11.5" fill="#6b7f95">GameTimer가 센다</text>
  <line x1="185" y1="158" x2="185" y2="176" stroke="#a04040" stroke-width="2" marker-end="url(#t1)"/>
  <text x="60" y="196" font-size="12.5" fill="#1d3a5c">웨이브 전환 시각</text>
  <text x="60" y="218" font-size="11.5" fill="#6b7f95">코루틴이 따로 센다</text>
  <text x="60" y="242" font-size="12" fill="#a04040">정지·지연에서 서서히 벌어진다</text>

  <text x="390" y="80" font-size="13.5" font-weight="700" fill="#3d6fa8">Update 비교 한 번으로 바꾼 뒤</text>
  <rect x="390" y="94" width="290" height="160" rx="10" fill="#ffffff" stroke="#3d6fa8"/>
  <text x="410" y="124" font-size="12.5" font-weight="700" fill="#3d6fa8">GameTimer.Elapsed</text>
  <text x="410" y="146" font-size="11.5" fill="#6b7f95">시간을 세는 곳은 여기 하나뿐</text>
  <line x1="470" y1="158" x2="470" y2="180" stroke="#3d6fa8" stroke-width="2" marker-end="url(#t2)"/>
  <line x1="600" y1="158" x2="600" y2="180" stroke="#3d6fa8" stroke-width="2" marker-end="url(#t2)"/>
  <text x="410" y="200" font-size="12" fill="#1d3a5c">화면 표시</text>
  <text x="545" y="200" font-size="12" fill="#1d3a5c">웨이브 전환</text>
  <text x="410" y="230" font-size="12" fill="#3d6fa8">멈추면 둘 다 멈춘다</text>

  <rect x="40" y="276" width="640" height="42" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="60" y="303" font-size="12.5" fill="#1d3a5c">시간의 출처가 하나면, 정지 처리도 한 곳만 맞추면 전부 따라온다.</text>
</svg>
