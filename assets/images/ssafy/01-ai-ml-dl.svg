<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="350" rx="12" fill="#f7f9fb"/><circle cx="175" cy="175" r="140" fill="#dbe7f3" stroke="#7ba3cc" stroke-width="2"/><circle cx="175" cy="191" r="96" fill="#b9d0e8" stroke="#5b8ac0" stroke-width="2"/><circle cx="175" cy="209" r="52" fill="#8fb3d9" stroke="#3d6fa8" stroke-width="2"/><text x="175" y="77" text-anchor="middle" font-size="21" font-weight="700" fill="#274b73">AI</text><text x="175" y="129" text-anchor="middle" font-size="19" font-weight="700" fill="#274b73">ML</text><text x="175" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#12314f">DL</text><line x1="352" y1="46" x2="352" y2="80" stroke="#3d6fa8" stroke-width="3"/><text x="366" y="60" font-size="15" font-weight="700" fill="#1d3a5c">AI</text><text x="366" y="80" font-size="13.5" fill="#40556b">목표를 이루려고 판단·예측하는 시스템 전부</text><line x1="352" y1="121" x2="352" y2="155" stroke="#3d6fa8" stroke-width="3"/><text x="366" y="135" font-size="15" font-weight="700" fill="#1d3a5c">ML</text><text x="366" y="155" font-size="13.5" fill="#40556b">그중 데이터를 보고 규칙을 스스로 배우는 방식</text><line x1="352" y1="196" x2="352" y2="230" stroke="#3d6fa8" stroke-width="3"/><text x="366" y="210" font-size="15" font-weight="700" fill="#1d3a5c">DL</text><text x="366" y="230" font-size="13.5" fill="#40556b">그중 신경망이라는 함수를 쓰는 방식</text><line x1="352" y1="271" x2="352" y2="305" stroke="#3d6fa8" stroke-width="3"/><text x="366" y="285" font-size="15" font-weight="700" fill="#1d3a5c">AI지만 ML이 아닌 것</text><text x="366" y="305" font-size="13.5" fill="#40556b">규칙(if/else) 기반 · 휴리스틱 탐색 알고리즘</text></svg>