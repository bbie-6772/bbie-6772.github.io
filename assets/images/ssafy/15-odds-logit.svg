<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="356" rx="12" fill="#f7f9fb"/><defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9fb0c0"/></marker></defs><text x="134" y="75" text-anchor="end" font-size="13.5" font-weight="700" fill="#1d3a5c">확률 p</text><line x1="150" y1="70" x2="530" y2="70" stroke="#4a7fb5" stroke-width="3"/><circle cx="150" cy="70" r="5" fill="#4a7fb5"/><circle cx="530" cy="70" r="5" fill="#4a7fb5"/><text x="150" y="56" text-anchor="middle" font-size="13" fill="#40556b">0</text><text x="530" y="56" text-anchor="middle" font-size="13" fill="#40556b">1</text><text x="150" y="94" font-size="12.5" fill="#5b7a99">0에서 1 사이에 갇혀 있다</text><path d="M340.0 104 L340.0 136" stroke="#9fb0c0" stroke-width="2" marker-end="url(#a3)"/><text x="352.0" y="126" font-size="12" fill="#6b7684">실패 대비 성공이 몇 배인가</text><text x="134" y="167" text-anchor="end" font-size="13.5" font-weight="700" fill="#1d3a5c">오즈 = p / (1−p)</text><line x1="150" y1="162" x2="530" y2="162" stroke="#4f8f68" stroke-width="3"/><circle cx="150" cy="162" r="5" fill="#4f8f68"/><circle cx="530" cy="162" r="5" fill="#4f8f68"/><text x="150" y="148" text-anchor="middle" font-size="13" fill="#40556b">0</text><text x="530" y="148" text-anchor="middle" font-size="13" fill="#40556b">∞</text><text x="150" y="186" font-size="12.5" fill="#5b7a99">0부터 무한대까지 늘어난다</text><path d="M340.0 196 L340.0 228" stroke="#9fb0c0" stroke-width="2" marker-end="url(#a3)"/><text x="352.0" y="218" font-size="12" fill="#6b7684">로그를 씌운다</text><text x="134" y="259" text-anchor="end" font-size="13.5" font-weight="700" fill="#1d3a5c">로짓 = log(오즈)</text><line x1="150" y1="254" x2="530" y2="254" stroke="#c2703c" stroke-width="3"/><circle cx="150" cy="254" r="5" fill="#c2703c"/><circle cx="530" cy="254" r="5" fill="#c2703c"/><text x="150" y="240" text-anchor="middle" font-size="13" fill="#40556b">−∞</text><text x="530" y="240" text-anchor="middle" font-size="13" fill="#40556b">+∞</text><text x="150" y="278" font-size="12.5" fill="#5b7a99">음수·양수 전부 쓸 수 있다 → 직선을 붙일 수 있다!</text><text x="360" y="336" text-anchor="middle" font-size="13.5" fill="#40556b">확률을 로짓으로 바꾸면 범위 제한이 사라져서, 그 위에 선형회귀를 그대로 얹을 수 있다</text></svg>