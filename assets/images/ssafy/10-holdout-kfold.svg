<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="436" rx="12" fill="#f7f9fb"/><text x="120" y="40" font-size="14" font-weight="700" fill="#1d3a5c">검증셋(hold-out) — 딱 한 번 잘라 쓴다</text><rect x="120" y="54" width="322.0" height="34" fill="#4a7fb5" rx="4"/><rect x="442.0" y="54" width="138.0" height="34" fill="#e0a878" rx="4"/><text x="281.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">훈련</text><text x="511.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">검증</text><text x="120" y="108" font-size="12" fill="#5b7a99">한 번만 잘라 쓰기 때문에, 어디를 자르느냐에 따라 결과가 크게 출렁인다</text><text x="120" y="140" font-size="14" font-weight="700" fill="#1d3a5c">K-겹 교차검증 (K=5) — 다섯 번 돌아가며 전부 검증에 쓴다</text><rect x="121.5" y="154" width="89.0" height="34" fill="#e0a878" rx="4"/><rect x="213.5" y="154" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="305.5" y="154" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="397.5" y="154" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="489.5" y="154" width="89.0" height="34" fill="#4a7fb5" rx="4"/><text x="108" y="176" text-anchor="end" font-size="12" fill="#5b7a99">1회</text><text x="594" y="176" font-size="12" fill="#5b7a99">오류 1</text><rect x="121.5" y="196" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="213.5" y="196" width="89.0" height="34" fill="#e0a878" rx="4"/><rect x="305.5" y="196" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="397.5" y="196" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="489.5" y="196" width="89.0" height="34" fill="#4a7fb5" rx="4"/><text x="108" y="218" text-anchor="end" font-size="12" fill="#5b7a99">2회</text><text x="594" y="218" font-size="12" fill="#5b7a99">오류 2</text><rect x="121.5" y="238" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="213.5" y="238" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="305.5" y="238" width="89.0" height="34" fill="#e0a878" rx="4"/><rect x="397.5" y="238" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="489.5" y="238" width="89.0" height="34" fill="#4a7fb5" rx="4"/><text x="108" y="260" text-anchor="end" font-size="12" fill="#5b7a99">3회</text><text x="594" y="260" font-size="12" fill="#5b7a99">오류 3</text><rect x="121.5" y="280" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="213.5" y="280" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="305.5" y="280" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="397.5" y="280" width="89.0" height="34" fill="#e0a878" rx="4"/><rect x="489.5" y="280" width="89.0" height="34" fill="#4a7fb5" rx="4"/><text x="108" y="302" text-anchor="end" font-size="12" fill="#5b7a99">4회</text><text x="594" y="302" font-size="12" fill="#5b7a99">오류 4</text><rect x="121.5" y="322" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="213.5" y="322" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="305.5" y="322" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="397.5" y="322" width="89.0" height="34" fill="#4a7fb5" rx="4"/><rect x="489.5" y="322" width="89.0" height="34" fill="#e0a878" rx="4"/><text x="108" y="344" text-anchor="end" font-size="12" fill="#5b7a99">5회</text><text x="594" y="344" font-size="12" fill="#5b7a99">오류 5</text><text x="350.0" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">다섯 개의 오류를 평균 → 훨씬 안정적인 성능 추정</text><rect x="120" y="404" width="16" height="12" fill="#4a7fb5" rx="2"/><text x="142" y="415" font-size="12" fill="#5b7a99">훈련에 사용</text><rect x="230" y="404" width="16" height="12" fill="#e0a878" rx="2"/><text x="252" y="415" font-size="12" fill="#5b7a99">검증에 사용</text></svg>