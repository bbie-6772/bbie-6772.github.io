<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-label="0에서 1로 1, 0에서 2로 3, 1에서 2로 10인 그래프에서 1번을 확정한 뒤 비교 없이 덮어쓰면 이미 찾아 둔 costs[2]=3이 11로 바뀌고, 더 작을 때만 갱신하면 3이 유지된다">
  <style>
    .bg { fill: #f7f9fb; }
    .card { fill: #ffffff; stroke: #d5dde6; }
    .t { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d3a5c; }
    .sub { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b7f95; }
    .m { font-family: "Cascadia Mono", Consolas, monospace; fill: #1d3a5c; }
    .c { fill: #eef2f6; stroke: #d5dde6; }
    .hit { fill: #dce7f4; stroke: #3d6fa8; stroke-width: 1.5; }
    .bad { fill: #f6e6e6; stroke: #a04040; stroke-width: 1.5; }
    .r { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #a04040; }
    .rm { font-family: "Cascadia Mono", Consolas, monospace; fill: #a04040; }
  </style>
  <defs>
    <marker id="a70" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d6fa8"/></marker>
  </defs>

  <rect class="bg" width="720" height="300" rx="10"/>
  <text class="t" x="24" y="34" font-size="16" font-weight="600">비싼 간선이 나중에 처리되면 덮어쓰기가 터진다</text>
  <text class="sub" x="24" y="56" font-size="13">더 작을 때만 갱신하지 않으면, 나중에 본 값이 이긴다</text>

  <rect class="card" x="20" y="72" width="260" height="212" rx="8"/>
  <circle class="c" cx="70" cy="170" r="20"/><text class="m" x="70" y="175" font-size="13" text-anchor="middle">0</text>
  <circle class="c" cx="210" cy="110" r="20"/><text class="m" x="210" y="115" font-size="13" text-anchor="middle">1</text>
  <circle class="c" cx="210" cy="240" r="20"/><text class="m" x="210" y="245" font-size="13" text-anchor="middle">2</text>
  <line x1="88" y1="160" x2="190" y2="118" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a70)"/><text class="m" x="130" y="128" font-size="12">1</text>
  <line x1="88" y1="182" x2="190" y2="232" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a70)"/><text class="m" x="128" y="222" font-size="12">3</text>
  <line x1="210" y1="130" x2="210" y2="218" stroke="#a04040" stroke-width="1.5" marker-end="url(#a70)"/><text class="rm" x="220" y="180" font-size="12">10</text>

  <rect class="card" x="300" y="72" width="400" height="212" rx="8"/>
  <text class="sub" x="320" y="98" font-size="11">단계</text>
  <text class="sub" x="560" y="98" font-size="11" text-anchor="middle">costs[1]</text>
  <text class="sub" x="640" y="98" font-size="11" text-anchor="middle">costs[2]</text>
  <text class="t" x="320" y="132" font-size="12">0번 확정, 이웃 갱신</text>
  <rect class="c" x="530" y="112" width="60" height="30" rx="4"/><text class="m" x="560" y="132" font-size="12" text-anchor="middle">1</text>
  <rect class="c" x="610" y="112" width="60" height="30" rx="4"/><text class="m" x="640" y="132" font-size="12" text-anchor="middle">3</text>
  <text class="t" x="320" y="182" font-size="12">1번 확정 — 덮어쓰기</text>
  <rect class="c" x="530" y="162" width="60" height="30" rx="4"/><text class="m" x="560" y="182" font-size="12" text-anchor="middle">1</text>
  <rect class="bad" x="610" y="162" width="60" height="30" rx="4"/><text class="rm" x="640" y="182" font-size="12" text-anchor="middle">11</text>
  <text class="t" x="320" y="232" font-size="12">1번 확정 — 작을 때만</text>
  <rect class="c" x="530" y="212" width="60" height="30" rx="4"/><text class="m" x="560" y="232" font-size="12" text-anchor="middle">1</text>
  <rect class="hit" x="610" y="212" width="60" height="30" rx="4"/><text class="m" x="640" y="232" font-size="12" text-anchor="middle">3</text>
  <text class="sub" x="500" y="270" font-size="11" text-anchor="middle">값이 작은 간선만 있는 그래프에서는 티가 나지 않는다</text>
</svg>
