<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="360" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">forward에서 결과를 안 담으면 — 세탁기만 돌고 옷은 그대로</text><rect x="40" y="76" width="300" height="190" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="60" y="104" text-anchor="start" font-size="14" font-weight="700" fill="#a04040">❌ self.층1(x)</text><text x="60" y="136" text-anchor="start" font-size="12" fill="#1d3a5c">x (5×2)</text><text x="140" y="136" text-anchor="start" font-size="12" fill="#5b7a99">층1 통과</text><text x="60" y="154" text-anchor="start" font-size="11.5" fill="#a04040">결과 (5×16) 버려짐</text><text x="60" y="178" text-anchor="start" font-size="12" fill="#1d3a5c">x (5×2)</text><text x="140" y="178" text-anchor="start" font-size="12" fill="#5b7a99">활성화 통과</text><text x="60" y="196" text-anchor="start" font-size="11.5" fill="#a04040">여전히 원본</text><text x="60" y="220" text-anchor="start" font-size="12" fill="#1d3a5c">x (5×2)</text><text x="140" y="220" text-anchor="start" font-size="12" fill="#5b7a99">층2 통과</text><text x="60" y="238" text-anchor="start" font-size="11.5" fill="#a04040">💥 16을 기대했는데 2가 옴</text><rect x="380" y="76" width="300" height="190" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="400" y="104" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">✅ x = self.층1(x)</text><text x="400" y="136" text-anchor="start" font-size="12" fill="#1d3a5c">x (5×2)</text><text x="480" y="136" text-anchor="start" font-size="12" fill="#5b7a99">층1 통과</text><text x="400" y="154" text-anchor="start" font-size="11.5" fill="#4f8f68">x (5×16)</text><text x="400" y="178" text-anchor="start" font-size="12" fill="#1d3a5c">x (5×16)</text><text x="480" y="178" text-anchor="start" font-size="12" fill="#5b7a99">활성화 통과</text><text x="400" y="196" text-anchor="start" font-size="11.5" fill="#4f8f68">x (5×16)</text><text x="400" y="220" text-anchor="start" font-size="12" fill="#1d3a5c">x (5×16)</text><text x="480" y="220" text-anchor="start" font-size="12" fill="#5b7a99">층2 통과</text><text x="400" y="238" text-anchor="start" font-size="11.5" fill="#4f8f68">x (5×2) ✓</text><text x="40" y="300" text-anchor="start" font-size="13" fill="#1d3a5c">에러 메시지의 (5x2 and 16x2)가 정확히 이걸 말해준다 — 넣은 모양과 기대한 모양</text><text x="360" y="338" text-anchor="middle" font-size="13.5" fill="#40556b">습관으로 만들 것 — forward의 모든 줄은 x = 로 시작한다</text></svg>