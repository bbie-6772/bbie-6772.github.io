<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="408" rx="12" fill="#f7f9fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7a99"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2703c"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Autograd — 계산할 때 영수증을 쓰고, 거꾸로 읽는다</text><rect x="40" y="78" width="108" height="44" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="94.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">x</text><path d="M150 100 L168 100" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="172" y="78" width="108" height="44" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="226.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">x²</text><path d="M282 100 L300 100" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="304" y="78" width="108" height="44" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="358.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">+3x</text><path d="M414 100 L432 100" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="436" y="78" width="108" height="44" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="490.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">+1</text><path d="M546 100 L564 100" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="568" y="78" width="108" height="44" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="622.0" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">합계</text><text x="40" y="66" text-anchor="start" font-size="12.5" fill="#3d6fa8">① 순전파 — 계산하면서 순서를 전부 기록해 둔다</text><path d="M168 196 L150 196" stroke="#c2703c" stroke-width="2" marker-end="url(#ao)"/><path d="M300 196 L282 196" stroke="#c2703c" stroke-width="2" marker-end="url(#ao)"/><path d="M432 196 L414 196" stroke="#c2703c" stroke-width="2" marker-end="url(#ao)"/><path d="M564 196 L546 196" stroke="#c2703c" stroke-width="2" marker-end="url(#ao)"/><text x="40" y="162" text-anchor="start" font-size="12.5" fill="#c2703c">② backward() — 그 기록을 거꾸로 읽으며 미분값을 채운다</text><rect x="40" y="174" width="108" height="44" rx="10" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="94.0" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">x</text><rect x="172" y="174" width="108" height="44" rx="10" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="226.0" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">x²</text><rect x="304" y="174" width="108" height="44" rx="10" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="358.0" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">+3x</text><rect x="436" y="174" width="108" height="44" rx="10" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="490.0" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">+1</text><rect x="568" y="174" width="108" height="44" rx="10" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="622.0" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">합계</text><rect x="40" y="258" width="640" height="92" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="60" y="286" text-anchor="start" font-size="13.5" font-weight="700" fill="#4f8f68">requires_grad=True 를 붙이는 순간부터 기록이 시작된다</text><text x="60" y="312" text-anchor="start" font-size="13" fill="#1d3a5c">y = x² + 3x + 1  을  x로 미분하면  2x + 3</text><text x="60" y="334" text-anchor="start" font-size="12.5" fill="#5b7a99">x=2 → 7,   x=3 → 9    ·    .backward() 결과와 손 계산이 정확히 일치한다</text><text x="360" y="386" text-anchor="middle" font-size="13.5" fill="#40556b">미분을 대신 해주는 게 아니라, 순서를 기억했다가 되짚어 주는 것이다</text></svg>