<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="350" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">자물쇠가 두 개다 — 기울기를 안 만드는 것과, 만들어도 안 쓰는 것</text><text x="335" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6fa8">optimizer에 model.parameters()</text><text x="575" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#3d6fa8">optimizer에 model.fc.parameters()</text><text x="200" y="130" text-anchor="end" font-size="12" font-weight="700" fill="#1d3a5c">backbone</text><text x="200" y="150" text-anchor="end" font-size="11" fill="#6b7f95">requires_grad = True</text><rect x="216" y="88" width="224" height="92" rx="9" fill="#fff" stroke="#1d3a5c" stroke-width="1.6"/><text x="328" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">Fine-tuning</text><text x="328" y="150" text-anchor="middle" font-size="10.5" fill="#40556b">전부 계산하고 전부 갱신한다</text><rect x="456" y="88" width="224" height="92" rx="9" fill="#f6ecec" stroke="#a04040" stroke-width="1.6"/><text x="568" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a04040">헛돈다</text><text x="568" y="150" text-anchor="middle" font-size="10.5" fill="#40556b">backbone 기울기를 계산해놓고 안 쓴다</text><text x="200" y="234" text-anchor="end" font-size="12" font-weight="700" fill="#1d3a5c">backbone</text><text x="200" y="254" text-anchor="end" font-size="11" fill="#6b7f95">requires_grad = False</text><rect x="216" y="192" width="224" height="92" rx="9" fill="#fff" stroke="#40556b" stroke-width="1.6"/><text x="328" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40556b">동작은 맞다</text><text x="328" y="254" text-anchor="middle" font-size="10.5" fill="#40556b">기울기가 없으니 갱신될 것도 없다</text><rect x="456" y="192" width="224" height="92" rx="9" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="568" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">Linear Probing 정석</text><text x="568" y="254" text-anchor="middle" font-size="10.5" fill="#40556b">계산도 안 하고 갱신도 안 한다</text><rect x="32" y="300" width="656" height="34" rx="8" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="322" text-anchor="middle" font-size="12.5" fill="#40556b">둘 다 걸어야 빠르기까지 하다 — 하나만 걸면 결과는 같아도 계산을 버리는 셈이다</text></svg>