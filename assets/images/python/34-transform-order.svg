<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="350" rx="12" fill="#f7f9fb"/><defs><marker id="trA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0d4"/></marker></defs><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">transform은 쓴 순서대로 돈다 — 자를 것을 먼저 자른다</text><text x="32" y="64" font-size="12.5" font-weight="700" fill="#3d6fa8">① RandomCrop 먼저 — 맞다</text><rect x="40" y="76" width="145" height="58" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="112" y="111" text-anchor="middle" font-size="11" fill="#1d3a5c" font-weight="400">원본 32x32</text><path d="M185 105 L203 105" stroke="#8fb0d4" stroke-width="1.8" fill="none" marker-end="url(#trA)"/><rect x="205" y="76" width="145" height="58" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="277" y="111" text-anchor="middle" font-size="11" fill="#1d3a5c" font-weight="400">RandomCrop(32, pad=4)</text><path d="M350 105 L368 105" stroke="#8fb0d4" stroke-width="1.8" fill="none" marker-end="url(#trA)"/><rect x="370" y="76" width="145" height="58" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="442" y="111" text-anchor="middle" font-size="11" fill="#1d3a5c" font-weight="400">Resize(224)</text><path d="M515 105 L533 105" stroke="#8fb0d4" stroke-width="1.8" fill="none" marker-end="url(#trA)"/><rect x="535" y="76" width="145" height="58" rx="8" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="2"/><text x="607" y="111" text-anchor="middle" font-size="11" fill="#3d6fa8" font-weight="700">32칸 전체가 224로</text><text x="32" y="176" font-size="12.5" font-weight="700" fill="#a04040">② Resize 먼저 — 대부분이 날아간다</text><rect x="40" y="188" width="145" height="58" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="112" y="223" text-anchor="middle" font-size="11" fill="#1d3a5c" font-weight="400">원본 32x32</text><path d="M185 217 L203 217" stroke="#8fb0d4" stroke-width="1.8" fill="none" marker-end="url(#trA)"/><rect x="205" y="188" width="145" height="58" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="277" y="223" text-anchor="middle" font-size="11" fill="#1d3a5c" font-weight="400">Resize(224)</text><path d="M350 217 L368 217" stroke="#8fb0d4" stroke-width="1.8" fill="none" marker-end="url(#trA)"/><rect x="370" y="188" width="145" height="58" rx="8" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="442" y="223" text-anchor="middle" font-size="11" fill="#1d3a5c" font-weight="400">RandomCrop(32, pad=4)</text><path d="M515 217 L533 217" stroke="#8fb0d4" stroke-width="1.8" fill="none" marker-end="url(#trA)"/><rect x="535" y="188" width="145" height="58" rx="8" fill="#f6ecec" stroke="#a04040" stroke-width="2"/><text x="607" y="223" text-anchor="middle" font-size="11" fill="#a04040" font-weight="700">224 중 32칸만 남는다</text><rect x="32" y="266" width="656" height="60" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="290" text-anchor="middle" font-size="12.5" fill="#40556b">RandomCrop(32) 는 32x32 조각을 오려내는 명령이다 — 224로 키운 뒤에 부르면 그 큰 그림에서 32칸만 오려낸다</text><text x="360" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">증강은 원본 크기에서, 리사이즈는 맨 마지막에</text></svg>