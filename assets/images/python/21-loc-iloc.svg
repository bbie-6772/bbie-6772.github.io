<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">loc와 iloc — 이름표로 찾는가, 자리 번호로 찾는가</text><text x="190" y="84" text-anchor="middle" font-size="11.5" fill="#5b7a99">index</text><text x="310" y="84" text-anchor="middle" font-size="11.5" fill="#5b7a99">local</text><text x="420" y="84" text-anchor="middle" font-size="11.5" fill="#5b7a99">value</text><text x="190" y="121" text-anchor="middle" font-size="13" fill="#6b5b95" font-weight="700">a</text><text x="142" y="121" text-anchor="middle" font-size="13" fill="#4f8f68" font-weight="700">0</text><rect x="250" y="96" width="120" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="310" y="120" text-anchor="middle" font-size="13" fill="#1d3a5c">서울</text><rect x="370" y="96" width="100" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="420" y="120" text-anchor="middle" font-size="13" fill="#1d3a5c">10</text><text x="190" y="161" text-anchor="middle" font-size="13" fill="#6b5b95" font-weight="700">b</text><text x="142" y="161" text-anchor="middle" font-size="13" fill="#4f8f68" font-weight="700">1</text><rect x="250" y="136" width="120" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="310" y="160" text-anchor="middle" font-size="13" fill="#1d3a5c">전주</text><rect x="370" y="136" width="100" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="420" y="160" text-anchor="middle" font-size="13" fill="#1d3a5c">20</text><text x="190" y="201" text-anchor="middle" font-size="13" fill="#6b5b95" font-weight="700">c</text><text x="142" y="201" text-anchor="middle" font-size="13" fill="#4f8f68" font-weight="700">2</text><rect x="250" y="176" width="120" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="310" y="200" text-anchor="middle" font-size="13" fill="#1d3a5c">부산</text><rect x="370" y="176" width="100" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="420" y="200" text-anchor="middle" font-size="13" fill="#1d3a5c">30</text><text x="190" y="241" text-anchor="middle" font-size="13" fill="#6b5b95" font-weight="700">d</text><text x="142" y="241" text-anchor="middle" font-size="13" fill="#4f8f68" font-weight="700">3</text><rect x="250" y="216" width="120" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="310" y="240" text-anchor="middle" font-size="13" fill="#1d3a5c">대구</text><rect x="370" y="216" width="100" height="36" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="420" y="240" text-anchor="middle" font-size="13" fill="#1d3a5c">40</text><text x="142" y="84" text-anchor="middle" font-size="11.5" fill="#5b7a99">위치</text><line x1="482" y1="100" x2="482" y2="212" stroke="#6b5b95" stroke-width="3"/><text x="496" y="142" text-anchor="start" font-size="12.5" fill="#6b5b95" font-weight="700">df.loc['a':'c']</text><text x="496" y="162" text-anchor="start" font-size="11.5" fill="#5b7a99">이름표 기준 · 끝 포함</text><text x="496" y="182" text-anchor="start" font-size="12" fill="#6b5b95">→ a, b, c  3행</text><line x1="110" y1="100" x2="110" y2="212" stroke="#4f8f68" stroke-width="3"/><text x="98" y="142" text-anchor="end" font-size="12.5" fill="#4f8f68" font-weight="700">df.iloc[0:3]</text><text x="98" y="162" text-anchor="end" font-size="11.5" fill="#5b7a99">자리 번호 기준 · 끝 제외</text><text x="98" y="182" text-anchor="end" font-size="12" fill="#4f8f68">→ 0, 1, 2  3행</text><rect x="60" y="292" width="600" height="62" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.6"/><text x="360" y="316" text-anchor="middle" font-size="13" fill="#1d3a5c">같은 3행이라도 loc['a':'c']는 끝을 포함하고, iloc[0:3]은 3번째를 빼고 센다</text><text x="360" y="338" text-anchor="middle" font-size="12.5" fill="#a04040">인덱스가 0, 1, 2… 숫자면 둘이 똑같아 보이다가, 정렬·필터 뒤에 어긋난다</text><text x="360" y="380" text-anchor="middle" font-size="13.5" fill="#40556b">이름표를 쓸 건지 자리 번호를 쓸 건지 먼저 정하고 하나만 쓰는 게 안전하다</text></svg>