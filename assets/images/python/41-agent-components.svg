<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">부품 하나가 문제 하나를 막는다</text><rect x="32" y="56" width="140" height="204" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="102" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">LLM만</text><rect x="50" y="92" width="104" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="102" y="108" text-anchor="middle" font-size="10.5" fill="#6b7f95" font-weight="400">LLM</text><text x="102" y="224" text-anchor="middle" font-size="10.5" fill="#a04040">말만 하고</text><text x="102" y="240" text-anchor="middle" font-size="10.5" fill="#a04040">아무 일도 안 일어난다</text><rect x="204" y="56" width="140" height="204" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="274" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">+ Tool</text><rect x="222" y="92" width="104" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="274" y="108" text-anchor="middle" font-size="10.5" fill="#6b7f95" font-weight="400">LLM</text><rect x="222" y="122" width="104" height="24" rx="5" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.8"/><text x="274" y="138" text-anchor="middle" font-size="10.5" fill="#3d6fa8" font-weight="700">Tool</text><text x="274" y="224" text-anchor="middle" font-size="10.5" fill="#a04040">직전 대화를</text><text x="274" y="240" text-anchor="middle" font-size="10.5" fill="#a04040">기억하지 못한다</text><rect x="376" y="56" width="140" height="204" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="446" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">+ Memory</text><rect x="394" y="92" width="104" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="446" y="108" text-anchor="middle" font-size="10.5" fill="#6b7f95" font-weight="400">LLM</text><rect x="394" y="122" width="104" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="446" y="138" text-anchor="middle" font-size="10.5" fill="#6b7f95" font-weight="400">Tool</text><rect x="394" y="152" width="104" height="24" rx="5" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.8"/><text x="446" y="168" text-anchor="middle" font-size="10.5" fill="#3d6fa8" font-weight="700">Memory</text><text x="446" y="224" text-anchor="middle" font-size="10.5" fill="#a04040">여러 단계 요청에서</text><text x="446" y="240" text-anchor="middle" font-size="10.5" fill="#a04040">순서가 꼬인다</text><rect x="548" y="56" width="140" height="204" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="618" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">+ Plan</text><rect x="566" y="92" width="104" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="618" y="108" text-anchor="middle" font-size="10.5" fill="#6b7f95" font-weight="400">LLM</text><rect x="566" y="122" width="104" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="618" y="138" text-anchor="middle" font-size="10.5" fill="#6b7f95" font-weight="400">Tool</text><rect x="566" y="152" width="104" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="618" y="168" text-anchor="middle" font-size="10.5" fill="#6b7f95" font-weight="400">Memory</text><rect x="566" y="182" width="104" height="24" rx="5" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.8"/><text x="618" y="198" text-anchor="middle" font-size="10.5" fill="#3d6fa8" font-weight="700">Plan</text><text x="618" y="224" text-anchor="middle" font-size="10.5" fill="#3d6fa8">드디어 실행된다</text><text x="618" y="240" text-anchor="middle" font-size="10.5" fill="#3d6fa8">대신 막을 게 없다</text><rect x="32" y="278" width="656" height="44" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="306" text-anchor="middle" font-size="12.5" fill="#40556b">각 칸 아래가 그 단계에서 아직 못 하는 것 — 다음 부품은 바로 그걸 막으려고 붙는다</text></svg>