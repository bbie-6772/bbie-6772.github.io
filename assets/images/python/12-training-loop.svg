<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 522" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="522" rx="12" fill="#f7f9fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7a99"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2703c"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">학습 한 걸음 — 이 순서에는 전부 이유가 있다</text><circle cx="66" cy="96" r="16" fill="#a04040" opacity="0.16"/><text x="66" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#a04040">1</text><rect x="94" y="72" width="250" height="48" rx="6" fill="#eef2f7" stroke="#a04040" stroke-width="1.6"/><text x="108" y="102" text-anchor="start" font-size="13" fill="#1d3a5c">optimizer.zero_grad()</text><text x="364" y="94" text-anchor="start" font-size="13" font-weight="700" fill="#a04040">칠판을 지운다</text><text x="364" y="112" text-anchor="start" font-size="12" fill="#5b7a99">안 지우면 지난 배치 기울기가 더해진다</text><path d="M66 114 L66 130" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><circle cx="66" cy="158" r="16" fill="#3d6fa8" opacity="0.16"/><text x="66" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#3d6fa8">2</text><rect x="94" y="134" width="250" height="48" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="108" y="164" text-anchor="start" font-size="13" fill="#1d3a5c">logits = model(x)</text><text x="364" y="156" text-anchor="start" font-size="13" font-weight="700" fill="#3d6fa8">예측한다</text><text x="364" y="174" text-anchor="start" font-size="12" fill="#5b7a99">순전파. 아직 점수일 뿐 확률이 아니다</text><path d="M66 176 L66 192" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><circle cx="66" cy="220" r="16" fill="#3d6fa8" opacity="0.16"/><text x="66" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#3d6fa8">3</text><rect x="94" y="196" width="250" height="48" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="108" y="226" text-anchor="start" font-size="13" fill="#1d3a5c">loss = criterion(...)</text><text x="364" y="218" text-anchor="start" font-size="13" font-weight="700" fill="#3d6fa8">얼마나 틀렸나 잰다</text><text x="364" y="236" text-anchor="start" font-size="12" fill="#5b7a99">결과는 숫자 하나(스칼라)</text><path d="M66 238 L66 254" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><circle cx="66" cy="282" r="16" fill="#c2703c" opacity="0.16"/><text x="66" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#c2703c">4</text><rect x="94" y="258" width="250" height="48" rx="6" fill="#eef2f7" stroke="#c2703c" stroke-width="1.6"/><text x="108" y="288" text-anchor="start" font-size="13" fill="#1d3a5c">loss.backward()</text><text x="364" y="280" text-anchor="start" font-size="13" font-weight="700" fill="#c2703c">어느 방향으로 고칠지 계산</text><text x="364" y="298" text-anchor="start" font-size="12" fill="#5b7a99">모든 파라미터의 .grad가 채워진다</text><path d="M66 300 L66 316" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><circle cx="66" cy="344" r="16" fill="#4f8f68" opacity="0.16"/><text x="66" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">5</text><rect x="94" y="320" width="250" height="48" rx="6" fill="#eef2f7" stroke="#4f8f68" stroke-width="1.6"/><text x="108" y="350" text-anchor="start" font-size="13" fill="#1d3a5c">optimizer.step()</text><text x="364" y="342" text-anchor="start" font-size="13" font-weight="700" fill="#4f8f68">실제로 한 걸음 내딛는다</text><text x="364" y="360" text-anchor="start" font-size="12" fill="#5b7a99">여기서 처음으로 값이 바뀐다</text><rect x="40" y="390" width="640" height="70" rx="10" fill="#fff" stroke="#1d3a5c" stroke-width="1.6"/><text x="60" y="418" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">④ → ⑤ 는 절대 못 바꾼다</text><text x="310" y="418" text-anchor="start" font-size="12.5" fill="#5b7a99">기울기를 계산하지 않고 값을 고칠 수는 없으니까</text><text x="60" y="444" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">① 은 ④보다 앞이면 어디든 된다</text><text x="310" y="444" text-anchor="start" font-size="12.5" fill="#5b7a99">반복문 맨 앞에 두는 쪽이 빼먹지 않는다</text><text x="360" y="500" text-anchor="middle" font-size="13.5" fill="#40556b">세 줄로 줄어들었을 뿐, 하는 일은 손으로 하던 경사 하강법 그대로다</text></svg>