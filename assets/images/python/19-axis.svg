<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">axis — 적어준 방향의 축이 사라진다</text><defs><marker id="axA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker></defs><defs><marker id="axB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2703c"/></marker></defs><text x="330.0" y="76" text-anchor="middle" font-size="12.5" fill="#1d3a5c" font-weight="700">sheet</text><text x="330.0" y="94" text-anchor="middle" font-size="11.5" fill="#5b7a99">shape (2, 3)</text><rect x="246" y="120" width="56" height="42" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="274.0" y="147" text-anchor="middle" font-size="14" fill="#1d3a5c">0</text><rect x="302" y="120" width="56" height="42" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="330.0" y="147" text-anchor="middle" font-size="14" fill="#1d3a5c">1</text><rect x="358" y="120" width="56" height="42" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="386.0" y="147" text-anchor="middle" font-size="14" fill="#1d3a5c">2</text><rect x="246" y="162" width="56" height="42" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="274.0" y="189" text-anchor="middle" font-size="14" fill="#1d3a5c">3</text><rect x="302" y="162" width="56" height="42" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="330.0" y="189" text-anchor="middle" font-size="14" fill="#1d3a5c">4</text><rect x="358" y="162" width="56" height="42" rx="4" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="386.0" y="189" text-anchor="middle" font-size="14" fill="#1d3a5c">5</text><text x="150" y="128" text-anchor="end" font-size="13.5" fill="#3d6fa8" font-weight="700">axis=0</text><text x="150" y="148" text-anchor="end" font-size="11.5" fill="#5b7a99">행을 따라 내려가며</text><text x="150" y="166" text-anchor="end" font-size="11.5" fill="#5b7a99">열마다 하나씩 남는다</text><path d="M274.0 214 L274.0 238" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#axA)"/><rect x="252" y="244" width="44" height="32" rx="4" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="274.0" y="266" text-anchor="middle" font-size="13.5" fill="#3d6fa8">3</text><path d="M330.0 214 L330.0 238" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#axA)"/><rect x="308" y="244" width="44" height="32" rx="4" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="330.0" y="266" text-anchor="middle" font-size="13.5" fill="#3d6fa8">5</text><path d="M386.0 214 L386.0 238" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#axA)"/><rect x="364" y="244" width="44" height="32" rx="4" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="386.0" y="266" text-anchor="middle" font-size="13.5" fill="#3d6fa8">7</text><text x="330.0" y="298" text-anchor="middle" font-size="12.5" fill="#3d6fa8" font-weight="700">sum(axis=0) → [3 5 7]</text><text x="330.0" y="316" text-anchor="middle" font-size="11.5" fill="#5b7a99">shape (3,)</text><text x="560" y="94" text-anchor="start" font-size="13.5" fill="#c2703c" font-weight="700">axis=1</text><path d="M424 141.0 L448 141.0" stroke="#c2703c" stroke-width="2" fill="none" marker-end="url(#axB)"/><rect x="454" y="125" width="56" height="32" rx="4" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="482" y="147" text-anchor="middle" font-size="13.5" fill="#c2703c">3</text><path d="M424 183.0 L448 183.0" stroke="#c2703c" stroke-width="2" fill="none" marker-end="url(#axB)"/><rect x="454" y="167" width="56" height="32" rx="4" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="482" y="189" text-anchor="middle" font-size="13.5" fill="#c2703c">12</text><text x="560" y="226" text-anchor="start" font-size="12" fill="#c2703c" font-weight="700">sum(axis=1) → [3 12]</text><text x="560" y="244" text-anchor="start" font-size="11.5" fill="#5b7a99">shape (2,)</text><rect x="40" y="318" width="640" height="40" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.6"/><text x="360" y="344" text-anchor="middle" font-size="13" fill="#1d3a5c">(2, 3)에 axis=0 → 앞자리 2가 사라져 (3,)  ·  axis=1 → 뒷자리 3이 사라져 (2,)</text><text x="360" y="382" text-anchor="middle" font-size="13.5" fill="#40556b">결과가 나오는 방향이 아니라 없어지는 축을 적는다고 외우면 헷갈리지 않는다</text></svg>