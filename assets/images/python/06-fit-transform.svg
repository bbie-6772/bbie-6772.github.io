<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="442" rx="12" fill="#f7f9fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7a99"/></marker></defs><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">fit은 눈금을 맞추는 일, transform은 그 저울로 재는 일</text><rect x="50" y="74" width="130" height="50" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.5"/><text x="115" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">X_train</text><path d="M184 99 L214 99" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="74" width="190" height="50" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="315" y="105" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4f8f68">fit_transform</text><text x="430" y="105" text-anchor="start" font-size="12.5" fill="#1d3a5c">눈금을 맞추고 + 무게도 잰다</text><text x="430" y="86" text-anchor="start" font-size="11.5" fill="#4f8f68">여기서만 규칙을 배운다</text><rect x="50" y="140" width="130" height="50" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.5"/><text x="115" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">X_valid</text><path d="M184 165 L214 165" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="140" width="190" height="50" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="315" y="171" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d6fa8">transform</text><text x="430" y="171" text-anchor="start" font-size="12.5" fill="#1d3a5c">맞춰둔 저울로 재기만 한다</text><rect x="50" y="206" width="130" height="50" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.5"/><text x="115" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">X_test</text><path d="M184 231 L214 231" stroke="#5b7a99" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="206" width="190" height="50" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="315" y="237" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d6fa8">transform</text><text x="430" y="237" text-anchor="start" font-size="12.5" fill="#1d3a5c">맞춰둔 저울로 재기만 한다</text><rect x="50" y="284" width="620" height="96" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="70" y="310" text-anchor="start" font-size="13.5" font-weight="700" fill="#a04040">세 번 다 fit_transform 을 쓰면</text><text x="70" y="336" text-anchor="start" font-size="12.5" fill="#1d3a5c">국어는 우리 반 평균으로, 영어는 옆 반 평균으로, 수학은 전교 평균으로 채점하는 셈</text><text x="70" y="360" text-anchor="start" font-size="12.5" fill="#5b7a99">잣대가 매번 바뀌어서 세 점수를 나란히 비교할 수가 없다</text><text x="360" y="420" text-anchor="middle" font-size="13" fill="#40556b">fit이 들어가는 모든 전처리에 똑같이 적용된다 — 스케일러 · 결측치 채우기 · PCA · 인코더</text></svg>