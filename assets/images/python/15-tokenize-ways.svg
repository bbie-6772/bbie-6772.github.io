<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="416" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">문장을 어떤 크기로 쪼갤 것인가</text><rect x="40" y="72" width="640" height="84" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="64" y="102" text-anchor="start" font-size="14" font-weight="700" fill="#a04040">단어 단위</text><rect x="170" y="86" width="56" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="198.0" y="106" text-anchor="middle" font-size="12.5" fill="#1d3a5c">학교</text><rect x="234" y="86" width="56" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="262.0" y="106" text-anchor="middle" font-size="12.5" fill="#1d3a5c">에서</text><rect x="298" y="86" width="56" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="326.0" y="106" text-anchor="middle" font-size="12.5" fill="#1d3a5c">공부</text><rect x="362" y="86" width="56" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="390.0" y="106" text-anchor="middle" font-size="12.5" fill="#1d3a5c">했다</text><text x="64" y="130" text-anchor="start" font-size="12" fill="#1d3a5c">사전이 끝없이 커진다</text><text x="300" y="130" text-anchor="start" font-size="12" fill="#5b7a99">처음 보는 단어는 통째로 모름</text><rect x="40" y="172" width="640" height="84" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="64" y="202" text-anchor="start" font-size="14" font-weight="700" fill="#c2703c">글자 단위</text><rect x="170" y="186" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="190.5" y="206" text-anchor="middle" font-size="12.5" fill="#1d3a5c">학</text><rect x="219" y="186" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="239.5" y="206" text-anchor="middle" font-size="12.5" fill="#1d3a5c">교</text><rect x="268" y="186" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="288.5" y="206" text-anchor="middle" font-size="12.5" fill="#1d3a5c">에</text><rect x="317" y="186" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="337.5" y="206" text-anchor="middle" font-size="12.5" fill="#1d3a5c">서</text><rect x="366" y="186" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="386.5" y="206" text-anchor="middle" font-size="12.5" fill="#1d3a5c">공</text><rect x="415" y="186" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="435.5" y="206" text-anchor="middle" font-size="12.5" fill="#1d3a5c">부</text><text x="64" y="230" text-anchor="start" font-size="12" fill="#1d3a5c">사전은 아주 작다</text><text x="300" y="230" text-anchor="start" font-size="12" fill="#5b7a99">의미 단위가 부서진다</text><rect x="40" y="272" width="640" height="84" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="64" y="302" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">서브워드</text><rect x="170" y="286" width="56" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="198.0" y="306" text-anchor="middle" font-size="12.5" fill="#1d3a5c">학교</text><rect x="234" y="286" width="56" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="262.0" y="306" text-anchor="middle" font-size="12.5" fill="#1d3a5c">에서</text><rect x="298" y="286" width="56" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="326.0" y="306" text-anchor="middle" font-size="12.5" fill="#1d3a5c">공부</text><rect x="362" y="286" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="382.5" y="306" text-anchor="middle" font-size="12.5" fill="#1d3a5c">했</text><rect x="411" y="286" width="41" height="30" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="431.5" y="306" text-anchor="middle" font-size="12.5" fill="#1d3a5c">다</text><text x="64" y="330" text-anchor="start" font-size="12" fill="#1d3a5c">자주 쓰는 덩어리는 통째로</text><text x="300" y="330" text-anchor="start" font-size="12" fill="#5b7a99">드문 말은 조각으로 — 현대의 정답</text><text x="360" y="394" text-anchor="middle" font-size="13.5" fill="#40556b">지금 쓰는 모델들은 거의 다 세 번째 방식을 쓴다</text></svg>