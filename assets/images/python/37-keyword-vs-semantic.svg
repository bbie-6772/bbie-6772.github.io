<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">같은 뜻인데 글자가 다르면 — 키워드는 못 찾는다</text><rect x="32" y="56" width="316" height="212" rx="10" fill="#fff" stroke="#a04040" stroke-width="1.8"/><text x="190" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">키워드 검색</text><text x="190" y="101" text-anchor="middle" font-size="11" fill="#a04040">if 키워드 in 문서</text><rect x="54" y="114" width="164" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="136" y="133" text-anchor="middle" font-size="11.5" fill="#40556b">결제 취소</text><text x="232" y="133" font-size="11.5" font-weight="700" fill="#a04040">→ 0건</text><rect x="54" y="150" width="164" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="136" y="169" text-anchor="middle" font-size="11.5" fill="#40556b">바로 환불</text><text x="232" y="169" font-size="11.5" font-weight="700" fill="#a04040">→ 0건</text><rect x="54" y="186" width="164" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="136" y="205" text-anchor="middle" font-size="11.5" fill="#40556b">돈 돌려받기</text><text x="232" y="205" font-size="11.5" font-weight="700" fill="#a04040">→ 0건</text><rect x="54" y="222" width="164" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="136" y="241" text-anchor="middle" font-size="11.5" fill="#40556b">즉시 환불</text><text x="232" y="241" font-size="11.5" font-weight="700" fill="#3d6fa8">→ 문서 1건</text><rect x="372" y="56" width="316" height="212" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="530" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">의미 기반 검색</text><text x="530" y="101" text-anchor="middle" font-size="11" fill="#3d