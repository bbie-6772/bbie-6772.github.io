<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="330" rx="12" fill="#f7f9fb"/><defs><marker id="sdA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker></defs><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">데이터를 모델로 만들고, 다른 모델이 채점한다</text><rect x="32" y="70" width="196" height="86" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="130" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">생성 모델</text><text x="130" y="120" text-anchor="middle" font-size="11.5" fill="#3d6fa8">temperature 1.0</text><text x="130" y="140" text-anchor="middle" font-size="11" fill="#6b7f95">일부러 다양하게 뽑는다</text><path d="M228 113 L290 113" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#sdA)"/><rect x="262" y="70" width="196" height="86" rx="10" fill="#fff" stroke="#8fb0d4" stroke-width="1.8"/><text x="360" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">합성 데이터 — JSON</text><text x="360" y="120" text-anchor="middle" font-size="11.5" fill="#3d6fa8">이름 · 등급 · 서식지 · 설명</text><text x="360" y="140" text-anchor="middle" font-size="11" fill="#6b7f95">구조가 고정된다</text><path d="M458 113 L520 113" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#sdA)"/><rect x="492" y="70" width="196" height="86" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="590" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">평가 모델 — Judge</text><text x="590" y="120" text-anchor="middle" font-size="11.5" fill="#3d6fa8">temperature 0 · 다른 모델</text><text x="590" y="140" text-anchor="middle" font-size="11" fill="#6b7f95">흔들리지 않게 채점한다</text><path d="M590 156 L590 178" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#sdA)"/><rect x="32" y="182" width="656" height="62" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="360" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">기준 세 개로 따로 채점한다 — 요청 충실도 · 설명 구체성 · 정보 정확성</text><text x="360" y="229" text-anchor="middle" font-size="12" fill="#40556b">각각 1~5점과 코멘트를 받아 평균을 내고, 낮은 것은 버린다</text><rect x="32" y="258" width="656" height="46" rx="10" fill="#f6ecec" stroke="#a04040" stroke-width="1.5"/><text x="360" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a04040">채점자를 생성자와 같은 모델로 두면 자기 답에 후한 점수를 준다</text></svg>