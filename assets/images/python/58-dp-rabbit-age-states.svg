<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" role="img" aria-label="토끼를 나이별 상태 a, b, c로 나눈 전이. 한 달마다 한 살씩 다음 칸으로 넘어가고, 2살이 된 쌍이 번식하며, 2살 칸은 다음 달로 넘기지 않아 죽음이 된다">
  <style>
    .bg { fill: #f7f9fb; }
    .card { fill: #ffffff; stroke: #d5dde6; }
    .t { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d3a5c; }
    .sub { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b7f95; }
    .m { font-family: "Cascadia Mono", Consolas, monospace; fill: #1d3a5c; }
    .st { fill: #dce7f4; stroke: #3d6fa8; }
    .dead { fill: #f6e3e3; stroke: #a04040; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a58" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d6fa8"/></marker>
    <marker id="r58" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a04040"/></marker>
  </defs>

  <rect class="bg" width="720" height="260" rx="10"/>
  <text class="t" x="24" y="34" font-size="16" font-weight="600">죽는 쌍은 빼지 않는다 — 다음 칸으로 넘기지 않을 뿐이다</text>
  <text class="sub" x="24" y="56" font-size="13">살아 있는 수 하나로는 누가 죽을 차례인지 모른다. 나이를 상태에 넣는다.</text>

  <rect class="card" x="20" y="72" width="680" height="170" rx="8"/>

  <rect class="st" x="60" y="130" width="140" height="56" rx="8"/>
  <text class="m" x="130" y="154" font-size="15" text-anchor="middle">a(n)</text>
  <text class="sub" x="130" y="174" font-size="12" text-anchor="middle">갓 태어남</text>

  <rect class="st" x="270" y="130" width="140" height="56" rx="8"/>
  <text class="m" x="340" y="154" font-size="15" text-anchor="middle">b(n)</text>
  <text class="sub" x="340" y="174" font-size="12" text-anchor="middle">1살</text>

  <rect class="st" x="480" y="130" width="140" height="56" rx="8"/>
  <text class="m" x="550" y="154" font-size="15" text-anchor="middle">c(n)</text>
  <text class="sub" x="550" y="174" font-size="12" text-anchor="middle">2살</text>

  <line x1="200" y1="158" x2="266" y2="158" stroke="#3d6fa8" stroke-width="1.8" marker-end="url(#a58)"/>
  <text class="sub" x="233" y="150" font-size="12" text-anchor="middle">한 달</text>
  <line x1="410" y1="158" x2="476" y2="158" stroke="#3d6fa8" stroke-width="1.8" marker-end="url(#a58)"/>
  <text class="sub" x="443" y="150" font-size="12" text-anchor="middle">한 달</text>

  <path d="M550 130 C 550 100, 130 100, 130 126" fill="none" stroke="#3d6fa8" stroke-width="1.8" marker-end="url(#a58)"/>
  <text class="t" x="340" y="94" font-size="13" text-anchor="middle">2살이 된 달에 번식 → a(n+1) = c(n+1) = b(n)</text>

  <line x1="620" y1="158" x2="656" y2="158" stroke="#a04040" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#r58)"/>
  <rect class="dead" x="658" y="140" width="30" height="36" rx="6"/>
  <text class="t" x="673" y="164" font-size="15" text-anchor="middle" fill="#a04040">×</text>
  <text class="sub" x="550" y="214" font-size="12" text-anchor="middle">c(n)은 다음 달 어느 칸에도 넣지 않는다 = 죽음</text>
</svg>
