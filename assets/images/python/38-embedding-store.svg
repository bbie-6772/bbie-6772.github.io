<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><defs><marker id="emA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0d4"/></marker></defs><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">세 줄이 각각 다른 일을 한다</text><rect x="32" y="66" width="184" height="118" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="124" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">OpenAIEmbeddings</text><text x="124" y="128" text-anchor="middle" font-size="12" fill="#1d3a5c">글을 숫자 벡터로</text><text x="124" y="152" text-anchor="middle" font-size="11" fill="#6b7f95">1536개 숫자 한 줄</text><path d="M216 125 L294 125" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#emA)"/><rect x="268" y="66" width="184" height="118" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="360" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">Chroma.from_documents</text><text x="360" y="128" text-anchor="middle" font-size="12" fill="#1d3a5c">벡터를 담아둔다</text><text x="360" y="152" text-anchor="middle" font-size="11" fill="#6b7f95">조각마다 한 줄씩</text><path d="M452 125 L530 125" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#emA)"/><rect x="504" y="66" width="184" height="118" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="596" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">as_retriever(k=3)</text><text x="596" y="128" text-anchor="middle" font-size="12" fill="#1d3a5c">질문도 벡터로 바꿔</text><text x="596" y="152" text-anchor="middle" font-size="11" fill="#6b7f95">가까운 순 3개를 꺼낸다</text><rect x="32" y="206" width="656" height="58" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="360" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">"바로 환불"과 "즉시 환불"은 글자가 달라도 벡터가 가깝다</text><text x="360" y="252" text-anchor="middle" font-size="12" fill="#40556b">그래서 글자를 안 맞혀도 찾아진다 — 가까움을 재는 자가 코사인 유사도</text><rect x="32" y="280" width="656" height="40" rx="9" fill="#f6ecec" stroke="#a04040" stroke-width="1.5"/><text x="360" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a04040">임베딩 모델에도 입력 상한이 있다 — 8,191토큰을 넘기면 그 조각은 거절당한다</text></svg>