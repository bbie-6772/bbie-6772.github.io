<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">박스플롯 — 박스 하나에 요약 통계가 통째로 들어 있다</text><line x1="300" y1="118" x2="300" y2="160" stroke="#3d6fa8" stroke-width="2"/><line x1="300" y1="232" x2="300" y2="262" stroke="#3d6fa8" stroke-width="2"/><line x1="266" y1="118" x2="334" y2="118" stroke="#3d6fa8" stroke-width="2"/><line x1="266" y1="262" x2="334" y2="262" stroke="#3d6fa8" stroke-width="2"/><rect x="244" y="160" width="112" height="72" rx="4" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="2" opacity="0.22"/><line x1="244" y1="196" x2="356" y2="196" stroke="#3d6fa8" stroke-width="3"/><circle cx="300" cy="86" r="4.5" fill="#a04040"/><circle cx="300" cy="98" r="4.5" fill="#a04040"/><circle cx="300" cy="292" r="4.5" fill="#a04040"/><line x1="360" y1="86" x2="392" y2="86" stroke="#c8d4e0" stroke-width="1.4" stroke-dasharray="4 4"/><text x="400" y="90" text-anchor="start" font-size="12.5" fill="#a04040">이상치 — 수염 밖으로 나간 값</text><line x1="360" y1="118" x2="392" y2="118" stroke="#c8d4e0" stroke-width="1.4" stroke-dasharray="4 4"/><text x="400" y="122" text-anchor="start" font-size="12.5" fill="#5b7a99">수염 끝 — 정상 범위의 위쪽 끝</text><line x1="360" y1="160" x2="392" y2="160" stroke="#c8d4e0" stroke-width="1.4" stroke-dasharray="4 4"/><text x="400" y="164" text-anchor="start" font-size="12.5" fill="#3d6fa8">Q3 (위쪽 25% 경계)</text><line x1="360" y1="196" x2="392" y2="196" stroke="#c8d4e0" stroke-width="1.4" stroke-dasharray="4 4"/><text x="400" y="200" text-anchor="start" font-size="12.5" fill="#1d3a5c">중앙값 — 줄 세웠을 때 한가운데</text><line x1="360" y1="232" x2="392" y2="232" stroke="#c8d4e0" stroke-width="1.4" stroke-dasharray="4 4"/><text x="400" y="236" text-anchor="start" font-size="12.5" fill="#3d6fa8">Q1 (아래쪽 25% 경계)</text><line x1="360" y1="262" x2="392" y2="262" stroke="#c8d4e0" stroke-width="1.4" stroke-dasharray="4 4"/><text x="400" y="266" text-anchor="start" font-size="12.5" fill="#5b7a99">수염 끝 — 정상 범위의 아래쪽 끝</text><line x1="230" y1="160" x2="230" y2="232" stroke="#4f8f68" stroke-width="2.4"/><text x="218" y="190.0" text-anchor="end" font-size="11.5" fill="#4f8f68">가운데</text><text x="218" y="206.0" text-anchor="end" font-size="11.5" fill="#4f8f68">절반</text><rect x="40" y="312" width="640" height="44" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.6"/><text x="360" y="339" text-anchor="middle" font-size="13" fill="#1d3a5c">평균은 극단값 하나에 끌려가지만 중앙값은 버틴다 — 이상치가 의심되면 박스플롯 먼저</text><text x="360" y="380" text-anchor="middle" font-size="13.5" fill="#40556b">평균과 중앙값이 벌어져 있으면 한쪽으로 꼬리가 길다는 신호다</text></svg>