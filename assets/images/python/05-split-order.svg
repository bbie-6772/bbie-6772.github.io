<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="328" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">전처리와 분할, 어느 쪽이 먼저인가</text><rect x="40" y="64" width="300" height="210" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="60" y="92" text-anchor="start" font-size="14" font-weight="700" fill="#a04040">❌ 전처리 먼저</text><text x="60" y="118" text-anchor="start" font-size="12.5" fill="#1d3a5c">전체 데이터로 평균을 계산</text><rect x="60" y="130" width="260" height="26" rx="5" fill="#a04040" opacity="0.18"/><text x="190" y="148" text-anchor="middle" font-size="12" fill="#1d3a5c">학습 + 검증 + 테스트 전부</text><text x="60" y="182" text-anchor="start" font-size="12.5" fill="#1d3a5c">그다음 나눔</text><rect x="60" y="194" width="180" height="24" rx="5" fill="#3d6fa8" opacity="0.5"/><rect x="244" y="194" width="76" height="24" rx="5" fill="#c2703c" opacity="0.6"/><text x="60" y="244" text-anchor="start" font-size="12.5" fill="#a04040">테스트 정보가 이미 평균에 섞여 들어감</text><text x="60" y="264" text-anchor="start" font-size="12.5" font-weight="700" fill="#a04040">에러는 안 나고 점수만 올라간다</text><rect x="380" y="64" width="300" height="210" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="400" y="92" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">✅ 분할 먼저</text><text x="400" y="118" text-anchor="start" font-size="12.5" fill="#1d3a5c">먼저 나눔</text><rect x="400" y="130" width="180" height="26" rx="5" fill="#3d6fa8" opacity="0.5"/><rect x="584" y="130" width="76" height="26" rx="5" fill="#c2703c" opacity="0.6"/><text x="490" y="148" text-anchor="middle" font-size="12" fill="#fff">학습</text><text x="622" y="148" text-anchor="middle" font-size="11.5" fill="#fff">테스트</text><text x="400" y="182" text-anchor="start" font-size="12.5" fill="#1d3a5c">학습 데이터로만 평균 계산 (fit)</text><rect x="400" y="194" width="180" height="24" rx="5" fill="#4f8f68" opacity="0.35"/><path d="M584 206 L660 206" stroke="#4f8f68" stroke-width="2" stroke-dasharray="4 3"/><text x="400" y="244" text-anchor="start" font-size="12.5" fill="#4f8f68">그 기준을 테스트에 적용만 (transform)</text><text x="400" y="264" text-anchor="start" font-size="12.5" font-weight="700" fill="#4f8f68">테스트는 끝까지 안 본 상태로 남는다</text><text x="360" y="306" text-anchor="middle" font-size="13.5" fill="#40556b">데이터 유출은 에러로 알려주지 않는다 — 그래서 순서를 습관으로 만들어야 한다</text></svg>