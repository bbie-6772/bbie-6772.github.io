<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="360" rx="12" fill="#f7f9fb"/><text x="360" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">양자화는 가중치만 줄인다 — 나머지는 그대로다</text><rect x="90" y="120" width="170" height="150" rx="4" fill="#3d6fa8" fill-opacity="0.88"/><text x="175" y="200.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">모델 가중치</text><rect x="90" y="70" width="170" height="50" rx="4" fill="#c2703c" fill-opacity="0.78"/><text x="175" y="95.0" text-anchor="middle" font-size="10.5" fill="#ffffff">활성화값</text><text x="175" y="109.0" text-anchor="middle" font-size="10.5" fill="#ffffff">+ KV 캐시</text><text x="175" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">FP16</text><text x="175" y="60" text-anchor="middle" font-size="10" fill="#6b7f95">피크 메모리</text><rect x="460" y="232" width="170" height="38" rx="4" fill="#3d6fa8" fill-opacity="0.88"/><text x="545" y="256.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">모델 가중치</text><rect x="460" y="182" width="170" height="50" rx="4" fill="#c2703c" fill-opacity="0.78"/><text x="545" y="207.0" text-anchor="middle" font-size="10.5" fill="#ffffff">활성화값</text><text x="545" y="221.0" text-anchor="middle" font-size="10.5" fill="#ffffff">+ KV 캐시</text><text x="545" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">INT4</text><text x="545" y="172" text-anchor="middle" font-size="10" fill="#6b7f95">피크 메모리</text><line x1="70" y1="270" x2="650" y2="270" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">아래칸은 크게 줄지만</text><text x="360" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2703c">윗칸은 그대로 남는다</text><rect x="32" y="306" width="656" height="44" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="324" text-anchor="middle" font-size="12" fill="#40556b">모델 메모리는 로딩 직후 값(아래칸), 피크 메모리는 추론 중 최대값(두 칸 합)</text><text x="360" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">모델이 작을수록 윗칸 비중이 커서 양자화 효과가 덜 느껴진다</text></svg>