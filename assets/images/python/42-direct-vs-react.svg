</text><text x="190" y="292" text-anchor="middle" font-size="11" fill="#40556b">add_edge("tools", END)</text><rect x="372" y="52" width="316" height="256" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="530" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">ReAct — 필요한 만큼 돈다</text><rect x="498" y="88" width="64" height="24" rx="7" fill="#fff" stroke="#6b7f95" stroke-width="1.8"/><text x="530.0" y="104.0" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7f95">START</text><path d="M530 112 L530 126" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#dvA)"/><rect x="474" y="128" width="112" height="32" rx="7" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="530.0" y="148.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">agent</text><rect x="624" y="132" width="56" height="24" rx="7" fill="#fff" stroke="#6b7f95" stroke-width="1.8"/><text x="652.0" y="148.0" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7f95">END</text><path d="M586 144 L620 144" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#dvA)"/><text x="603" y="126" text-anchor="middle" font-size="9.5" fill="#6b7f95">호출 없음</text><path d="M530 160 L530 186" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#dvA)"/><text x="566" y="178" text-anchor="middle" font-size="9.5" fill="#6b7f95">호출 있음</text><rect x="474" y="188" width="112" height="32" rx="7" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="530.0" y="208.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">tools</text><path d="M474 204 C 428 204, 428 144, 470 144" stroke="#a04040" stroke-width="2.2" fill="none" marker-end="url(#dvB)"/><text x="418" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#a04040">되돌아감</text><text x="530" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#a04040">add_edge("tools", "agent")</text><rect x="32" y="318" width="