<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><defs><marker id="rfA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker><marker id="rfB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a04040"/></marker></defs><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">셋으로 나누고, 되돌아가는 길에 잠금을 건다</text><rect x="32" y="82" width="156" height="62" rx="9" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="110" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">Planner</text><text x="110" y="128" text-anchor="middle" font-size="10.5" fill="#6b7f95">무엇을 어떤 순서로</text><rect x="224" y="82" width="156" height="62" rx="9" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="302" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">Worker</text><text x="302" y="128" text-anchor="middle" font-size="10.5" fill="#6b7f95">실제로 만들어낸다</text><rect x="416" y="82" width="156" height="62" rx="9" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="494" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">Reflection</text><text x="494" y="128" text-anchor="middle" font-size="10.5" fill="#6b7f95">충족했는지 따진다</text><path d="M188 113 L220 113" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#rfA)"/><path d="M380 113 L412 113" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#rfA)"/><rect x="608" y="96" width="60" height="34" rx="7" fill="#fff" stroke="#6b7f95" stroke-width="1.6"/><text x="638" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b7f95">END</text><path d="M572 113 L604 113" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#rfA)"/><text x="588" y="94" text-anchor="middle" font-size="9.5" fill="#6b7f95">충족</text><path d="M494 144 C 494 196, 302 196, 302 150" stroke="#a04040" stroke-width="2.2" fill="none" marker-end="url(#rfB)"/><text x="398" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#a04040">부족하면 Worker로 되돌아간다</text><rect x="140" y="232" width="440" height="48" rx="9" fill="#f6ecec" stroke="#a04040" stroke-width="1.5"/><text x="360" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a04040">reflection_count 가 MAX_REFLECTIONS 에 닿으면 무조건 END</text><text x="360" y="271" text-anchor="middle" font-size="10.5" fill="#a04040">이 잠금이 없으면 "조금만 더 고치면 되는데"로 영원히 돈다</text><rect x="32" y="294" width="656" height="32" rx="8" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="315" text-anchor="middle" font-size="12.5" fill="#40556b">되돌아가는 길을 만들면 멈추는 조건도 같이 만들어야 한다</text></svg>