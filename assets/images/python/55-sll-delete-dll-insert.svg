<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img" aria-label="단일 연결 리스트 삭제에 선행 노드가 필요한 이유와 이중 연결 리스트 삽입에서 참조를 먼저 확보해야 하는 이유">
  <style>
    .bg { fill: #f7f9fb; }
    .card { fill: #ffffff; stroke: #d5dde6; }
    .t { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d3a5c; }
    .sub { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b7f95; }
    .m { font-family: "Cascadia Mono", Consolas, monospace; fill: #1d3a5c; }
    .cell { fill: #ffffff; stroke: #d5dde6; }
    .gone { fill: #f6ecec; stroke: #a04040; }
    .new { fill: #dce7f4; stroke: #3d6fa8; }
    .link { stroke: #8fb0d4; fill: none; }
    .relink { stroke: #3d6fa8; fill: none; }
    .cut { stroke: #a04040; fill: none; }
  </style>
  <defs>
    <marker id="b1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8fb0d4"/></marker>
    <marker id="b2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d6fa8"/></marker>
  </defs>

  <rect class="bg" width="720" height="320" rx="10"/>
  <text class="t" x="24" y="34" font-size="16" font-weight="600">지우려면 앞을 알아야 하고, 끼우려면 먼저 붙잡아야 한다</text>

  <rect class="card" x="20" y="52" width="330" height="240" rx="8"/>
  <text class="t" x="38" y="78" font-size="14" font-weight="600">SLL 삭제 — B를 지운다</text>
  <text class="sub" x="38" y="98" font-size="12">B만 손에 쥐고 있으면 A로 되돌아갈 방법이 없다</text>

  <rect class="cell" x="42" y="118" width="52" height="36" rx="4"/><text class="m" x="63" y="141" font-size="13">A</text>
  <rect class="gone" x="146" y="118" width="52" height="36" rx="4"/><text class="m" x="167" y="141" font-size="13" fill="#a04040">B</text>
  <rect class="cell" x="250" y="118" width="52" height="36" rx="4"/><text class="m" x="271" y="141" font-size="13">C</text>
  <path class="link" d="M94 136 L142 136" marker-end="url(#b1)"/>
  <path class="link" d="M198 136 L246 136" marker-end="url(#b1)"/>

  <path class="cut" d="M160 160 L184 184" stroke-width="2"/>
  <path class="cut" d="M184 160 L160 184" stroke-width="2"/>

  <path class="relink" d="M68 158 Q170 212 268 158" marker-end="url(#b2)"/>
  <text class="m" x="42" y="238" font-size="12" fill="#3d6fa8">prev.next = cur.next</text>
  <text class="sub" x="42" y="262" font-size="12">head를 지울 땐 prev가 없으니</text>
  <text class="sub" x="42" y="280" font-size="12">head = head.next로 따로 처리한다</text>

  <rect class="card" x="370" y="52" width="330" height="240" rx="8"/>
  <text class="t" x="388" y="78" font-size="14" font-weight="600">DLL 삽입 — A와 C 사이에 B</text>
  <text class="sub" x="388" y="98" font-size="12">A.next를 먼저 덮으면 C를 찾을 수 없게 된다</text>

  <rect class="cell" x="392" y="118" width="52" height="36" rx="4"/><text class="m" x="413" y="141" font-size="13">A</text>
  <rect class="new"  x="496" y="118" width="52" height="36" rx="4"/><text class="m" x="517" y="141" font-size="13" fill="#3d6fa8">B</text>
  <rect class="cell" x="600" y="118" width="52" height="36" rx="4"/><text class="m" x="621" y="141" font-size="13">C</text>

  <path class="relink" d="M444 128 L492 128" marker-end="url(#b2)"/>
  <path class="relink" d="M492 146 L444 146" marker-end="url(#b2)"/>
  <path class="relink" d="M548 128 L596 128" marker-end="url(#b2)"/>
  <path class="relink" d="M596 146 L548 146" marker-end="url(#b2)"/>

  <text class="m" x="392" y="196" font-size="12" fill="#3d6fa8">1. nxt = A.next        ( 먼저 붙잡는다 )</text>
  <text class="m" x="392" y="216" font-size="12">2. B.prev = A ; B.next = nxt</text>
  <text class="m" x="392" y="236" font-size="12">3. A.next = B ; nxt.prev = B</text>
  <text class="sub" x="392" y="266" font-size="12">3번을 1번보다 먼저 하면 C로 가는</text>
  <text class="sub" x="392" y="284" font-size="12">유일한 링크가 사라진다</text>
</svg>
