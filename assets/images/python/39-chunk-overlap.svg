<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">overlap은 문장이 경계에서 잘리는 걸 막는 안전장치다</text><text x="32" y="70" font-size="12" font-weight="700" fill="#1d3a5c">원본 문서</text><rect x="32" y="78" width="656" height="30" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="98" text-anchor="middle" font-size="11.5" fill="#40556b">시즌패스 환불은 구매 후 7일 이내에 신청할 수 있다. 단, 보상을 한 번이라도 수령한 경우 환불이 제한된다.</text><text x="32" y="140" font-size="12" font-weight="700" fill="#a04040">overlap = 0 — 문장이 두 동강 난다</text><rect x="32" y="148" width="320" height="34" rx="5" fill="#fff" stroke="#a04040" stroke-width="1.6"/><text x="192.0" y="170" text-anchor="middle" font-size="11" fill="#40556b">…7일 이내에 신청할 수</text><rect x="360" y="148" width="328" height="34" rx="5" fill="#fff" stroke="#a04040" stroke-width="1.6"/><text x="524.0" y="170" text-anchor="middle" font-size="11" fill="#40556b">있다. 단, 보상을 한 번이라도…</text><text x="360" y="198" text-anchor="middle" font-size="11" fill="#a04040">두 조각 어느 쪽도 "7일 이내에 신청할 수 있다"를 온전히 못 담는다</text><text x="32" y="230" font-size="12" font-weight="700" fill="#3d6fa8">overlap = 50 — 끝부분을 겹쳐서 다시 담는다</text><rect x="32" y="238" width="380" height="34" rx="5" fill="#fff" stroke="#3d6fa8" stroke-width="1.6"/><text x="222" y="260" text-anchor="middle" font-size="11" fill="#40556b">…7일 이내에 신청할 수 있다.</text><rect x="308" y="238" width="380" height="34" rx="5" fill="none" stroke="#3d6fa8" stroke-width="1.6" stroke-dasharray="5 4"/><text x="560" y="260" text-anchor="middle" font-size="11" fill="#40556b">신청할 수 있다. 단, 보상을 한 번이라도…</text><rect x="308" y="238" width="104" height="34" rx="5" fill="#3d6fa8" fill-opacity="0.12" stroke="none"/><text x="360" y="288" text-anchor="middle" font-size="11" fill="#3d6fa8">색칠된 구간이 겹치는 50자 — 어느 쪽이 검색돼도 문장이 살아 있다</text><rect x="32" y="298" width="656" height="30" rx="8" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="318" text-anchor="middle" font-size="12.5" fill="#40556b">overlap은 보통 chunk_size의 10~20% — 더 키우면 같은 문장을 여러 번 저장하게 된다</text></svg>