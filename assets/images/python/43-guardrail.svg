<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="330" rx="12" fill="#f7f9fb"/><defs><marker id="grA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0d4"/></marker></defs><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">도구를 쥐여줬으면 막는 것도 같이 짜야 한다</text><text x="32" y="72" font-size="12.5" font-weight="700" fill="#a04040">검증 없는 도구</text><rect x="32" y="82" width="200" height="62" rx="9" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="132" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d3a5c">에이전트</text><text x="132" y="128" text-anchor="middle" font-size="10.5" fill="#6b7f95">10만원 쿠폰 발급</text><path d="M232 113 L256 113" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#grA)"/><rect x="260" y="82" width="200" height="62" rx="9" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d3a5c">issue_coupon</text><text x="360" y="128" text-anchor="middle" font-size="10.5" fill="#6b7f95">그대로 실행</text><path d="M460 113 L484 113" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#grA)"/><rect x="488" y="82" width="200" height="62" rx="9" fill="#f6ecec" stroke="#a04040" stroke-width="1.8"/><text x="588" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d3a5c">결과</text><text x="588" y="128" text-anchor="middle" font-size="10.5" fill="#a04040">10만원 발급 완료</text><text x="32" y="190" font-size="12.5" font-weight="700" fill="#3d6fa8">검증을 끼운 도구</text><rect x="32" y="200" width="200" height="62" rx="9" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="132" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d3a5c">에이전트</text><text x="132" y="246" text-anchor="middle" font-size="10.5" fill="#6b7f95">10만원 쿠폰 발급</text><path d="M232 231 L256 231" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#grA)"/><rect x="260" y="200" width="200" height="62" rx="9" fill="#fff" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d3a5c">정책 한도 확인</text><text x="360" y="246" text-anchor="middle" font-size="10.5" fill="#6b7f95">1회 최대 2만원</text><path d="M460 231 L484 231" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#grA)"/><rect x="488" y="200" width="200" height="62" rx="9" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.8"/><text x="588" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d3a5c">결과</text><text x="588" y="246" text-anchor="middle" font-size="10.5" fill="#3d6fa8">거절 + 사유 반환</text><rect x="32" y="278" width="656" height="40" rx="9" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="303" text-anchor="middle" font-size="12.5" fill="#40556b">막는 자리는 프롬프트가 아니라 함수 안이다 — 프롬프트로 부탁한 규칙은 지켜질 때만 지켜진다</text></svg>