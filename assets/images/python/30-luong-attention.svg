<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="330" rx="12" fill="#f7f9fb"/><defs><marker id="atA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0d4"/></marker></defs><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">Luong Attention — 곱셈 네 번으로 어디를 볼지 정한다</text><rect x="32" y="62" width="152" height="168" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><circle cx="108" cy="88" r="14" fill="#3d6fa8"/><text x="108" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text><text x="108" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">투영</text><rect x="48" y="132" width="120" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.3"/><text x="108" y="151" text-anchor="middle" font-size="11" fill="#3d6fa8">W_a · h_t</text><text x="108" y="180" text-anchor="middle" font-size="12" fill="#1d3a5c">(1, 1024)</text><text x="108" y="204" text-anchor="middle" font-size="11" fill="#6b7f95">질문을 하나 만든다</text><path d="M184 146 L198 146" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#atA)"/><rect x="200" y="62" width="152" height="168" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><circle cx="276" cy="88" r="14" fill="#3d6fa8"/><text x="276" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text><text x="276" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">내적</text><rect x="216" y="132" width="120" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.3"/><text x="276" y="151" text-anchor="middle" font-size="11" fill="#3d6fa8">E @ (W_a h_t).T</text><text x="276" y="180" text-anchor="middle" font-size="12" fill="#1d3a5c">(L, 1)</text><text x="276" y="204" text-anchor="middle" font-size="11" fill="#6b7f95">칸마다 점수를 낸다</text><path d="M352 146 L366 146" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#atA)"/><rect x="368" y="62" width="152" height="168" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><circle cx="444" cy="88" r="14" fill="#3d6fa8"/><text x="444" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text><text x="444" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">softmax</text><rect x="384" y="132" width="120" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.3"/><text x="444" y="151" text-anchor="middle" font-size="11" fill="#3d6fa8">점수를 비중으로</text><text x="444" y="180" text-anchor="middle" font-size="12" fill="#1d3a5c">(L, 1)</text><text x="444" y="204" text-anchor="middle" font-size="11" fill="#6b7f95">다 더하면 1이 된다</text><path d="M520 146 L534 146" stroke="#8fb0d4" stroke-width="2" fill="none" marker-end="url(#atA)"/><rect x="536" y="62" width="152" height="168" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><circle cx="612" cy="88" r="14" fill="#3d6fa8"/><text x="612" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text><text x="612" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">가중합</text><rect x="552" y="132" width="120" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.3"/><text x="612" y="151" text-anchor="middle" font-size="11" fill="#3d6fa8">a.T @ E</text><text x="612" y="180" text-anchor="middle" font-size="12" fill="#1d3a5c">(1, 1024)</text><text x="612" y="204" text-anchor="middle" font-size="11" fill="#6b7f95">볼 것만 모아 담는다</text><rect x="32" y="246" width="656" height="64" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="270" text-anchor="middle" font-size="12.5" fill="#40556b">E = encoder_outputs, 즉 앞에서 나온 hidden_states 전부 · h_t = 지금 디코더가 들고 있는 상태</text><text x="360" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">(L, 1) 이 나오면 점수, (1, 1024) 가 나오면 문맥 — 차원만 보고도 어느 단계인지 알 수 있다</text></svg>