<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="504" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">BPE — 자주 붙어 나오는 두 조각을 합치기를 반복한다</text><text x="56" y="104" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">시작</text><rect x="120" y="82" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="139.5" y="105" text-anchor="middle" font-size="13" fill="#1d3a5c">b</text><rect x="167" y="82" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="186.5" y="105" text-anchor="middle" font-size="13" fill="#1d3a5c">a</text><rect x="214" y="82" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="233.5" y="105" text-anchor="middle" font-size="13" fill="#1d3a5c">n</text><rect x="261" y="82" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="280.5" y="105" text-anchor="middle" font-size="13" fill="#1d3a5c">a</text><rect x="308" y="82" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="327.5" y="105" text-anchor="middle" font-size="13" fill="#1d3a5c">n</text><rect x="355" y="82" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="374.5" y="105" text-anchor="middle" font-size="13" fill="#1d3a5c">a</text><text x="430" y="116" text-anchor="start" font-size="11.5" fill="#5b7a99">전부 글자 단위로 쪼개 놓는다</text><text x="56" y="178" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">1회차</text><rect x="120" y="156" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="139.5" y="179" text-anchor="middle" font-size="13" fill="#1d3a5c">b</text><rect x="167" y="156" width="52" height="34" rx="6" fill="#e9f2ec" stroke="#4f8f68" stroke-width="1.6"/><text x="193.0" y="179" text-anchor="middle" font-size="13" fill="#1d3a5c">an</text><rect x="227" y="156" width="52" height="34" rx="6" fill="#e9f2ec" stroke="#4f8f68" stroke-width="1.6"/><text x="253.0" y="179" text-anchor="middle" font-size="13" fill="#1d3a5c">an</text><rect x="287" y="156" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="306.5" y="179" text-anchor="middle" font-size="13" fill="#1d3a5c">a</text><text x="430" y="170" text-anchor="start" font-size="12.5" font-weight="700" fill="#4f8f68">합침: a + n</text><text x="430" y="190" text-anchor="start" font-size="11.5" fill="#5b7a99">가장 많이 붙어 나온 쌍을 합친다</text><text x="56" y="252" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">2회차</text><rect x="120" y="230" width="65" height="34" rx="6" fill="#e9f2ec" stroke="#4f8f68" stroke-width="1.6"/><text x="152.5" y="253" text-anchor="middle" font-size="13" fill="#1d3a5c">ban</text><rect x="193" y="230" width="52" height="34" rx="6" fill="#e9f2ec" stroke="#4f8f68" stroke-width="1.6"/><text x="219.0" y="253" text-anchor="middle" font-size="13" fill="#1d3a5c">an</text><rect x="253" y="230" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="272.5" y="253" text-anchor="middle" font-size="13" fill="#1d3a5c">a</text><text x="430" y="244" text-anchor="start" font-size="12.5" font-weight="700" fill="#4f8f68">합침: b + an</text><text x="430" y="264" text-anchor="start" font-size="11.5" fill="#5b7a99">합쳐진 것끼리 또 합쳐진다</text><text x="56" y="326" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">3회차</text><rect x="120" y="304" width="91" height="34" rx="6" fill="#e9f2ec" stroke="#4f8f68" stroke-width="1.6"/><text x="165.5" y="327" text-anchor="middle" font-size="13" fill="#1d3a5c">banan</text><rect x="219" y="304" width="39" height="34" rx="6" fill="#eef2f7" stroke="#3d6fa8" stroke-width="1.6"/><text x="238.5" y="327" text-anchor="middle" font-size="13" fill="#1d3a5c">a</text><text x="430" y="318" text-anchor="start" font-size="12.5" font-weight="700" fill="#4f8f68">합침: ban + an</text><text x="430" y="338" text-anchor="start" font-size="11.5" fill="#5b7a99">덩어리가 점점 커진다</text><rect x="40" y="378" width="640" height="68" rx="10" fill="#fff" stroke="#1d3a5c" stroke-width="1.6"/><text x="60" y="406" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">사전 크기가 목표에 닿을 때까지 반복한다</text><text x="60" y="430" text-anchor="start" font-size="12.5" fill="#5b7a99">그 결과 자주 쓰는 덩어리는 통째로, 드문 말은 조각으로 남는다</text><text x="360" y="482" text-anchor="middle" font-size="13.5" fill="#40556b">어떤 덩어리를 사전에 넣을지를 사람이 정하지 않고 데이터가 정한다</text></svg>