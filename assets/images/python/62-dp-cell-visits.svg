<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img" aria-label="수영장 문제의 dp[i]는 한 번의 반복에서 후보 셋을 모두 받으므로 첫 후보를 대입해도 되고, 배낭 문제의 dp[c]는 재료마다 다시 방문되므로 기존 값과 비교해야 한다">
  <style>
    .bg { fill: #f7f9fb; }
    .card { fill: #ffffff; stroke: #d5dde6; }
    .t { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d3a5c; }
    .sub { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b7f95; }
    .m { font-family: "Cascadia Mono", Consolas, monospace; fill: #1d3a5c; }
    .c { fill: #eef2f6; stroke: #d5dde6; }
    .hit { fill: #dce7f4; stroke: #3d6fa8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a62" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d6fa8"/></marker>
  </defs>

  <rect class="bg" width="720" height="320" rx="10"/>
  <text class="t" x="24" y="34" font-size="16" font-weight="600">첫날 메모지와 다음 날 메모지</text>
  <text class="sub" x="24" y="56" font-size="13">같은 칸에 다시 오느냐에 따라 첫 후보를 그냥 적어도 되는지가 갈린다.</text>

  <!-- left: pool -->
  <rect class="card" x="20" y="72" width="330" height="232" rx="8"/>
  <text class="t" x="185" y="98" font-size="14" font-weight="600" text-anchor="middle">수영장 — dp[i]에 한 번 온다</text>

  <rect class="c" x="40" y="122" width="72" height="34" rx="4"/><text class="m" x="76" y="144" font-size="12" text-anchor="middle">dp[i-3]</text>
  <rect class="c" x="128" y="122" width="72" height="34" rx="4"/><text class="m" x="164" y="144" font-size="12" text-anchor="middle">dp[i-2]</text>
  <rect class="c" x="216" y="122" width="72" height="34" rx="4"/><text class="m" x="252" y="144" font-size="12" text-anchor="middle">dp[i-1]</text>
  <rect class="hit" x="200" y="222" width="104" height="38" rx="5"/><text class="m" x="252" y="246" font-size="13" text-anchor="middle">dp[i]</text>

  <line x1="242" y1="156" x2="242" y2="218" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a62)"/>
  <line x1="262" y1="156" x2="262" y2="218" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a62)"/>
  <line x1="76" y1="156" x2="204" y2="230" stroke="#3d6fa8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a62)"/>
  <text class="sub" x="270" y="186" font-size="11">① 1일·1달권</text>
  <text class="sub" x="270" y="200" font-size="11">→ 대입</text>
  <text class="sub" x="40" y="232" font-size="11">② 3달권 → min</text>
  <text class="t" x="185" y="288" font-size="12" text-anchor="middle">덮어쓰는 건 초기값 0뿐 — 첫날 메모지</text>

  <!-- right: knapsack -->
  <rect class="card" x="370" y="72" width="330" height="232" rx="8"/>
  <text class="t" x="535" y="98" font-size="14" font-weight="600" text-anchor="middle">배낭 — dp[c]에 재료마다 온다</text>

  <text class="sub" x="390" y="140" font-size="12">재료 1 후</text>
  <text class="sub" x="390" y="190" font-size="12">재료 2 후</text>
  <text class="sub" x="390" y="240" font-size="12">재료 3 후</text>
  <rect class="c" x="470" y="120" width="40" height="30" rx="4"/>
  <rect class="c" x="514" y="120" width="40" height="30" rx="4"/>
  <rect class="hit" x="558" y="120" width="56" height="30" rx="4"/><text class="m" x="586" y="140" font-size="12" text-anchor="middle">dp[c]</text>
  <rect class="c" x="618" y="120" width="40" height="30" rx="4"/>
  <rect class="c" x="470" y="170" width="40" height="30" rx="4"/>
  <rect class="c" x="514" y="170" width="40" height="30" rx="4"/>
  <rect class="hit" x="558" y="170" width="56" height="30" rx="4"/><text class="m" x="586" y="190" font-size="12" text-anchor="middle">dp[c]</text>
  <rect class="c" x="618" y="170" width="40" height="30" rx="4"/>
  <rect class="c" x="470" y="220" width="40" height="30" rx="4"/>
  <rect class="c" x="514" y="220" width="40" height="30" rx="4"/>
  <rect class="hit" x="558" y="220" width="56" height="30" rx="4"/><text class="m" x="586" y="240" font-size="12" text-anchor="middle">dp[c]</text>
  <rect class="c" x="618" y="220" width="40" height="30" rx="4"/>
  <line x1="586" y1="150" x2="586" y2="166" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a62)"/>
  <line x1="586" y1="200" x2="586" y2="216" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a62)"/>
  <text class="sub" x="664" y="164" font-size="11">max</text>
  <text class="sub" x="664" y="214" font-size="11">max</text>
  <text class="t" x="535" y="288" font-size="12" text-anchor="middle">기존 값 = 이전 재료까지의 최적 — 다음 날 메모지</text>
</svg>
