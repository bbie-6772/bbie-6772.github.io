<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="450" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">교차검증에서 스케일링을 언제 하느냐</text><rect x="40" y="66" width="640" height="118" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="60" y="92" text-anchor="start" font-size="13.5" font-weight="700" fill="#a04040">❌ 전체를 미리 스케일링하고 넘기면</text><rect x="60" y="106" width="108" height="30" rx="5" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="1" opacity="0.5"/><text x="114.0" y="126" text-anchor="middle" font-size="11.5" fill="#fff">1번 폴드</text><rect x="176" y="106" width="108" height="30" rx="5" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="1" opacity="0.5"/><text x="230.0" y="126" text-anchor="middle" font-size="11.5" fill="#fff">2번 폴드</text><rect x="292" y="106" width="108" height="30" rx="5" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="1" opacity="0.5"/><text x="346.0" y="126" text-anchor="middle" font-size="11.5" fill="#fff">3번 폴드</text><rect x="408" y="106" width="108" height="30" rx="5" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="1" opacity="0.5"/><text x="462.0" y="126" text-anchor="middle" font-size="11.5" fill="#fff">4번 폴드</text><rect x="524" y="106" width="108" height="30" rx="5" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="1" opacity="0.5"/><text x="578.0" y="126" text-anchor="middle" font-size="11.5" fill="#fff">5번 폴드</text><path d="M60 148 L660 148" stroke="#a04040" stroke-width="2" stroke-dasharray="6 4"/><text x="60" y="172" text-anchor="start" font-size="12.5" fill="#a04040">평균·표준편차가 이미 5개 폴드 전부를 보고 계산된 상태 — 검증 폴드 정보가 새어 들어갔다</text><rect x="40" y="206" width="640" height="190" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="60" y="232" text-anchor="start" font-size="13.5" font-weight="700" fill="#4f8f68">✅ Pipeline으로 묶어서 넘기면</text><rect x="60" y="250