<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><text x="360" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">같은 대화인데 학습용과 추론용이 다르게 끝난다</text><rect x="32" y="56" width="316" height="212" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="190" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">학습</text><text x="190" y="99" text-anchor="middle" font-size="10.5" fill="#3d6fa8">add_generation_prompt = False</text><rect x="54" y="112" width="272" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2" stroke-dasharray="none"/><text x="64" y="131" font-size="10" fill="#6b7f95">&lt;start_of_turn&gt;user</text><text x="316" y="131" text-anchor="end" font-size="10.5" fill="#1d3a5c">서리 늑대 설명 써줘</text><rect x="54" y="146" width="272" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2" stroke-dasharray="none"/><text x="64" y="165" font-size="10" fill="#6b7f95">&lt;start_of_turn&gt;model</text><text x="316" y="165" text-anchor="end" font-size="10.5" fill="#1d3a5c">눈보라 속에서 이동 속도가 오른다</text><rect x="54" y="180" width="272" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2" stroke-dasharray="none"/><text x="64" y="199" font-size="10" fill="#6b7f95">끝</text><text x="316" y="199" text-anchor="end" font-size="10.5" fill="#1d3a5c">대화가 닫혀 있다</text><rect x="372" y="56" width="316" height="212" rx="10" fill="#fff" stroke="#a04040" stroke-width="1.8"/><text x="530" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d3a5c">추론</text><text x="530" y="99" text-anchor="middle" font-size="10.5" fill="#a04040">add_generation_prompt = True</text><rect x="394" y="112" width="272" height="28" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2" stroke-dasharray="none"/><text x="404" y="131" font-size="10" fill="#6b7f95">&lt;start_of_turn&gt;user</text><text x="656" y="131" text-anchor="end" font-size="10.5" fill="#1d3a5c">불꽃 도마뱀 설명 써줘</text><rect x="394" y="146" width="272" height="24" rx="5" fill="#f6ecec" stroke="#a04040" stroke-width="1.8" stroke-dasharray="4 3"/><text x="404" y="165" font-size="10" fill="#a04040">&lt;start_of_turn&gt;model</text><text x="530" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#a04040">여기부터 모델이 쓴다</text><rect x="32" y="282" width="656" height="44" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="300" text-anchor="middle" font-size="12" fill="#40556b">학습 때는 정답까지 들어간 완성된 대화를 넣고, 추론 때는 모델 차례를 열어둔 채로 넘긴다</text><text x="360" y="318" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">추론에서 False로 두면 모델이 자기 차례인 줄 모른다</text></svg>