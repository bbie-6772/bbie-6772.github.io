<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="420" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">AI 파이썬 라이브러리 — 아래층 위에 위층이 얹혀 있다</text><rect x="210.0" y="66" width="300" height="52" rx="10" fill="#efecf5" stroke="#6b5b95" stroke-width="2"/><text x="360" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6b5b95">Transformers · 사전학습 모델</text><text x="360" y="108" text-anchor="middle" font-size="11.5" fill="#5b7a99">남이 학습해둔 모델을 가져다 쓴다</text><rect x="172.0" y="128" width="376" height="52" rx="10" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/><text x="360" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c2703c">PyTorch · 딥러닝 프레임워크</text><text x="360" y="170" text-anchor="middle" font-size="11.5" fill="#5b7a99">직접 신경망을 만들고 학습시킨다</text><rect x="134.0" y="190" width="452" height="52" rx="10" fill="#e9f2ec" stroke="#4f8f68" stroke-width="2"/><text x="360" y="214" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4f8f68">scikit-learn · 머신러닝</text><text x="360" y="232" text-anchor="middle" font-size="11.5" fill="#5b7a99">분할·전처리·모델·평가를 한 문법으로</text><rect x="96.0" y="252" width="528" height="52" rx="10" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/><text x="360" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3d6fa8">pandas · matplotlib · seaborn</text><text x="360" y="294" text-anchor="middle" font-size="11.5" fill="#5b7a99">표를 다루고 그림으로 확인한다</text><rect x="58.0" y="314" width="604" height="52" rx="10" fill="#e6eaef" stroke="#1d3a5c" stroke-width="2"/><text x="360" y="338" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">NumPy · 배열 계산</text><text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#5b7a99">모든 것의 바닥. 숫자 덩어리를 빠르게 굴린다</text><text x="360" y="398" text-anchor="middle" font-size="13.5" fill="#40556b">위층은 아래층을 부른다 — NumPy 배열이 결국 전부의 공통 언어다</text></svg>