 y="217" text-anchor="middle" font-size="12" fill="#1d3a5c">…</text><text x="60" y="264" text-anchor="start" font-size="13" fill="#1d3a5c">토큰 887번이 들어오면 → 887번째 줄을 그대로 꺼내 준다. 그게 전부다.</text><text x="60" y="288" text-anchor="start" font-size="12.5" fill="#5b7a99">입력은 반드시 정수(long) — 몇 번째 줄인지를 가리키는 번호이기 때문이다</text><rect x="40" y="308" width="640" height="70" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="60" y="336" text-anchor="start" font-size="13.5" font-weight="700" fill="#c2703c">그런데 이 표의 값도 학습되는 파라미터다</text><text x="60" y="360" text-anchor="start" font-size="12.5" fill="#1d3a5c">처음엔 전부 무작위 → 문장을 읽으며 비슷한 단어끼리 값이 가까워진다</text><text x="360" y="418" text-anchor="middle" font-size="13.5" fill="#40556b">우리가 알려준 게 아니라 모델이 문장을 읽으며 스스로 정리한 결과다</text></svg>