<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">칸이 정해져 있는가, 내가 칸을 만드는가</text><rect x="32" y="58" width="316" height="204" rx="10" fill="#fff" stroke="#6b7f95" stroke-width="1.8"/><text x="190" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">ResNet-50</text><text x="190" y="104" text-anchor="middle" font-size="11.5" fill="#6b7f95">미리 정해진 1000칸</text><rect x="60" y="116" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="190" y="133" text-anchor="middle" font-size="11" fill="#40556b">red fox</text><rect x="60" y="146" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="190" y="163" text-anchor="middle" font-size="11" fill="#40556b">kit fox</text><rect x="60" y="176" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="190" y="193" text-anchor="middle" font-size="11" fill="#40556b">Arctic fox</text><rect x="60" y="206" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="190" y="223" text-anchor="middle" font-size="11" fill="#40556b">grey fox</text><text x="190" y="250" text-anchor="middle" font-size="11" fill="#6b7f95" font-weight="700">화풍은 칸에 없어서 못 고른다</text><rect x="372" y="58" width="316" height="204" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/><text x="530" y="84" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3a5c">CLIP</text><text x="530" y="104" text-anchor="middle" font-size="11.5" fill="#3d6fa8">내가 써 넣은 문장</text><rect x="400" y="116" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="530" y="133" text-anchor="middle" font-size="11" fill="#40556b">수채화로 그린 여우</text><rect x="400" y="146" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="530" y="163" text-anchor="middle" font-size="11" fill="#40556b">유화로 그린 여우</text><rect x="400" y="176" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="530" y="193" text-anchor="middle" font-size="11" fill="#40556b">사진으로 찍은 여우</text><rect x="400" y="206" width="260" height="24" rx="5" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.2"/><text x="530" y="223" text-anchor="middle" font-size="11" fill="#40556b">수채화로 그린 개</text><text x="530" y="250" text-anchor="middle" font-size="11" fill="#3d6fa8" font-weight="700">칸을 문장으로 새로 만들 수 있다</text><rect x="32" y="276" width="656" height="44" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="304" text-anchor="middle" font-size="12.5" fill="#40556b">둘 다 같은 그림을 보지만, 대답할 수 있는 질문의 종류가 다르다</text></svg>