<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="338" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">zero_grad()를 빼먹으면 — 점수가 지워지지 않고 쌓인다</text><rect x="40" y="80" width="300" height="196" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><text x="60" y="110" text-anchor="start" font-size="14" font-weight="700" fill="#a04040">❌ 지우지 않으면</text><text x="60" y="136" text-anchor="start" font-size="11.5" fill="#5b7a99">이번 배치 기울기</text><text x="210" y="136" text-anchor="start" font-size="11.5" fill="#5b7a99">쌓인 값</text><text x="60" y="162" text-anchor="start" font-size="12.5" fill="#1d3a5c">1번 배치</text><text x="160" y="162" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">5</text><text x="215" y="162" text-anchor="start" font-size="14" font-weight="700" fill="#a04040">5</text><rect x="240" y="150" width="40" height="15" rx="3" fill="#a04040" opacity="0.5"/><text x="60" y="196" text-anchor="start" font-size="12.5" fill="#1d3a5c">2번 배치</text><text x="160" y="196" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">3</text><text x="215" y="196" text-anchor="start" font-size="14" font-weight="700" fill="#a04040">8</text><rect x="240" y="184" width="64" height="15" rx="3" fill="#a04040" opacity="0.5"/><text x="60" y="230" text-anchor="start" font-size="12.5" fill="#1d3a5c">3번 배치</text><text x="160" y="230" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">4</text><text x="215" y="230" text-anchor="start" font-size="14" font-weight="700" fill="#a04040">12</text><rect x="240" y="218" width="96" height="15" rx="3" fill="#a04040" opacity="0.5"/><text x="60" y="266" text-anchor="start" font-size="12" fill="#a04040">엉뚱한 방향으로 크게 움직인다</text><rect x="380" y="80" width="300" height="196" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="400" y="110" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">✅ 매번 지우면</text><text x="400" y="136" text-anchor="start" font-size="11.5" fill="#5b7a99">이번 배치 기울기</text><text x="550" y="136" text-anchor="start" font-size="11.5" fill="#5b7a99">쌓인 값</text><text x="400" y="162" text-anchor="start" font-size="12.5" fill="#1d3a5c">1번 배치</text><text x="500" y="162" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">5</text><text x="555" y="162" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">5</text><rect x="580" y="150" width="40" height="15" rx="3" fill="#4f8f68" opacity="0.5"/><text x="400" y="196" text-anchor="start" font-size="12.5" fill="#1d3a5c">2번 배치</text><text x="500" y="196" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">3</text><text x="555" y="196" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">3</text><rect x="580" y="184" width="24" height="15" rx="3" fill="#4f8f68" opacity="0.5"/><text x="400" y="230" text-anchor="start" font-size="12.5" fill="#1d3a5c">3번 배치</text><text x="500" y="230" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">4</text><text x="555" y="230" text-anchor="start" font-size="14" font-weight="700" fill="#4f8f68">4</text><rect x="580" y="218" width="32" height="15" rx="3" fill="#4f8f68" opacity="0.5"/><text x="400" y="266" text-anchor="start" font-size="12" fill="#4f8f68">이번 배치만큼만 움직인다</text><text x="360" y="316" text-anchor="middle" font-size="13.5" fill="#40556b">PyTorch가 .grad를 덮어쓰지 않고 더하도록 설계되어 있기 때문이다</text></svg>