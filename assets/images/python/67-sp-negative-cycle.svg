<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-label="B와 C 사이에 합이 -1인 음수 사이클이 있을 때 사이클 위의 B, C와 사이클에서 갈 수 있는 D는 거리가 음의 무한대가 되고, 사이클로 들어가기만 하는 F와 관련 없는 E는 원래 거리를 유지한다">
  <style>
    .bg { fill: #f7f9fb; }
    .card { fill: #ffffff; stroke: #d5dde6; }
    .t { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d3a5c; }
    .sub { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b7f95; }
    .m { font-family: "Cascadia Mono", Consolas, monospace; fill: #1d3a5c; }
    .c { fill: #eef2f6; stroke: #d5dde6; }
    .bad { fill: #f6e6e6; stroke: #a04040; stroke-width: 1.5; }
    .r { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #a04040; }
    .rm { font-family: "Cascadia Mono", Consolas, monospace; fill: #a04040; }
  </style>
  <defs>
    <marker id="a67" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d6fa8"/></marker>
    <marker id="r67" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a04040"/></marker>
  </defs>

  <rect class="bg" width="720" height="300" rx="10"/>
  <text class="t" x="24" y="34" font-size="16" font-weight="600">−∞가 되는 건 사이클에서 "나가서" 닿는 정점이다</text>
  <text class="sub" x="24" y="56" font-size="13">B → C → B 한 바퀴 합 = 2 − 3 = −1</text>

  <rect class="card" x="20" y="72" width="680" height="212" rx="8"/>
  <!-- nodes -->
  <circle class="c" cx="80" cy="170" r="22"/><text class="m" x="80" y="175" font-size="14" text-anchor="middle">A</text>
  <text class="sub" x="80" y="210" font-size="11" text-anchor="middle">0</text>
  <circle class="c" cx="200" cy="250" r="22"/><text class="m" x="200" y="255" font-size="14" text-anchor="middle">F</text>
  <text class="sub" x="236" y="270" font-size="11">2</text>
  <circle class="c" cx="200" cy="100" r="22"/><text class="m" x="200" y="105" font-size="14" text-anchor="middle">E</text>
  <text class="sub" x="236" y="104" font-size="11">4</text>
  <circle class="bad" cx="320" cy="170" r="22"/><text class="m" x="320" y="175" font-size="14" text-anchor="middle">B</text>
  <circle class="bad" cx="460" cy="170" r="22"/><text class="m" x="460" y="175" font-size="14" text-anchor="middle">C</text>
  <circle class="bad" cx="590" cy="170" r="22"/><text class="m" x="590" y="175" font-size="14" text-anchor="middle">D</text>
  <!-- edges -->
  <line x1="102" y1="170" x2="294" y2="170" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a67)"/><text class="m" x="200" y="164" font-size="12" text-anchor="middle">1</text>
  <line x1="96" y1="186" x2="180" y2="238" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a67)"/><text class="m" x="126" y="228" font-size="12">2</text>
  <line x1="96" y1="154" x2="180" y2="112" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a67)"/><text class="m" x="126" y="124" font-size="12">4</text>
  <line x1="218" y1="236" x2="300" y2="186" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a67)"/><text class="m" x="264" y="226" font-size="12">1</text>
  <path d="M340 158 C 370 130, 410 130, 440 158" fill="none" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a67)"/><text class="m" x="390" y="128" font-size="12" text-anchor="middle">2</text>
  <path d="M440 182 C 410 210, 370 210, 340 182" fill="none" stroke="#a04040" stroke-width="1.5" marker-end="url(#r67)"/><text class="rm" x="390" y="224" font-size="12" text-anchor="middle">−3</text>
  <line x1="482" y1="170" x2="564" y2="170" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a67)"/><text class="m" x="523" y="164" font-size="12" text-anchor="middle">1</text>
  <text class="r" x="455" y="104" font-size="12" text-anchor="middle">B, C, D = −∞</text>
  <text class="sub" x="590" y="230" font-size="11" text-anchor="middle">사이클에서 나가서 닿음</text>
  <text class="t" x="560" y="262" font-size="11" text-anchor="middle">F는 사이클로 들어가기만 해서 2 그대로</text>
</svg>
