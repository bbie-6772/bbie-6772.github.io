<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><defs><marker id="tkA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker></defs><text x="360" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">토크나이저는 가져오는 게 아니라 만드는 것이다</text><rect x="32" y="56" width="316" height="230" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="190" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6fa8">① 학습 — 사전을 만든다</text><rect x="60" y="96" width="260" height="40" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="190" y="121" text-anchor="middle" font-size="12.5" fill="#1d3a5c">말뭉치 — 채팅 로그 .txt</text><path d="M190 136 L190 156" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#tkA)"/><rect x="60" y="160" width="260" height="52" rx="6" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="190" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">tokenizer.train( ... )</text><text x="190" y="200" text-anchor="middle" font-size="11" fill="#6b7f95">vocab_size · min_frequency · limit_alphabet</text><path d="M190 212 L190 232" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#tkA)"/><rect x="60" y="236" width="260" height="40" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="190" y="261" text-anchor="middle" font-size="12.5" fill="#1d3a5c">단어 사전 30,000칸</text><rect x="372" y="56" width="316" height="230" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.6"/><text x="530" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3d6fa8">② 사용 — 문장을 번호로</text><rect x="400" y="96" width="260" height="40" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="530" y="121" text-anchor="middle" font-size="12.5" fill="#1d3a5c">"길드원 모집합니다"</text><path d="M530 136 L530 156" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#tkA)"/><rect x="400" y="160" width="260" height="52" rx="6" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="530" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">encode()</text><text x="530" y="200" text-anchor="middle" font-size="11" fill="#6b7f95">길드 · ##원 · 모집 · ##합니다</text><path d="M530 212 L530 232" stroke="#3d6fa8" stroke-width="2" fill="none" marker-end="url(#tkA)"/><rect x="400" y="236" width="260" height="40" rx="6" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="530" y="261" text-anchor="middle" font-size="12.5" fill="#1d3a5c">[ 812, 45, 1190, 233 ]</text><rect x="40" y="298" width="640" height="30" rx="8" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.4"/><text x="360" y="318" text-anchor="middle" font-size="12.5" fill="#40556b">사전에 없는 조각은 ## 를 붙여 이어 쓴다 — 그래서 처음 보는 단어도 통째로 버려지지 않는다</text></svg>
