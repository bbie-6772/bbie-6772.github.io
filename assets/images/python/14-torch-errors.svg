<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="504" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">PyTorch 에러 — 메시지만 읽어도 절반은 끝난다</text><rect x="40" y="70" width="640" height="76" rx="10" fill="#fff" stroke="#a04040" stroke-width="2"/><rect x="40" y="70" width="8" height="76" rx="4" fill="#a04040"/><text x="64" y="96" text-anchor="start" font-size="13" font-weight="700" fill="#a04040">Torch not compiled with CUDA enabled</text><text x="64" y="120" text-anchor="start" font-size="12.5" fill="#1d3a5c">CPU 전용 버전이 깔려 있다</text><text x="64" y="138" text-anchor="start" font-size="12" fill="#5b7a99">→ GPU 버전으로 재설치</text><rect x="40" y="162" width="640" height="76" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><rect x="40" y="162" width="8" height="76" rx="4" fill="#c2703c"/><text x="64" y="188" text-anchor="start" font-size="13" font-weight="700" fill="#c2703c">Expected all tensors to be on the same device</text><text x="64" y="212" text-anchor="start" font-size="12.5" fill="#1d3a5c">모델과 데이터가 다른 곳에 있다</text><text x="64" y="230" text-anchor="start" font-size="12" fill="#5b7a99">→ .to(device)를 빠뜨린 줄 찾기</text><rect x="40" y="254" width="640" height="76" rx="10" fill="#fff" stroke="#6b5b95" stroke-width="2"/><rect x="40" y="254" width="8" height="76" rx="4" fill="#6b5b95"/><text x="64" y="280" text-anchor="start" font-size="13" font-weight="700" fill="#6b5b95">must have the same dtype</text><text x="64" y="304" text-anchor="start" font-size="12.5" fill="#1d3a5c">float32와 float64가 섞였다</text><text x="64" y="322" text-anchor="start" font-size="12" fill="#5b7a99">→ .float() 으로 통일</text><rect x="40" y="350" width="640" height="92" rx="10" fill="#eef2f7" stroke="#1d3a5c" stroke-width="1.6"/><text x="60" y="378" text-anchor="start" font-size="13.5" font-weight="700" fill="#1d3a5c">고치기 전에 항상 이 세 줄부터</text><text x="60" y="404" text-anchor="start" font-size="12" fill="#1d3a5c">print(next(model.parameters()).device)     # 모델은 어디 있나</text><text x="60" y="426" text-anchor="start" font-size="12" fill="#1d3a5c">print(x.device, x.dtype)                   # 데이터는 어디 있고 무슨 타입인가</text><text x="360" y="482" text-anchor="middle" font-size="13.5" fill="#40556b">찍어보고 고치면 3분, 안 찍어보고 고치면 반나절이다</text></svg>