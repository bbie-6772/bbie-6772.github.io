<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">빈칸을 만나면 — 무엇으로 채울지 고르는 순서</text><rect x="250" y="62" width="220" height="44" rx="10" fill="#eef2f7" stroke="#1d3a5c" stroke-width="2"/><text x="360" y="89" text-anchor="middle" font-size="13" fill="#1d3a5c">이 열은 어떤 종류인가?</text><path d="M360 108 L150 138" stroke="#5b7a99" stroke-width="1.6"/><rect x="40" y="142" width="220" height="74" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="2"/><text x="150" y="166" text-anchor="middle" font-size="12" fill="#5b7a99">숫자인데 튀는 값 없음</text><text x="150" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#3d6fa8">평균 (mean)</text><path d="M360 108 L360 138" stroke="#5b7a99" stroke-width="1.6"/><rect x="250" y="142" width="220" height="74" rx="10" fill="#fff" stroke="#4f8f68" stroke-width="2"/><text x="360" y="166" text-anchor="middle" font-size="12" fill="#5b7a99">숫자인데 튀는 값 있음</text><text x="360" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">중앙값 (median)</text><path d="M360 108 L570 138" stroke="#5b7a99" stroke-width="1.6"/><rect x="460" y="142" width="220" height="74" rx="10" fill="#fff" stroke="#c2703c" stroke-width="2"/><text x="570" y="166" text-anchor="middle" font-size="12" fill="#5b7a99">글자 · 카테고리</text><text x="570" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#c2703c">최빈값 (mode)</text><rect x="40" y="246" width="640" height="96" rx="10" fill="#fff" stroke="#c8d4e0" stroke-width="2"/><text x="60" y="272" text-anchor="start" font-size="13" font-weight="700" fill="#1d3a5c">위 셋으로 안 풀리는 경우</text><text x="60" y="300" text-anchor="start" font-size="12" fill="#5b7a99">빈칸이 0을 뜻할 때</text><text x="60" y="322" text-anchor="start" font-size="13" font-weight="700" fill="#6b5b95">fillna(0)</text><text x="270" y="300" text-anchor="start" font-size="12" fill="#5b7a99">시간 순서 데이터</text><text x="270" y="322" text-anchor="start" font-size="13" font-weight="700" fill="#6b5b95">ffill / bfill</text><text x="480" y="300" text-anchor="start" font-size="12" fill="#5b7a99">빈칸이 아주 적을 때</text><text x="480" y="322" text-anchor="start" font-size="13" font-weight="700" fill="#6b5b95">dropna</text><text x="360" y="378" text-anchor="middle" font-size="13.5" fill="#40556b">무엇으로 채우든, 채우기 전에 '왜 비었는지'를 먼저 물어야 한다</text></svg>