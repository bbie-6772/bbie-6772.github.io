<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="12" fill="#f7f9fb"/><text x="360" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">무엇을 그릴지 막힐 때 — 질문이 먼저, 그래프가 나중</text><text x="140" y="78" text-anchor="middle" font-size="12" fill="#5b7a99" font-weight="700">궁금한 것</text><text x="376" y="78" text-anchor="middle" font-size="12" fill="#5b7a99" font-weight="700">그래프</text><text x="578" y="78" text-anchor="middle" font-size="12" fill="#5b7a99" font-weight="700">함수</text><rect x="40" y="90" width="200" height="30" rx="6" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="140" y="110" text-anchor="middle" font-size="12" fill="#1d3a5c">시간에 따른 변화</text><line x1="244" y1="105" x2="274" y2="105" stroke="#c8d4e0" stroke-width="1.6"/><rect x="278" y="90" width="196" height="30" rx="6" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="1.6" opacity="0.14"/><text x="376" y="110" text-anchor="middle" font-size="12" fill="#3d6fa8" font-weight="700">선 그래프</text><text x="578" y="110" text-anchor="middle" font-size="11.5" fill="#5b7a99">plot() / lineplot()</text><rect x="40" y="126" width="200" height="30" rx="6" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="140" y="146" text-anchor="middle" font-size="12" fill="#1d3a5c">범주별 크기 비교</text><line x1="244" y1="141" x2="274" y2="141" stroke="#c8d4e0" stroke-width="1.6"/><rect x="278" y="126" width="196" height="30" rx="6" fill="#c2703c" stroke="#c2703c" stroke-width="1.6" opacity="0.14"/><text x="376" y="146" text-anchor="middle" font-size="12" fill="#c2703c" font-weight="700">막대 그래프</text><text x="578" y="146" text-anchor="middle" font-size="11.5" fill="#5b7a99">bar() / barplot()</text><rect x="40" y="162" width="200" height="30" rx="6" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="140" y="182" text-anchor="middle" font-size="12" fill="#1d3a5c">범주별 개수</text><line x1="244" y1="177" x2="274" y2="177" stroke="#c8d4e0" stroke-width="1.6"/><rect x="278" y="162" width="196" height="30" rx="6" fill="#c2703c" stroke="#c2703c" stroke-width="1.6" opacity="0.14"/><text x="376" y="182" text-anchor="middle" font-size="12" fill="#c2703c" font-weight="700">막대 그래프</text><text x="578" y="182" text-anchor="middle" font-size="11.5" fill="#5b7a99">countplot()</text><rect x="40" y="198" width="200" height="30" rx="6" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="140" y="218" text-anchor="middle" font-size="12" fill="#1d3a5c">값의 분포</text><line x1="244" y1="213" x2="274" y2="213" stroke="#c8d4e0" stroke-width="1.6"/><rect x="278" y="198" width="196" height="30" rx="6" fill="#4f8f68" stroke="#4f8f68" stroke-width="1.6" opacity="0.14"/><text x="376" y="218" text-anchor="middle" font-size="12" fill="#4f8f68" font-weight="700">히스토그램</text><text x="578" y="218" text-anchor="middle" font-size="11.5" fill="#5b7a99">hist() / histplot()</text><rect x="40" y="234" width="200" height="30" rx="6" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="140" y="254" text-anchor="middle" font-size="12" fill="#1d3a5c">두 값의 관계</text><line x1="244" y1="249" x2="274" y2="249" stroke="#c8d4e0" stroke-width="1.6"/><rect x="278" y="234" width="196" height="30" rx="6" fill="#6b5b95" stroke="#6b5b95" stroke-width="1.6" opacity="0.14"/><text x="376" y="254" text-anchor="middle" font-size="12" fill="#6b5b95" font-weight="700">산점도</text><text x="578" y="254" text-anchor="middle" font-size="11.5" fill="#5b7a99">scatter() / scatterplot()</text><rect x="40" y="270" width="200" height="30" rx="6" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="140" y="290" text-anchor="middle" font-size="12" fill="#1d3a5c">그룹별 분포 · 이상치</text><line x1="244" y1="285" x2="274" y2="285" stroke="#c8d4e0" stroke-width="1.6"/><rect x="278" y="270" width="196" height="30" rx="6" fill="#4f8f68" stroke="#4f8f68" stroke-width="1.6" opacity="0.14"/><text x="376" y="290" text-anchor="middle" font-size="12" fill="#4f8f68" font-weight="700">박스플롯</text><text x="578" y="290" text-anchor="middle" font-size="11.5" fill="#5b7a99">boxplot()</text><rect x="40" y="306" width="200" height="30" rx="6" fill="#fff" stroke="#c8d4e0" stroke-width="1.6"/><text x="140" y="326" text-anchor="middle" font-size="12" fill="#1d3a5c">열끼리의 관계 전체</text><line x1="244" y1="321" x2="274" y2="321" stroke="#c8d4e0" stroke-width="1.6"/><rect x="278" y="306" width="196" height="30" rx="6" fill="#3d6fa8" stroke="#3d6fa8" stroke-width="1.6" opacity="0.14"/><text x="376" y="326" text-anchor="middle" font-size="12" fill="#3d6fa8" font-weight="700">히트맵 · 페어플롯</text><text x="578" y="326" text-anchor="middle" font-size="11.5" fill="#5b7a99">heatmap() / pairplot()</text><rect x="40" y="348" width="640" height="34" rx="10" fill="#eef2f7" stroke="#c8d4e0" stroke-width="1.6"/><text x="360" y="370" text-anchor="middle" font-size="13" fill="#a04040">파이 차트는 피하자 — 사람 눈은 각도보다 길이를 훨씬 정확하게 읽는다</text></svg>