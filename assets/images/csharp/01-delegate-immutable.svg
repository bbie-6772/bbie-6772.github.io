<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="onHit에 a와 b를 구독했다가 해제하는 동안 +=와 -=는 매번 새 delegate 객체를 만들고 onHit은 그 새 객체를 가리키며, 이전 객체는 바뀌지 않고 남는다. 모두 빠지면 onHit은 null이 된다">
  <style>
    .bg { fill: #f7f9fb; }
    .card { fill: #ffffff; stroke: #d5dde6; }
    .t { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d3a5c; }
    .sub { font-family: Pretendard, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b7f95; }
    .m { font-family: "Cascadia Mono", Consolas, monospace; fill: #1d3a5c; }
    .mg { font-family: "Cascadia Mono", Consolas, monospace; fill: #6b7f95; }
    .c { fill: #eef2f6; stroke: #d5dde6; }
    .hit { fill: #dce7f4; stroke: #3d6fa8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a01" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3d6fa8"/></marker>
  </defs>

  <rect class="bg" width="720" height="330" rx="10"/>
  <text class="t" x="24" y="34" font-size="16" font-weight="600">+=와 -=는 기존 delegate를 고치지 않는다</text>
  <text class="sub" x="24" y="56" font-size="13">바뀌는 건 onHit이 가리키는 곳이고, 이전 객체는 그대로 남는다</text>

  <rect class="card" x="20" y="72" width="680" height="242" rx="8"/>
  <text class="sub" x="40" y="96" font-size="11">실행한 코드</text>
  <text class="sub" x="300" y="96" font-size="11">onHit이 새로 가리키는 객체</text>

  <text class="m" x="40" y="128" font-size="13">onHit += a.Refresh</text>
  <line x1="220" y1="124" x2="292" y2="124" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a01)"/>
  <rect class="hit" x="300" y="108" width="130" height="32" rx="4"/><text class="m" x="365" y="129" font-size="12" text-anchor="middle">(a, Refresh)</text>

  <text class="m" x="40" y="180" font-size="13">onHit += b.Refresh</text>
  <line x1="220" y1="176" x2="292" y2="176" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a01)"/>
  <rect class="hit" x="300" y="160" width="130" height="32" rx="4"/><text class="m" x="365" y="181" font-size="12" text-anchor="middle">(a, Refresh)</text>
  <rect class="hit" x="434" y="160" width="130" height="32" rx="4"/><text class="m" x="499" y="181" font-size="12" text-anchor="middle">(b, Refresh)</text>
  <text class="sub" x="580" y="181" font-size="11">복사 후 b를 붙임</text>

  <text class="m" x="40" y="232" font-size="13">onHit -= a.Refresh</text>
  <line x1="220" y1="228" x2="292" y2="228" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a01)"/>
  <rect class="hit" x="300" y="212" width="130" height="32" rx="4"/><text class="m" x="365" y="233" font-size="12" text-anchor="middle">(b, Refresh)</text>
  <text class="sub" x="446" y="233" font-size="11">a를 뺀 새 객체</text>

  <text class="m" x="40" y="284" font-size="13">onHit -= b.Refresh</text>
  <line x1="220" y1="280" x2="292" y2="280" stroke="#3d6fa8" stroke-width="1.5" marker-end="url(#a01)"/>
  <text class="m" x="300" y="285" font-size="13">null</text>
  <text class="sub" x="346" y="285" font-size="11">비면 null — 그래서 OnHit?.Invoke()</text>
</svg>
