<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-size="17" font-weight="700" fill="#1d3a5c">센서를 열 개 붙이고 하룻밤 — 그런데 문제가 남는다</text>
  <text x="32" y="62" font-size="12" fill="#6b7f95">수면다원검사는 전문 수면기사가 파형을 눈으로 보며 30초씩 채점한다</text>

  <text x="32" y="94" font-size="12" font-weight="700" fill="#6b7f95">채점하는 쪽의 문제</text>
  <g>
    <rect x="32" y="104" width="208" height="76" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="136" y="130" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">인력 부족</text>
    <text x="136" y="156" font-size="11" fill="#6b7f95" text-anchor="middle">채점 규칙부터 따로 배워야 한다</text>

    <rect x="256" y="104" width="208" height="76" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="360" y="130" font-size="13" font-weight="700" fill="#1d3a5c" text-anchor="middle">비용 부담</text>
    <text x="360" y="156" font-size="11" fill="#6b7f95" text-anchor="middle">한 건에 약 2시간, 노동 집약적</text>

    <rect x="480" y="104" width="208" height="76" rx="10" fill="#ffffff" stroke="#a04040" stroke-width="2"/>
    <text x="584" y="130" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">정확도 82%</text>
    <text x="584" y="156" font-size="11" fill="#6b7f95" text-anchor="middle">채점자끼리 동의할 확률이다</text>
  </g>

  <text x="32" y="212" font-size="12" font-weight="700" fill="#6b7f95">검사 방식 자체의 문제</text>
  <g>
    <rect x="32" y="222" width="320" height="82" rx="10" fill="#fbf2f2" stroke="#a04040"/>
    <text x="192" y="248" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">첫날 밤 효과</text>
    <text x="192" y="272" font-size="11" fill="#6b7f95" text-anchor="middle">낯선 병실에 센서를 열 개 붙이고 자면</text>
    <text x="192" y="290" font-size="11" fill="#6b7f95" text-anchor="middle">평소 수면과 상태가 달라진다</text>

    <rect x="368" y="222" width="320" height="82" rx="10" fill="#fbf2f2" stroke="#a04040"/>
    <text x="528" y="248" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">하룻밤 문제</text>
    <text x="528" y="272" font-size="11" fill="#6b7f95" text-anchor="middle">수면은 매일 밤 달라지는데</text>
    <text x="528" y="290" font-size="11" fill="#6b7f95" text-anchor="middle">하루로 평소 패턴을 대표해야 한다</text>
  </g>

  <text x="32" y="330" font-size="13" fill="#1d3a5c">위 셋은 <tspan font-weight="700">자동화로 풀 수 있고</tspan>, 아래 둘은 <tspan font-weight="700">집에서 잴 수 있어야</tspan> 풀린다.</text>
</svg>
