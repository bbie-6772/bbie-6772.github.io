<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="320" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-size="17" font-weight="700" fill="#1d3a5c">CNN은 이미 전문지식을 주입한 결과물이었다</text>
  <text x="32" y="62" font-size="12" fill="#6b7f95">사람이 눈으로 사물을 알아보는 방식을 신경망 구조에 미리 새겨 넣은 것</text>

  <rect x="32" y="80" width="316" height="176" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="190" y="106" font-size="13" font-weight="700" fill="#6b7f95" text-anchor="middle">가정 없이 만들면</text>
  <text x="190" y="136" font-size="12" fill="#1d3a5c" text-anchor="middle">모든 화소를 모든 화소와 연결한다</text>
  <text x="190" y="168" font-size="12" fill="#6b7f95" text-anchor="middle">"뭐가 중요한지는 데이터가 알려주겠지"</text>
  <line x1="72" y1="186" x2="308" y2="186" stroke="#eef1f4"/>
  <text x="190" y="212" font-size="12" fill="#a04040" text-anchor="middle">파라미터가 폭발하고</text>
  <text x="190" y="234" font-size="12" fill="#a04040" text-anchor="middle">학습은 오래 걸린다</text>

  <rect x="372" y="80" width="316" height="176" rx="10" fill="#ffffff" stroke="#3d6fa8" stroke-width="2"/>
  <text x="530" y="106" font-size="13" font-weight="700" fill="#3d6fa8" text-anchor="middle">사람의 시각을 새겨 넣으면</text>
  <text x="412" y="136" font-size="12" fill="#1d3a5c">· 가까운 화소끼리 먼저 본다</text>
  <text x="412" y="158" font-size="11" fill="#6b7f95">  왼쪽 위 물체를 볼 때 오른쪽 아래는 안 봐도 된다</text>
  <text x="412" y="184" font-size="12" fill="#1d3a5c">· 어디에 있든 같은 물체다</text>
  <text x="412" y="206" font-size="11" fill="#6b7f95">  왼쪽 위에 있든 오른쪽 아래에 있든 특징은 같다</text>
  <line x1="412" y1="220" x2="648" y2="220" stroke="#eef1f4"/>
  <text x="530" y="242" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">훨씬 가벼운데 성능은 더 높다</text>

  <rect x="32" y="272" width="656" height="36" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="52" y="296" font-size="13" fill="#1d3a5c">전문지식을 넣는다는 건 <tspan font-weight="700">답을 알려주는 게 아니라, 헤맬 필요 없는 곳을 미리 지워주는 것</tspan>이다.</text>
</svg>
