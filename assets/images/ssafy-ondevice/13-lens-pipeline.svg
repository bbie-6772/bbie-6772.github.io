<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="300" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-size="17" font-weight="700" fill="#1d3a5c">Lens — 여러 설정으로 찍어보고, 모델이 제일 확신하는 장면을 고른다</text>

  <defs>
    <marker id="a8" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8fb0d4"/>
    </marker>
  </defs>

  <g>
    <rect x="32" y="70" width="146" height="112" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="105" y="96" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">1. 후보 고르기</text>
    <text x="105" y="124" font-size="11" fill="#6b7f95" text-anchor="middle">노출·감도·조리개</text>
    <text x="105" y="142" font-size="11" fill="#6b7f95" text-anchor="middle">조합이 너무 많아서</text>
    <text x="105" y="160" font-size="11" fill="#6b7f95" text-anchor="middle">K개만 추린다</text>

    <line x1="184" y1="126" x2="208" y2="126" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a8)"/>

    <rect x="216" y="70" width="146" height="112" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="289" y="96" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">2. 여러 장 찍기</text>
    <text x="289" y="124" font-size="11" fill="#6b7f95" text-anchor="middle">같은 장면을</text>
    <text x="289" y="142" font-size="11" fill="#6b7f95" text-anchor="middle">추린 설정마다</text>
    <text x="289" y="160" font-size="11" fill="#6b7f95" text-anchor="middle">한 장씩</text>

    <line x1="368" y1="126" x2="392" y2="126" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a8)"/>

    <rect x="400" y="70" width="146" height="112" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="473" y="96" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">3. 점수 매기기</text>
    <text x="473" y="124" font-size="11" fill="#6b7f95" text-anchor="middle">전부 모델에 넣고</text>
    <text x="473" y="142" font-size="11" fill="#6b7f95" text-anchor="middle">얼마나 확신하는지</text>
    <text x="473" y="160" font-size="11" fill="#6b7f95" text-anchor="middle">점수를 잰다</text>

    <line x1="552" y1="126" x2="576" y2="126" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a8)"/>

    <rect x="584" y="70" width="104" height="112" rx="10" fill="#e8f0f8" stroke="#3d6fa8" stroke-width="2"/>
    <text x="636" y="96" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">4. 한 장 선택</text>
    <text x="636" y="124" font-size="11" fill="#6b7f95" text-anchor="middle">점수 1등으로</text>
    <text x="636" y="142" font-size="11" fill="#6b7f95" text-anchor="middle">최종 추론</text>
  </g>

  <rect x="32" y="200" width="656" height="84" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="52" y="228" font-size="13" fill="#1d3a5c">모델의 가중치는 <tspan font-weight="700">한 글자도 바뀌지 않는다.</tspan> 바뀌는 건 카메라 설정뿐이다.</text>
  <text x="52" y="254" font-size="12" fill="#6b7f95">라벨도 역전파도 없다. 모델은 그냥 "이거 알아보겠어?" 라는 질문에 점수로만 답한다.</text>
  <text x="52" y="276" font-size="12" fill="#6b7f95">대신 한 번 추론할 때마다 여러 장을 찍고 여러 번 돌려야 한다. 그게 이 방식의 값이다.</text>
</svg>
