<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="400" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-size="17" font-weight="700" fill="#1d3a5c">배치 정규화를 없애는 게 아니라, 앞 계층 안으로 밀어 넣는다</text>

  <defs>
    <marker id="a4" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8fb0d4"/>
    </marker>
  </defs>

  <!-- before -->
  <rect x="32" y="62" width="292" height="272" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="178" y="88" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">폴딩 전 — 계층 4개</text>
  <g font-size="12" fill="#1d3a5c" text-anchor="middle">
    <rect x="76" y="102" width="204" height="34" rx="6" fill="#eef3f8" stroke="#d5dde6"/><text x="178" y="124">입력</text>
    <line x1="178" y1="140" x2="178" y2="152" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a4)"/>
    <rect x="76" y="156" width="204" height="34" rx="6" fill="#eef3f8" stroke="#d5dde6"/><text x="178" y="178">합성곱 (가중치 W)</text>
    <line x1="178" y1="194" x2="178" y2="206" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a4)"/>
    <rect x="76" y="210" width="204" height="34" rx="6" fill="#fbf2f2" stroke="#a04040"/><text x="178" y="232" fill="#a04040">배치 정규화 (실수 연산)</text>
    <line x1="178" y1="248" x2="178" y2="260" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a4)"/>
    <rect x="76" y="264" width="204" height="34" rx="6" fill="#eef3f8" stroke="#d5dde6"/><text x="178" y="286">편향 더하기 (b)</text>
  </g>
  <text x="178" y="320" font-size="11" fill="#6b7f95" text-anchor="middle">여기만 따로 양자화해야 한다</text>

  <text x="360" y="204" font-size="24" fill="#3d6fa8" text-anchor="middle">→</text>

  <!-- after -->
  <rect x="396" y="62" width="292" height="272" rx="10" fill="#ffffff" stroke="#3d6fa8" stroke-width="2"/>
  <text x="542" y="88" font-size="13" font-weight="700" fill="#3d6fa8" text-anchor="middle">폴딩 후 — 계층 3개</text>
  <g font-size="12" fill="#1d3a5c" text-anchor="middle">
    <rect x="440" y="102" width="204" height="34" rx="6" fill="#eef3f8" stroke="#d5dde6"/><text x="542" y="124">입력</text>
    <line x1="542" y1="140" x2="542" y2="152" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a4)"/>
    <rect x="440" y="156" width="204" height="52" rx="6" fill="#e8f0f8" stroke="#3d6fa8"/>
    <text x="542" y="178" font-weight="700">합성곱 (가중치 W')</text>
    <text x="542" y="197" font-size="11" fill="#6b7f95">W를 표준편차로 미리 나눠둠</text>
    <line x1="542" y1="212" x2="542" y2="224" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a4)"/>
    <rect x="440" y="228" width="204" height="52" rx="6" fill="#e8f0f8" stroke="#3d6fa8"/>
    <text x="542" y="250" font-weight="700">편향 더하기 (b')</text>
    <text x="542" y="269" font-size="11" fill="#6b7f95">평균 보정까지 미리 반영</text>
  </g>
  <text x="542" y="308" font-size="11" fill="#6b7f95" text-anchor="middle">양자화할 계층이 하나 줄었다</text>

  <text x="32" y="366" font-size="13" fill="#1d3a5c">배치 정규화는 <tspan font-weight="700">추론할 때 그냥 상수 곱하기와 상수 더하기</tspan>다. 합성곱도 마찬가지라, 미리 합쳐둘 수 있다.</text>
  <text x="32" y="388" font-size="12" fill="#6b7f95">학습이 끝난 뒤에만 가능한 계산이다. 학습 중에는 평균과 표준편차가 배치마다 바뀌니까.</text>
</svg>
