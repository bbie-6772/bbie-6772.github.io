<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="360" rx="12" fill="#f7f9fb"/>
  <text x="32" y="42" font-size="17" font-weight="700" fill="#1d3a5c">한 번 하는 데 드는 전기 (45nm 공정 기준)</text>
  <text x="32" y="64" font-size="12" fill="#6b7f95">가로 눈금은 로그 — 칸 하나가 10배다. 단위는 pJ(피코줄)</text>

  <rect x="32" y="82" width="656" height="200" rx="10" fill="#ffffff" stroke="#d5dde6"/>

  <!-- rows: x from 190 to 660, log scale 0.01 -> 1000 : width = (log10(v)-(-2))/5*470 -->
  <g font-size="12" fill="#1d3a5c">
    <text x="176" y="112" text-anchor="end">정수 덧셈 (8비트)</text>
    <rect x="190" y="102" width="66" height="14" rx="3" fill="#8fb0d4"/>
    <text x="264" y="113" font-size="11" fill="#6b7f95">0.03</text>

    <text x="176" y="142" text-anchor="end">정수 덧셈 (32비트)</text>
    <rect x="190" y="132" width="94" height="14" rx="3" fill="#8fb0d4"/>
    <text x="292" y="143" font-size="11" fill="#6b7f95">0.1</text>

    <text x="176" y="172" text-anchor="end">실수 덧셈 (32비트)</text>
    <rect x="190" y="162" width="184" height="14" rx="3" fill="#3d6fa8"/>
    <text x="382" y="173" font-size="11" fill="#6b7f95">0.9</text>

    <text x="176" y="202" text-anchor="end">실수 곱셈 (32비트)</text>
    <rect x="190" y="192" width="243" height="14" rx="3" fill="#3d6fa8"/>
    <text x="441" y="203" font-size="11" fill="#6b7f95">3.7</text>

    <text x="176" y="232" text-anchor="end">칩 안 메모리 읽기</text>
    <rect x="190" y="222" width="256" height="14" rx="3" fill="#c08a8a"/>
    <text x="454" y="233" font-size="11" fill="#6b7f95">5</text>

    <text x="176" y="262" text-anchor="end">칩 밖 메모리 읽기</text>
    <rect x="190" y="252" width="450" height="14" rx="3" fill="#a04040"/>
    <text x="600" y="263" font-size="11" fill="#ffffff" font-weight="700">640</text>
  </g>

  <rect x="32" y="298" width="656" height="42" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="48" y="325" font-size="13" fill="#1d3a5c">칩 밖에서 숫자 하나 <tspan font-weight="700">가져오는</tspan> 값이면, 8비트 덧셈을 <tspan font-weight="700" fill="#a04040">2만 번</tspan> 할 수 있다.</text>
</svg>
