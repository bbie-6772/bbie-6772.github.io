<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-size="17" font-weight="700" fill="#1d3a5c">모델은 그대로인데, 들어오는 데이터가 옆으로 밀렸다</text>

  <rect x="32" y="60" width="656" height="200" rx="10" fill="#ffffff" stroke="#d5dde6"/>

  <!-- axis -->
  <line x1="72" y1="220" x2="648" y2="220" stroke="#d5dde6" stroke-width="1.5"/>
  <text x="72" y="240" font-size="11" fill="#6b7f95">데이터의 통계 (밝기, 노이즈, 화질 …)</text>

  <!-- train curve -->
  <path d="M 110 220 C 160 220 170 100 220 100 C 270 100 280 220 330 220" fill="#dce7f3" stroke="#3d6fa8" stroke-width="2"/>
  <text x="220" y="88" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">학습 때 본 분포</text>
  <text x="220" y="170" font-size="11" fill="#3d6fa8" text-anchor="middle">깨끗한 사진</text>

  <!-- test curve -->
  <path d="M 390 220 C 440 220 450 118 500 118 C 550 118 560 220 610 220" fill="#f5e6e6" stroke="#a04040" stroke-width="2"/>
  <text x="500" y="106" font-size="12" font-weight="700" fill="#a04040" text-anchor="middle">실제로 들어온 분포</text>
  <text x="500" y="178" font-size="11" fill="#a04040" text-anchor="middle">흐리고 어두운 사진</text>

  <!-- gap -->
  <line x1="220" y1="248" x2="500" y2="248" stroke="#6b7f95" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="360" y="243" font-size="11" fill="#6b7f95" text-anchor="middle">이만큼 어긋났다</text>

  <rect x="32" y="276" width="320" height="48" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="52" y="298" font-size="12" fill="#6b7f95">학습 때 검증 정확도</text>
  <text x="330" y="300" font-size="18" font-weight="700" fill="#3d6fa8" text-anchor="end">97%</text>

  <rect x="368" y="276" width="320" height="48" rx="8" fill="#ffffff" stroke="#a04040"/>
  <text x="388" y="298" font-size="12" fill="#6b7f95">현장에 내놨을 때</text>
  <text x="666" y="300" font-size="18" font-weight="700" fill="#a04040" text-anchor="end">68%</text>
</svg>
