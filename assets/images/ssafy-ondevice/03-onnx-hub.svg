<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="380" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-size="17" font-weight="700" fill="#1d3a5c">변환기를 3×4개 만들 것인가, 3+4개 만들 것인가</text>

  <!-- left panel -->
  <rect x="24" y="58" width="316" height="266" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="182" y="82" font-size="13" font-weight="700" fill="#a04040" text-anchor="middle">직접 잇기 — 12개</text>

  <g stroke="#e0c4c4" stroke-width="1">
    <line x1="112" y1="120" x2="256" y2="120"/><line x1="112" y1="120" x2="256" y2="170"/><line x1="112" y1="120" x2="256" y2="220"/><line x1="112" y1="120" x2="256" y2="270"/>
    <line x1="112" y1="180" x2="256" y2="120"/><line x1="112" y1="180" x2="256" y2="170"/><line x1="112" y1="180" x2="256" y2="220"/><line x1="112" y1="180" x2="256" y2="270"/>
    <line x1="112" y1="240" x2="256" y2="120"/><line x1="112" y1="240" x2="256" y2="170"/><line x1="112" y1="240" x2="256" y2="220"/><line x1="112" y1="240" x2="256" y2="270"/>
  </g>
  <g font-size="11" fill="#1d3a5c">
    <circle cx="112" cy="120" r="5" fill="#3d6fa8"/><text x="100" y="124" text-anchor="end">PyTorch</text>
    <circle cx="112" cy="180" r="5" fill="#3d6fa8"/><text x="100" y="184" text-anchor="end">TensorFlow</text>
    <circle cx="112" cy="240" r="5" fill="#3d6fa8"/><text x="100" y="244" text-anchor="end">JAX</text>
    <circle cx="256" cy="120" r="5" fill="#8fb0d4"/><text x="268" y="124">TensorRT</text>
    <circle cx="256" cy="170" r="5" fill="#8fb0d4"/><text x="268" y="174">Core ML</text>
    <circle cx="256" cy="220" r="5" fill="#8fb0d4"/><text x="268" y="224">LiteRT</text>
    <circle cx="256" cy="270" r="5" fill="#8fb0d4"/><text x="268" y="274">OpenVINO</text>
  </g>
  <text x="182" y="308" font-size="11" fill="#6b7f95" text-anchor="middle">런타임 하나 늘 때마다 변환기 3개 추가</text>

  <!-- right panel -->
  <rect x="380" y="58" width="316" height="266" rx="10" fill="#ffffff" stroke="#3d6fa8" stroke-width="2"/>
  <text x="538" y="82" font-size="13" font-weight="700" fill="#3d6fa8" text-anchor="middle">가운데를 두기 — 7개</text>

  <g stroke="#8fb0d4" stroke-width="1.4">
    <line x1="452" y1="120" x2="524" y2="195"/><line x1="452" y1="180" x2="524" y2="195"/><line x1="452" y1="240" x2="524" y2="195"/>
    <line x1="552" y1="195" x2="624" y2="120"/><line x1="552" y1="195" x2="624" y2="170"/><line x1="552" y1="195" x2="624" y2="220"/><line x1="552" y1="195" x2="624" y2="270"/>
  </g>
  <rect x="504" y="176" width="68" height="38" rx="8" fill="#3d6fa8"/>
  <text x="538" y="200" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ONNX</text>

  <g font-size="11" fill="#1d3a5c">
    <circle cx="452" cy="120" r="5" fill="#3d6fa8"/><text x="440" y="124" text-anchor="end">PyTorch</text>
    <circle cx="452" cy="180" r="5" fill="#3d6fa8"/><text x="440" y="184" text-anchor="end">TensorFlow</text>
    <circle cx="452" cy="240" r="5" fill="#3d6fa8"/><text x="440" y="244" text-anchor="end">JAX</text>
    <circle cx="624" cy="120" r="5" fill="#8fb0d4"/><text x="636" y="124">TensorRT</text>
    <circle cx="624" cy="170" r="5" fill="#8fb0d4"/><text x="636" y="174">Core ML</text>
    <circle cx="624" cy="220" r="5" fill="#8fb0d4"/><text x="636" y="224">LiteRT</text>
    <circle cx="624" cy="270" r="5" fill="#8fb0d4"/><text x="636" y="274">OpenVINO</text>
  </g>
  <text x="538" y="308" font-size="11" fill="#6b7f95" text-anchor="middle">런타임 하나 늘어도 변환기 1개 추가</text>

  <text x="32" y="352" font-size="12" fill="#6b7f95">다만 가운데 규격이 모르는 연산이 모델에 하나라도 있으면, 그 지점에서 변환이 멈춘다.</text>
</svg>
