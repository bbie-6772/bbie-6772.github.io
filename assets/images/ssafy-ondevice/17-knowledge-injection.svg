<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <text x="32" y="40" font-size="17" font-weight="700" fill="#1d3a5c">전문가가 실제로 하는 행동이, 그대로 설계 결정이 됐다</text>

  <defs>
    <marker id="a9" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8fb0d4"/>
    </marker>
  </defs>

  <text x="176" y="76" font-size="12" font-weight="700" fill="#6b7f95" text-anchor="middle">수면기사가 하는 일</text>
  <text x="546" y="76" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">그래서 모델을 이렇게 만들었다</text>

  <g>
    <rect x="32" y="88" width="288" height="66" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="176" y="114" font-size="12" fill="#1d3a5c" text-anchor="middle">파형을 화면에 띄워놓고</text>
    <text x="176" y="136" font-size="12" font-weight="700" fill="#1d3a5c" text-anchor="middle">눈으로 보고 판단한다</text>
    <line x1="330" y1="121" x2="392" y2="121" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="402" y="88" width="286" height="66" rx="10" fill="#e8f0f8" stroke="#3d6fa8"/>
    <text x="545" y="114" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">시계열이 아니라 이미지 문제로 푼다</text>
    <text x="545" y="136" font-size="11" fill="#6b7f95" text-anchor="middle">30초 화면을 그대로 캡처해 입력으로 쓴다</text>

    <rect x="32" y="164" width="288" height="66" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="176" y="190" font-size="12" fill="#1d3a5c" text-anchor="middle">신호 종류마다 보는 법이 다르다</text>
    <text x="176" y="212" font-size="12" font-weight="700" fill="#1d3a5c" text-anchor="middle">뇌파와 근전도를 같이 놓고 본다</text>
    <line x1="330" y1="197" x2="392" y2="197" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="402" y="164" width="286" height="66" rx="10" fill="#e8f0f8" stroke="#3d6fa8"/>
    <text x="545" y="190" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">CNN 대신 비전 트랜스포머</text>
    <text x="545" y="212" font-size="11" fill="#6b7f95" text-anchor="middle">멀리 떨어진 신호끼리도 관계를 본다</text>

    <rect x="32" y="240" width="288" height="66" rx="10" fill="#ffffff" stroke="#d5dde6"/>
    <text x="176" y="266" font-size="12" fill="#1d3a5c" text-anchor="middle">한 칸만 보고 정하지 않는다</text>
    <text x="176" y="288" font-size="12" font-weight="700" fill="#1d3a5c" text-anchor="middle">앞뒤 30초도 같이 본다</text>
    <line x1="330" y1="273" x2="392" y2="273" stroke="#8fb0d4" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="402" y="240" width="286" height="66" rx="10" fill="#e8f0f8" stroke="#3d6fa8"/>
    <text x="545" y="266" font-size="12" font-weight="700" fill="#3d6fa8" text-anchor="middle">에폭끼리 한 번 더 어텐션</text>
    <text x="545" y="288" font-size="11" fill="#6b7f95" text-anchor="middle">앞뒤 맥락으로 결과를 보정한다</text>
  </g>

  <text x="32" y="330" font-size="12" fill="#6b7f95">셋 다 성능을 올리려고 고른 구조가 아니라, <tspan font-weight="700" fill="#1d3a5c">사람이 하던 방식을 옮긴 결과</tspan>다.</text>
</svg>
