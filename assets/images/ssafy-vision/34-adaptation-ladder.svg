<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d3a5c">적응 방법의 사다리 — 위로 갈수록 세지고, 비싸진다</text>

  <rect x="24" y="252" width="500" height="52" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="274" font-size="12" font-weight="700" fill="#1d3a5c">1. 프롬프트 디자인</text>
  <text x="40" y="294" font-size="11" fill="#6b7f95">입력 문장만 손본다. 학습 0회, 사람이 직접 설계, 향상 폭은 제한적</text>

  <rect x="24" y="188" width="500" height="52" rx="8" fill="#ffffff" stroke="#8fb0d4"/>
  <text x="40" y="210" font-size="12" font-weight="700" fill="#1d3a5c">2. 프롬프트 튜닝</text>
  <text x="40" y="230" font-size="11" fill="#6b7f95">가상 토큰의 임베딩만 학습. 모델은 통째로 동결 — 지식 손실이 없다</text>

  <rect x="24" y="124" width="500" height="52" rx="8" fill="#ffffff" stroke="#3d6fa8"/>
  <text x="40" y="146" font-size="12" font-weight="700" fill="#1d3a5c">3. 어댑터 모듈 추가</text>
  <text x="40" y="166" font-size="11" fill="#6b7f95">레이어마다 작은 모듈을 끼우고 그 모듈만 학습. 원본 가중치는 그대로</text>

  <rect x="24" y="60" width="500" height="52" rx="8" fill="#ffffff" stroke="#a04040" stroke-width="1.6"/>
  <text x="40" y="82" font-size="12" font-weight="700" fill="#a04040">4. 전체 파인튜닝</text>
  <text x="40" y="102" font-size="11" fill="#6b7f95">모델 가중치를 다 바꾼다. 가장 강력하지만 자원과 지식 손실 위험이 크다</text>

  <rect x="548" y="60" width="148" height="244" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="564" y="84" font-size="12" font-weight="700" fill="#1d3a5c">고르는 기준</text>
  <text x="564" y="110" font-size="11" fill="#6b7f95">데이터가 적다</text>
  <text x="564" y="128" font-size="11" fill="#1d3a5c">→ 아래쪽부터</text>
  <text x="564" y="156" font-size="11" fill="#6b7f95">GPU가 부족하다</text>
  <text x="564" y="174" font-size="11" fill="#1d3a5c">→ 2~3번</text>
  <text x="564" y="202" font-size="11" fill="#6b7f95">도메인이 많이 다르다</text>
  <text x="564" y="220" font-size="11" fill="#1d3a5c">→ 위쪽으로</text>
  <text x="564" y="252" font-size="11" font-weight="700" fill="#3d6fa8">2~3번을 묶어</text>
  <text x="564" y="270" font-size="11" font-weight="700" fill="#3d6fa8">PEFT라 부른다</text>
  <text x="564" y="292" font-size="10" fill="#6b7f95">파라미터 효율적 미세조정</text>

  <path d="M534 292 V72" stroke="#8fb0d4" stroke-width="1.6" fill="none" marker-end="url(#arU)"/>
  <defs>
    <marker id="arU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0d4"/></marker>
  </defs>
</svg>
