<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="400" rx="12" fill="#f7f9fb"/><text x="360" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">곡선 읽는 법 — 그래프 모양이 곧 처방전</text>

<g>
<rect x="36" y="58" width="156" height="150" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.3"/>
<line x1="56" y1="160" x2="176" y2="160" stroke="#40556b" stroke-width="1"/>
<line x1="56" y1="80" x2="56" y2="160" stroke="#40556b" stroke-width="1"/>
<path d="M58 94 L104 94 C120 94 128 148 172 150" fill="none" stroke="#3d6fa8" stroke-width="2.4"/>
<text x="114" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a04040">초반에 평평하다</text>
<text x="114" y="200" text-anchor="middle" font-size="11" fill="#40556b">→ 초기값 문제</text>
</g>

<g>
<rect x="200" y="58" width="156" height="150" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.3"/>
<line x1="220" y1="160" x2="340" y2="160" stroke="#40556b" stroke-width="1"/>
<line x1="220" y1="80" x2="220" y2="160" stroke="#40556b" stroke-width="1"/>
<path d="M222 84 C250 128 268 140 336 142" fill="none" stroke="#3d6fa8" stroke-width="2.4"/>
<text x="278" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a04040">떨어지다 멈췄다</text>
<text x="278" y="200" text-anchor="middle" font-size="11" fill="#40556b">→ 학습률을 줄여보자</text>
</g>

<g>
<rect x="364" y="58" width="156" height="150" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.3"/>
<line x1="384" y1="160" x2="504" y2="160" stroke="#40556b" stroke-width="1"/>
<line x1="384" y1="80" x2="384" y2="160" stroke="#40556b" stroke-width="1"/>
<path d="M386 84 C404 122 416 132 434 134 L436 140 C470 142 480 143 500 143" fill="none" stroke="#3d6fa8" stroke-width="2.4"/>
<path d="M436 124 V138" stroke="#a04040" stroke-width="1.4" marker-end="url(#m)"/>
<text x="442" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a04040">줄였더니 멈췄다</text>
<text x="442" y="200" text-anchor="middle" font-size="11" fill="#40556b">→ 너무 일찍 줄인 것</text>
</g>

<g>
<rect x="528" y="58" width="156" height="150" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.3"/>
<line x1="548" y1="160" x2="668" y2="160" stroke="#40556b" stroke-width="1"/>
<line x1="548" y1="80" x2="548" y2="160" stroke="#40556b" stroke-width="1"/>
<path d="M550 152 C580 110 600 100 664 92" fill="none" stroke="#3d6fa8" stroke-width="2.4"/>
<path d="M550 154 C580 122 600 116 664 118" fill="none" stroke="#c2703c" stroke-width="2.4"/>
<text x="606" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4f8f68">둘 다 오른다</text>
<text x="606" y="200" text-anchor="middle" font-size="11" fill="#40556b">→ 계속 학습할 것</text>
</g>

<g>
<rect x="36" y="226" width="316" height="150" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.3"/>
<text x="194" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a04040">학습·검증 정확도가 크게 벌어짐</text>
<line x1="70" y1="352" x2="320" y2="352" stroke="#40556b" stroke-width="1"/>
<line x1="70" y1="266" x2="70" y2="352" stroke="#40556b" stroke-width="1"/>
<path d="M72 344 C110 292 160 282 316 272" fill="none" stroke="#3d6fa8" stroke-width="2.4"/>
<path d="M72 346 C110 312 150 306 316 322" fill="none" stroke="#c2703c" stroke-width="2.4"/>
<text x="252" y="266" font-size="10.5" fill="#3d6fa8">학습</text>
<text x="252" y="340" font-size="10.5" fill="#c2703c">검증</text>
<text x="194" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a04040">과적합 → 정규화·증강·조기 종료</text>
</g>

<g>
<rect x="368" y="226" width="316" height="150" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.3"/>
<text x="526" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2703c">둘의 차이가 거의 없음</text>
<line x1="402" y1="352" x2="652" y2="352" stroke="#40556b" stroke-width="1"/>
<line x1="402" y1="266" x2="402" y2="352" stroke="#40556b" stroke-width="1"/>
<path d="M404 344 C440 312 480 306 648 300" fill="none" stroke="#3d6fa8" stroke-width="2.4"/>
<path d="M404 346 C440 316 480 310 648 304" fill="none" stroke="#c2703c" stroke-width="2.4"/>
<text x="526" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2703c">모델 힘이 약함 → 더 크게, 더 오래</text>
</g>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#a04040"/></marker></defs>
</svg>
