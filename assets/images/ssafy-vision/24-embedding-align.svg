<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="360" rx="12" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d3a5c">임베딩 공간 정합 — 두 인코더의 출력을 같은 지도 위에 올린다</text>

  <rect x="24" y="56" width="200" height="120" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="80" font-size="12" font-weight="700" fill="#1d3a5c">이미지 인코더 (ViT)</text>
  <text x="40" y="102" font-size="11" fill="#6b7f95">강아지 사진</text>
  <rect x="40" y="114" width="168" height="26" rx="6" fill="#dfe9f4" stroke="#8fb0d4"/>
  <text x="52" y="131" font-size="11" fill="#1d3a5c">512차원 벡터</text>
  <text x="40" y="160" font-size="11" fill="#6b7f95">픽셀 → 숫자 512개</text>

  <rect x="24" y="196" width="200" height="120" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="220" font-size="12" font-weight="700" fill="#1d3a5c">텍스트 인코더 (Transformer)</text>
  <text x="40" y="242" font-size="11" fill="#6b7f95">강아지 사진이라는 문장</text>
  <rect x="40" y="254" width="168" height="26" rx="6" fill="#dfe9f4" stroke="#8fb0d4"/>
  <text x="52" y="271" font-size="11" fill="#1d3a5c">512차원 벡터</text>
  <text x="40" y="300" font-size="11" fill="#6b7f95">토큰 → 숫자 512개</text>

  <g stroke="#3d6fa8" stroke-width="1.8" fill="none" marker-end="url(#ar3)">
    <path d="M224 127 C270 127 262 150 300 168"/>
    <path d="M224 267 C270 267 262 220 300 196"/>
  </g>

  <rect x="316" y="56" width="380" height="260" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="332" y="80" font-size="13" font-weight="700" fill="#3d6fa8">공용 임베딩 공간 (같은 좌표계)</text>
  <circle cx="520" cy="190" r="100" fill="#eef3f8" stroke="#8fb0d4" stroke-dasharray="4 4"/>

  <circle cx="486" cy="158" r="6" fill="#3d6fa8"/>
  <text x="400" y="150" font-size="11" fill="#1d3a5c">강아지 사진</text>
  <circle cx="508" cy="174" r="6" fill="#a04040"/>
  <text x="520" y="170" font-size="11" fill="#1d3a5c">강아지 문장</text>
  <line x1="486" y1="158" x2="508" y2="174" stroke="#a04040" stroke-width="1.6"/>
  <text x="424" y="196" font-size="11" font-weight="700" fill="#a04040">가깝다 (0.9)</text>

  <circle cx="580" cy="248" r="6" fill="#3d6fa8"/>
  <text x="560" y="272" font-size="11" fill="#1d3a5c">자전거 사진</text>
  <circle cx="566" cy="120" r="6" fill="#a04040"/>
  <text x="576" y="116" font-size="11" fill="#1d3a5c">자전거 문장</text>
  <line x1="486" y1="158" x2="580" y2="248" stroke="#6b7f95" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="496" y="218" font-size="11" fill="#6b7f95">멀다 (0.1)</text>

  <text x="332" y="302" font-size="11" fill="#6b7f95">정합 = 뜻이 같으면 가깝게, 다르면 멀게 좌표를 맞춰 놓는 것</text>

  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker>
  </defs>
</svg>
