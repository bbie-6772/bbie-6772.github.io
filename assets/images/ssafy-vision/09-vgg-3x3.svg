<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="360" rx="12" fill="#f7f9fb"/><text x="360" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">3×3 두 번 = 5×5 한 번, 그런데 값은 더 싸다</text>

<text x="170" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#a04040">방법 1 — 5×5 한 층</text>
<rect x="90" y="92" width="160" height="100" rx="8" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/>
<text x="170" y="130" text-anchor="middle" font-size="13" fill="#1d3a5c">Conv 5×5</text>
<text x="170" y="156" text-anchor="middle" font-size="12" fill="#40556b">C → C</text>
<text x="170" y="178" text-anchor="middle" font-size="11.5" fill="#a04040">비선형 1번</text>
<text x="170" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#a04040">파라미터 25C²</text>
<text x="170" y="244" text-anchor="middle" font-size="12.5" fill="#40556b">FLOPs 25C²HW</text>

<text x="360" y="150" text-anchor="middle" font-size="18" fill="#40556b">vs</text>

<text x="550" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#4f8f68">방법 2 — 3×3 두 층</text>
<rect x="470" y="92" width="160" height="44" rx="8" fill="#eef4ee" stroke="#4f8f68" stroke-width="2"/>
<text x="550" y="119" text-anchor="middle" font-size="12.5" fill="#1d3a5c">Conv 3×3 + ReLU</text>
<rect x="470" y="146" width="160" height="44" rx="8" fill="#eef4ee" stroke="#4f8f68" stroke-width="2"/>
<text x="550" y="173" text-anchor="middle" font-size="12.5" fill="#1d3a5c">Conv 3×3 + ReLU</text>
<text x="550" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">파라미터 18C²</text>
<text x="550" y="244" text-anchor="middle" font-size="12.5" fill="#40556b">FLOPs 18C²HW</text>

<rect x="60" y="268" width="600" height="76" rx="10" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.3"/>
<text x="80" y="294" font-size="12.5" fill="#40556b">수용영역은 <tspan font-weight="700" fill="#1d3a5c">둘 다 5×5</tspan>. 그런데 3×3 두 층은 파라미터가 <tspan font-weight="700" fill="#4f8f68">28% 적고</tspan>, 비선형은 <tspan font-weight="700" fill="#4f8f68">두 번</tspan> 들어간다.</text>
<text x="80" y="322" font-size="12.5" fill="#1d3a5c">그래서 VGG의 결론 — <tspan font-weight="700">작고 단순한 필터를 깊게 쌓아라.</tspan> 이게 하나의 설계 철학이 됐다.</text>
</svg>
