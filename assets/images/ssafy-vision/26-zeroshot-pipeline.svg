<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="330" rx="12" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d3a5c">제로샷 분류 — 분류기를 학습하지 않고 문장으로 만든다</text>

  <rect x="24" y="56" width="180" height="120" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="80" font-size="12" font-weight="700" fill="#1d3a5c">1. 후보 이름을 문장으로</text>
  <g font-size="11" fill="#6b7f95">
    <text x="40" y="104">a photo of a dog</text>
    <text x="40" y="124">a photo of a cat</text>
    <text x="40" y="144">a photo of a plane</text>
    <text x="40" y="166">필요하면 얼마든지 추가</text>
  </g>

  <rect x="236" y="56" width="150" height="120" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="252" y="80" font-size="12" font-weight="700" fill="#1d3a5c">2. 텍스트 인코더</text>
  <rect x="252" y="96" width="118" height="30" rx="6" fill="#dfe9f4" stroke="#8fb0d4"/>
  <text x="264" y="115" font-size="11" fill="#1d3a5c">문장 → 벡터</text>
  <text x="252" y="146" font-size="11" fill="#6b7f95">한 번 만들어 두고</text>
  <text x="252" y="166" font-size="11" fill="#6b7f95">Vector DB에 재사용</text>

  <rect x="24" y="196" width="180" height="110" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="220" font-size="12" font-weight="700" fill="#1d3a5c">3. 분류할 사진 한 장</text>
  <rect x="40" y="236" width="148" height="30" rx="6" fill="#eef3f8" stroke="#d5dde6"/>
  <text x="52" y="255" font-size="11" fill="#6b7f95">쿼리 이미지</text>
  <text x="40" y="290" font-size="11" fill="#6b7f95">이미지 인코더 → 벡터</text>

  <rect x="418" y="56" width="278" height="250" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="434" y="80" font-size="12" font-weight="700" fill="#3d6fa8">4. 유사도 비교 후 최고점 선택</text>
  <g font-size="11" fill="#1d3a5c">
    <text x="434" y="117">dog</text>
    <rect x="490" y="104" width="140" height="16" rx="4" fill="#eef3f8" stroke="#d5dde6"/>
    <rect x="490" y="104" width="123" height="16" rx="4" fill="#3d6fa8"/>
    <text x="640" y="117">0.88</text>
    <text x="434" y="151">cat</text>
    <rect x="490" y="138" width="140" height="16" rx="4" fill="#eef3f8" stroke="#d5dde6"/>
    <rect x="490" y="138" width="28" height="16" rx="4" fill="#8fb0d4"/>
    <text x="640" y="151">0.20</text>
    <text x="434" y="185">plane</text>
    <rect x="490" y="172" width="140" height="16" rx="4" fill="#eef3f8" stroke="#d5dde6"/>
    <rect x="490" y="172" width="13" height="16" rx="4" fill="#8fb0d4"/>
    <text x="640" y="185">0.09</text>
  </g>
  <text x="434" y="222" font-size="12" font-weight="700" fill="#a04040">학습 0회. 후보 목록만 바꾸면 다른 분류기</text>
  <text x="434" y="248" font-size="11" fill="#6b7f95">검색과 구조가 같다 — 질의 벡터와 후보 벡터의 거리 비교</text>
  <text x="434" y="268" font-size="11" fill="#6b7f95">후보가 수만 개면 근사 최근접 탐색으로 넘긴다</text>
  <text x="434" y="292" font-size="11" fill="#6b7f95">문장을 바꾸면 정확도가 흔들린다 (프롬프트에 민감)</text>

  <g stroke="#3d6fa8" stroke-width="1.6" fill="none" marker-end="url(#ar4)">
    <path d="M204 116 H232"/>
    <path d="M386 116 C400 116 402 130 414 130"/>
    <path d="M204 251 C300 251 320 172 414 154"/>
  </g>
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker>
  </defs>
</svg>
