<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><text x="360" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">필터 개수 = 만들어지는 특징 맵의 장수</text>

<rect x="50" y="110" width="96" height="96" rx="5" fill="#e8eef6" stroke="#3d6fa8" stroke-width="2"/>
<text x="98" y="224" text-anchor="middle" font-size="12" fill="#40556b">입력 3×32×32</text>

<path d="M158 158 L206 158" stroke="#40556b" stroke-width="1.6" marker-end="url(#c)"/>

<g>
<rect x="212" y="120" width="20" height="76" rx="3" fill="#f6ece5" stroke="#c2703c" stroke-width="1.6"/>
<rect x="238" y="120" width="20" height="76" rx="3" fill="#f6ece5" stroke="#c2703c" stroke-width="1.6"/>
<rect x="264" y="120" width="20" height="76" rx="3" fill="#f6ece5" stroke="#c2703c" stroke-width="1.6"/>
<rect x="290" y="120" width="20" height="76" rx="3" fill="#f6ece5" stroke="#c2703c" stroke-width="1.6"/>
<rect x="316" y="120" width="20" height="76" rx="3" fill="#f6ece5" stroke="#c2703c" stroke-width="1.6"/>
<rect x="342" y="120" width="20" height="76" rx="3" fill="#f6ece5" stroke="#c2703c" stroke-width="1.6"/>
</g>
<text x="287" y="216" text-anchor="middle" font-size="12" fill="#a04040">필터 6개 (각 3×5×5)</text>
<text x="287" y="238" text-anchor="middle" font-size="11.5" fill="#40556b">필터의 깊이는 입력 채널과 항상 같다</text>

<path d="M374 158 L422 158" stroke="#40556b" stroke-width="1.6" marker-end="url(#c)"/>

<g>
<rect x="430" y="108" width="86" height="86" rx="5" fill="#eef4ee" stroke="#4f8f68" stroke-width="1.6"/>
<rect x="442" y="118" width="86" height="86" rx="5" fill="#eef4ee" stroke="#4f8f68" stroke-width="1.6"/>
<rect x="454" y="128" width="86" height="86" rx="5" fill="#eef4ee" stroke="#4f8f68" stroke-width="1.6"/>
<rect x="466" y="138" width="86" height="86" rx="5" fill="#eef4ee" stroke="#4f8f68" stroke-width="1.6"/>
<rect x="478" y="148" width="86" height="86" rx="5" fill="#eef4ee" stroke="#4f8f68" stroke-width="1.6"/>
<rect x="490" y="158" width="86" height="86" rx="5" fill="#eef4ee" stroke="#4f8f68" stroke-width="2"/>
</g>
<text x="546" y="264" text-anchor="middle" font-size="12" fill="#4f8f68">출력 6×28×28</text>

<text x="60" y="300" font-size="12.5" fill="#1d3a5c">필터 하나 = 관심사 하나. 어떤 건 세로선을, 어떤 건 색 경계를 찾는다.</text>
<text x="60" y="322" font-size="12.5" fill="#40556b">6명이 같은 사진을 각자 다른 눈으로 보고 6장의 메모를 남기는 셈이다.</text>
<defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#40556b"/></marker></defs>
</svg>
