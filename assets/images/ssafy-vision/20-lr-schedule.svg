<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="380" rx="12" fill="#f7f9fb"/><text x="360" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">학습률 — 가장 중요한 하이퍼파라미터</text>

<text x="200" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40556b">학습률에 따른 손실 곡선</text>
<line x1="70" y1="240" x2="340" y2="240" stroke="#40556b" stroke-width="1.2"/>
<line x1="70" y1="86" x2="70" y2="240" stroke="#40556b" stroke-width="1.2"/>
<text x="50" y="92" font-size="10.5" fill="#40556b">손실</text>
<text x="320" y="258" font-size="10.5" fill="#40556b">epoch</text>

<path d="M74 108 C110 92 150 88 336 90" fill="none" stroke="#e0a030" stroke-width="2.4"/>
<text x="240" y="84" font-size="11" fill="#c2703c">너무 큼 — 발산</text>

<path d="M74 108 C140 150 220 190 336 214" fill="none" stroke="#3d6fa8" stroke-width="2.4"/>
<text x="250" y="212" font-size="11" fill="#3d6fa8">너무 작음 — 느림</text>

<path d="M74 108 C100 160 130 176 336 182" fill="none" stroke="#4f8f68" stroke-width="2.4"/>
<text x="200" y="172" font-size="11" fill="#4f8f68">약간 큼 — 일찍 정체</text>

<path d="M74 108 C96 190 140 228 336 234" fill="none" stroke="#a04040" stroke-width="2.6"/>
<text x="150" y="232" font-size="11" font-weight="700" fill="#a04040">적절</text>

<text x="530" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40556b">줄여가는 방식</text>
<line x1="400" y1="240" x2="670" y2="240" stroke="#40556b" stroke-width="1.2"/>
<line x1="400" y1="86" x2="400" y2="240" stroke="#40556b" stroke-width="1.2"/>
<text x="378" y="92" font-size="10.5" fill="#40556b">lr</text>

<path d="M404 100 H480 V160 H556 V200 H666 V222" fill="none" stroke="#c2703c" stroke-width="2.2"/>
<text x="600" y="120" font-size="11" fill="#c2703c">계단식</text>

<path d="M404 100 C480 104 540 180 666 232" fill="none" stroke="#4f8f68" stroke-width="2.2"/>
<text x="470" y="196" font-size="11" fill="#4f8f68">코사인</text>

<path d="M404 100 L666 232" fill="none" stroke="#3d6fa8" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="530" y="150" font-size="11" fill="#3d6fa8">선형</text>

<rect x="60" y="278" width="600" height="88" rx="10" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.3"/>
<text x="80" y="304" font-size="12.5" fill="#40556b">기본 전략 — <tspan font-weight="700" fill="#1d3a5c">처음엔 크게 배우고, 갈수록 작게 조율한다</tspan></text>
<text x="80" y="328" font-size="12.5" fill="#40556b">계단식은 변경 지점을 여러 개 정해야 해서 곡선이 불안정할 수 있고, 코사인·선형은 그 손이 덜 간다</text>
<text x="80" y="352" font-size="12.5" fill="#a04040">정체가 오기 전에 너무 일찍 줄이면 학습이 그 자리에서 멈춘다 — 곡선을 보고 판단할 것</text>
</svg>
