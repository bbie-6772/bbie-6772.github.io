<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="330" rx="12" fill="#f7f9fb"/><text x="360" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">패딩 — 가장자리에 0을 둘러 크기를 지킨다</text>

<text x="90" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a04040">패딩 없음</text>
<rect x="40" y="92" width="140" height="140" rx="4" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.6"/>
<rect x="62" y="114" width="96" height="96" rx="3" fill="#eef4ee" stroke="#4f8f68" stroke-width="2"/>
<text x="110" y="166" text-anchor="middle" font-size="12" fill="#4f8f68">출력</text>
<text x="110" y="254" text-anchor="middle" font-size="12.5" fill="#a04040">32 → 28 로 줄어듦</text>
<text x="110" y="276" text-anchor="middle" font-size="12" fill="#40556b">층을 쌓을수록 계속 작아진다</text>

<text x="360" y="166" text-anchor="middle" font-size="20" fill="#40556b">vs</text>

<text x="560" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f8f68">패딩 있음 (0으로 테두리)</text>
<rect x="490" y="92" width="140" height="140" rx="4" fill="#f2f5f9" stroke="#c2703c" stroke-width="1.6" stroke-dasharray="5 3"/>
<rect x="504" y="106" width="112" height="112" rx="3" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.6"/>
<rect x="504" y="106" width="112" height="112" rx="3" fill="#4f8f68" opacity="0.15"/>
<text x="560" y="166" text-anchor="middle" font-size="12" fill="#1d3a5c">출력</text>
<text x="560" y="254" text-anchor="middle" font-size="12.5" fill="#4f8f68">32 → 32 그대로 유지</text>
<text x="560" y="276" text-anchor="middle" font-size="12" fill="#40556b">테두리 화소도 중앙처럼 대접받는다</text>

<text x="360" y="308" text-anchor="middle" font-size="12.5" fill="#40556b">스케치북 둘레에 빈 여백을 덧대면, 끝까지 도장을 찍을 수 있다</text>
</svg>
