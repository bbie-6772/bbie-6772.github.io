<text x="540" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#4f8f68">다중 헤드 어텐션</text>
<text x="540" y="156" text-anchor="middle" font-size="11.5" fill="#1d3a5c">정규화</text>
<text x="540" y="178" text-anchor="middle" font-size="11.5" fill="#1d3a5c">연결층(MLP)</text>

<path d="M540 200 V226" stroke="#40556b" stroke-width="1.6" marker-end="url(#j)"/>
