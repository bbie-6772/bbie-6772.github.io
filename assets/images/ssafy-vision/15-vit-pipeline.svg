<text x="286" y="192" text-anchor="middle" font-size="11" fill="#c2703c">위치 인코딩이 없으면 순서를 모른다</text>

<path d="M396 132 L428 132" stroke="#40556b" stroke-width="1.6" marker-end="url(#j)"/>

<text x="540" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#40556b">③ ViT 인코더 × L개</text>
<rect x="438" y="88" width="204" height="104" rx="10" fill="#eef4ee" stroke="#4f8f68" stroke-width="1.8"/>
