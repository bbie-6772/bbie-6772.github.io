<rect x="46" y="292" width="624" height="88" rx="10" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.3"/>
<text x="66" y="318" font-size="13" font-weight="700" fill="#1d3a5c">CNN과의 결정적 차이</text>
<text x="66" y="342" font-size="12.5" fill="#40556b">CNN은 층을 깊게 쌓아야 <tspan font-weight="700">겨우</tspan> 전체를 본다 (수용영역을 넓혀가며)</text>
<text x="66" y="366" font-size="12.5" fill="#4f8f68">ViT는 <tspan font-weight="700">첫 층부터</tspan> 모든 패치가 서로를 본다 — 수용영역을 넓힐 필요가 없다</text>
