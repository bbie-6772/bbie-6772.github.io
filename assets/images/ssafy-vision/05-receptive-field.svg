<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="340" rx="12" fill="#f7f9fb"/><text x="360" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">수용영역 — 층을 쌓을수록 한 칸이 보는 범위가 넓어진다</text>

<text x="100" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40556b">입력</text>
<rect x="40" y="88" width="120" height="120" rx="4" fill="#e8eef6" stroke="#3d6fa8" stroke-width="1.4"/>
<g stroke="#3d6fa8" stroke-width="0.6" opacity="0.5"><path d="M60 88 V208 M80 88 V208 M100 88 V208 M120 88 V208 M140 88 V208 M40 108 H160 M40 128 H160 M40 148 H160 M40 168 H160 M40 188 H160"/></g>
<rect x="60" y="108" width="60" height="60" fill="none" stroke="#c2703c" stroke-width="2.4"/>
<text x="100" y="230" text-anchor="middle" font-size="11.5" fill="#c2703c">5×5 영역</text>

<path d="M172 148 L212 148" stroke="#40556b" stroke-width="1.6" marker-end="url(#d)"/>

<text x="280" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40556b">1층 뒤</text>
<rect x="220" y="88" width="120" height="120" rx="4" fill="#eef4ee" stroke="#4f8f68" stroke-width="1.4"/>
<g stroke="#4f8f68" stroke-width="0.6" opacity="0.5"><path d="M240 88 V208 M260 88 V208 M280 88 V208 M300 88 V208 M320 88 V208 M220 108 H340 M220 128 H340 M220 148 H340 M220 168 H340 M220 188 H340"/></g>
<rect x="260" y="108" width="40" height="40" fill="none" stroke="#c2703c" stroke-width="2.4"/>
<text x="280" y="230" text-anchor="middle" font-size="11.5" fill="#c2703c">3×3 영역</text>

<path d="M352 148 L392 148" stroke="#40556b" stroke-width="1.6" marker-end="url(#d)"/>

<text x="460" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#40556b">2층 뒤</text>
<rect x="400" y="88" width="120" height="120" rx="4" fill="#f6ece5" stroke="#c2703c" stroke-width="1.4"/>
<g stroke="#c2703c" stroke-width="0.6" opacity="0.5"><path d="M420 88 V208 M440 88 V208 M460 88 V208 M480 88 V208 M500 88 V208 M400 108 H520 M400 128 H520 M400 148 H520 M400 168 H520 M400 188 H520"/></g>
<rect x="440" y="108" width="20" height="20" fill="#a04040" opacity="0.7"/>
<text x="460" y="230" text-anchor="middle" font-size="11.5" fill="#a04040">한 칸</text>

<rect x="548" y="88" width="132" height="120" rx="10" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.3"/>
<text x="614" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">이 한 칸이</text>
<text x="614" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">원본에서 본 범위</text>
<text x="614" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#a04040">5×5</text>
<text x="614" y="192" text-anchor="middle" font-size="11.5" fill="#40556b">= 수용영역</text>

<text x="60" y="278" font-size="12.5" fill="#1d3a5c">가까이서 보면 선과 색만 보이지만, 뒤로 물러날수록 눈·코가 보이고 결국 얼굴이 보인다.</text>
<text x="60" y="302" font-size="12.5" fill="#40556b">CNN이 깊어진다는 건 이렇게 <tspan font-weight="700">뒤로 물러나며 보는 일</tspan>이다. 지역 정보에서 전체 맥락으로.</text>
<defs><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#40556b"/></marker></defs>
</svg>
