<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="300" rx="12" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d3a5c">같은 문장인데 토큰 수가 두 배 넘게 차이 난다</text>
  <text x="24" y="56" font-size="12" fill="#6b7f95">영어 위주로 설계된 토크나이저는 한국어를 잘게 부순다. 토큰이 많아지면 느려지고 비싸진다.</text>

  <rect x="24" y="74" width="672" height="72" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="98" font-size="12" font-weight="700" fill="#a04040">영어 위주 토크나이저 — 19토큰</text>
  <g font-size="11" fill="#1d3a5c">
    <rect x="40" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="58" y="127">이</text>
    <rect x="98" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="112" y="127">바이트</text>
    <rect x="156" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="170" y="127">바이트</text>
    <rect x="214" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="232" y="127">번</text>
    <rect x="272" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="290" y="127">방</text>
    <rect x="330" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="348" y="127">학</text>
    <rect x="388" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="402" y="127">바이트</text>
    <rect x="446" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="464" y="127">때</text>
    <rect x="504" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="518" y="127">바이트</text>
    <rect x="562" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="580" y="127">뭐</text>
    <rect x="620" y="110" width="52" height="24" rx="4" fill="#f6e6e6" stroke="#a04040"/><text x="638" y="127">해</text>
  </g>

  <rect x="24" y="162" width="672" height="72" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="186" font-size="12" font-weight="700" fill="#3d6fa8">한국어 어휘를 넣어 확장한 토크나이저 — 8토큰</text>
  <g font-size="11" fill="#1d3a5c">
    <rect x="40" y="198" width="88" height="24" rx="4" fill="#dfe9f4" stroke="#3d6fa8"/><text x="66" y="215">이번</text>
    <rect x="134" y="198" width="88" height="24" rx="4" fill="#dfe9f4" stroke="#3d6fa8"/><text x="160" y="215">방학</text>
    <rect x="228" y="198" width="88" height="24" rx="4" fill="#dfe9f4" stroke="#3d6fa8"/><text x="262" y="215">때</text>
    <rect x="322" y="198" width="88" height="24" rx="4" fill="#dfe9f4" stroke="#3d6fa8"/><text x="356" y="215">뭐</text>
    <rect x="416" y="198" width="88" height="24" rx="4" fill="#dfe9f4" stroke="#3d6fa8"/><text x="450" y="215">해</text>
  </g>

  <text x="24" y="264" font-size="11" fill="#6b7f95">토큰이 많다 = 문맥 길이를 더 먹는다 = 추론이 느리고 비용이 오른다</text>
  <text x="24" y="286" font-size="11" font-weight="700" fill="#1d3a5c">작은 모델일수록 이 손해가 크게 느껴진다 — 한국어 특화 모델이 필요한 이유</text>
</svg>
