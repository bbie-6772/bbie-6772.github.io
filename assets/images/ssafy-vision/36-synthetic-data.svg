<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d3a5c">데이터가 없으면 만들어서 쓴다 — 그리고 그 대가</text>

  <rect x="24" y="54" width="672" height="128" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="78" font-size="12" font-weight="700" fill="#3d6fa8">이미지 편집 데이터를 만든 순서</text>
  <g font-size="11">
    <rect x="40" y="94" width="140" height="60" rx="8" fill="#eef3f8" stroke="#d5dde6"/>
    <text x="54" y="118" fill="#1d3a5c">사람이 쓴 편집 지시</text>
    <text x="54" y="138" fill="#6b7f95">약 700건</text>

    <rect x="212" y="94" width="140" height="60" rx="8" fill="#dfe9f4" stroke="#8fb0d4"/>
    <text x="226" y="118" fill="#1d3a5c">그걸로 언어모델을</text>
    <text x="226" y="138" fill="#6b7f95">파인튜닝</text>

    <rect x="384" y="94" width="140" height="60" rx="8" fill="#dfe9f4" stroke="#8fb0d4"/>
    <text x="398" y="118" fill="#1d3a5c">지시문 자동 생성</text>
    <text x="398" y="138" fill="#6b7f95">45만 건 이상</text>

    <rect x="556" y="94" width="140" height="60" rx="8" fill="#dfe9f4" stroke="#3d6fa8"/>
    <text x="570" y="118" fill="#1d3a5c">편집 전후 이미지 쌍</text>
    <text x="570" y="138" fill="#6b7f95">생성 모델로 제작</text>
  </g>
  <g stroke="#3d6fa8" stroke-width="1.6" fill="none" marker-end="url(#arS)">
    <path d="M180 124 H208"/><path d="M352 124 H380"/><path d="M524 124 H552"/>
  </g>

  <rect x="24" y="198" width="330" height="118" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="40" y="222" font-size="12" font-weight="700" fill="#a04040">위험 1 — 라벨 품질의 불일치</text>
  <text x="40" y="246" font-size="11" fill="#6b7f95">같은 물건인데 부르는 이름이 매번 다르다</text>
  <text x="40" y="266" font-size="11" fill="#1d3a5c">기타 → electric guitar / guitar player</text>
  <text x="40" y="292" font-size="11" fill="#3d6fa8">대응 : 라벨 정규화, 클래스 사전, 교차 검증</text>

  <rect x="366" y="198" width="330" height="118" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="382" y="222" font-size="12" font-weight="700" fill="#a04040">위험 2 — 할루시네이션</text>
  <text x="382" y="246" font-size="11" fill="#6b7f95">없는 물체와 불가능한 구조를 만들어낸다</text>
  <text x="382" y="266" font-size="11" fill="#1d3a5c">손가락 6개, 물리적으로 틀린 그림자</text>
  <text x="382" y="292" font-size="11" fill="#3d6fa8">대응 : 후처리 보정, 사실성 검증, 실데이터 혼합</text>

  <defs>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6fa8"/></marker>
  </defs>
</svg>
