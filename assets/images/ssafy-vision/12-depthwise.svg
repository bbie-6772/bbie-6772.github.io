<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="380" rx="12" fill="#f7f9fb"/><text x="360" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">MobileNet — 공간과 채널을 한 번에 하지 말고 나눠서 하자</text>

<text x="170" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#a04040">일반 합성곱 — 한 번에 다 함</text>
<rect x="80" y="96" width="180" height="60" rx="10" fill="#f6ece5" stroke="#c2703c" stroke-width="2"/>
<text x="170" y="122" text-anchor="middle" font-size="12.5" fill="#1d3a5c">Conv 3×3 (C→C)</text>
<text x="170" y="142" text-anchor="middle" font-size="11.5" fill="#a04040">공간 + 채널 동시에</text>
<text x="170" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#a04040">9C²HW</text>

<text x="360" y="150" text-anchor="middle" font-size="18" fill="#40556b">vs</text>

<text x="530" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#4f8f68">깊이별 + 화소별 — 두 단계로 쪼갬</text>
<rect x="440" y="96" width="180" height="46" rx="10" fill="#eef4ee" stroke="#4f8f68" stroke-width="2"/>
<text x="530" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">깊이별 3×3 (채널마다 따로)</text>
<text x="530" y="133" text-anchor="middle" font-size="11" fill="#4f8f68">공간만 담당 · 9CHW</text>
<rect x="440" y="150" width="180" height="46" rx="10" fill="#eef4ee" stroke="#4f8f68" stroke-width="2"/>
<text x="530" y="169" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3a5c">화소별 1×1 (채널 섞기)</text>
<text x="530" y="187" text-anchor="middle" font-size="11" fill="#4f8f68">채널만 담당 · C²HW</text>
<text x="530" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#4f8f68">9CHW + C²HW</text>

<rect x="60" y="244" width="600" height="118" rx="10" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.3"/>
<text x="80" y="270" font-size="13" font-weight="700" fill="#1d3a5c">절감 비율을 손으로 계산해보면</text>
<text x="80" y="298" font-size="13" fill="#40556b">9C²HW ÷ (9CHW + C²HW) = 9C ÷ (9 + C)</text>
<text x="80" y="324" font-size="12.5" fill="#40556b">채널 C가 커질수록 이 값은 <tspan font-weight="700" fill="#4f8f68">9에 수렴</tspan> — 즉 연산량이 약 <tspan font-weight="700" fill="#4f8f68">9분의 1</tspan></text>
<text x="80" y="350" font-size="12.5" fill="#a04040">거대한 서버가 아니라 손 안의 휴대폰에서 딥러닝이 돌기 시작한 지점</text>
</svg>
