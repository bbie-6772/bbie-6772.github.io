<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="360" rx="12" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d3a5c">배치 하나가 곧 문제지 — 정답은 대각선</text>
  <text x="24" y="56" font-size="12" fill="#6b7f95">배치에 이미지-텍스트 쌍 5개를 넣으면 유사도 칸이 25개 생긴다. 5칸만 정답, 20칸은 오답이다.</text>

  <rect x="24" y="72" width="420" height="256" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <g font-size="11" fill="#6b7f95">
    <text x="118" y="108">T1</text><text x="178" y="108">T2</text><text x="238" y="108">T3</text><text x="298" y="108">T4</text><text x="358" y="108">T5</text>
    <text x="76" y="142">I1</text><text x="76" y="182">I2</text><text x="76" y="222">I3</text><text x="76" y="262">I4</text><text x="76" y="302">I5</text>
  </g>
  <g fill="#eef3f8" stroke="#d5dde6">
    <rect x="160" y="120" width="52" height="32" rx="4"/><rect x="220" y="120" width="52" height="32" rx="4"/><rect x="280" y="120" width="52" height="32" rx="4"/><rect x="340" y="120" width="52" height="32" rx="4"/>
    <rect x="100" y="160" width="52" height="32" rx="4"/><rect x="220" y="160" width="52" height="32" rx="4"/><rect x="280" y="160" width="52" height="32" rx="4"/><rect x="340" y="160" width="52" height="32" rx="4"/>
    <rect x="100" y="200" width="52" height="32" rx="4"/><rect x="160" y="200" width="52" height="32" rx="4"/><rect x="280" y="200" width="52" height="32" rx="4"/><rect x="340" y="200" width="52" height="32" rx="4"/>
    <rect x="100" y="240" width="52" height="32" rx="4"/><rect x="160" y="240" width="52" height="32" rx="4"/><rect x="220" y="240" width="52" height="32" rx="4"/><rect x="340" y="240" width="52" height="32" rx="4"/>
    <rect x="100" y="280" width="52" height="32" rx="4"/><rect x="160" y="280" width="52" height="32" rx="4"/><rect x="220" y="280" width="52" height="32" rx="4"/><rect x="280" y="280" width="52" height="32" rx="4"/>
  </g>
  <g>
    <rect x="100" y="120" width="52" height="32" rx="4" fill="#3d6fa8"/>
    <rect x="160" y="160" width="52" height="32" rx="4" fill="#3d6fa8"/>
    <rect x="220" y="200" width="52" height="32" rx="4" fill="#3d6fa8"/>
    <rect x="280" y="240" width="52" height="32" rx="4" fill="#3d6fa8"/>
    <rect x="340" y="280" width="52" height="32" rx="4" fill="#3d6fa8"/>
  </g>

  <rect x="464" y="72" width="232" height="256" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <rect x="480" y="96" width="20" height="14" rx="3" fill="#3d6fa8"/>
  <text x="510" y="108" font-size="12" font-weight="700" fill="#1d3a5c">정답 쌍 (N칸)</text>
  <text x="480" y="130" font-size="11" fill="#6b7f95">같은 사진과 같은 설명. 점수를 올린다.</text>
  <rect x="480" y="152" width="20" height="14" rx="3" fill="#eef3f8" stroke="#d5dde6"/>
  <text x="510" y="164" font-size="12" font-weight="700" fill="#1d3a5c">오답 쌍 (나머지 전부)</text>
  <text x="480" y="186" font-size="11" fill="#6b7f95">남의 설명. 점수를 내린다.</text>
  <text x="480" y="218" font-size="11" fill="#1d3a5c">배치가 커질수록 오답이 제곱으로 늘어</text>
  <text x="480" y="236" font-size="11" fill="#1d3a5c">문제가 어려워지고, 그만큼 잘 배운다.</text>
  <text x="480" y="264" font-size="11" font-weight="700" fill="#a04040">사람이 라벨을 달지 않는다</text>
  <text x="480" y="284" font-size="11" fill="#6b7f95">웹에서 긁은 사진-문장 쌍이 곧 정답표다.</text>
  <text x="480" y="308" font-size="11" fill="#6b7f95">CLIP은 이 쌍을 4억 개 모아 학습했다.</text>
</svg>
