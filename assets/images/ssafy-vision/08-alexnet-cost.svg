<text x="360" y="72" font-size="12.5" font-weight="700" fill="#c2703c">파라미터 (K)</text>
<text x="360" y="90" font-size="11" fill="#40556b">완전연결층에 몰림</text>
<g>
<rect x="300" y="198" width="20" height="2" fill="#eec9a8"/>
