<text x="600" y="72" font-size="12.5" font-weight="700" fill="#4f8f68">연산량 (M FLOPs)</text>
<text x="600" y="90" font-size="11" fill="#40556b">합성곱층에 몰림</text>
<g>
<rect x="540" y="177" width="20" height="23" fill="#4f8f68"/><text x="550" y="171" text-anchor="middle" font-size="9.5" fill="#40556b">105</text>
