<rect x="60" y="244" width="600" height="130" rx="10" fill="#eaf0f7" stroke="#3d6fa8" stroke-width="1.3"/>
<text x="80" y="272" font-size="13" font-weight="700" fill="#1d3a5c">읽는 법 — 어디를 깎아야 하는지가 여기서 갈린다</text>
<text x="80" y="300" font-size="12.5" fill="#40556b">· 메모리가 부족하다 → <tspan font-weight="700" fill="#3d6fa8">앞쪽 합성곱층</tspan>의 해상도를 줄여라 (특징 맵이 크다)</text>
<text x="80" y="324" font-size="12.5" fill="#40556b">· 모델 파일이 너무 크다 → <tspan font-weight="700" fill="#c2703c">완전연결층</tspan>을 줄여라 (파라미터가 여기 다 있다)</text>
<text x="80" y="348" font-size="12.5" fill="#40556b">· 추론이 느리다 → <tspan font-weight="700" fill="#4f8f68">합성곱층</tspan>을 줄여라 (곱셈이 여기서 일어난다)</text>
<text x="80" y="368" font-size="11.5" fill="#a04040">셋은 서로 다른 문제다. "모델을 줄인다"는 말은 그래서 항상 되물어야 한다</text>
</svg>
