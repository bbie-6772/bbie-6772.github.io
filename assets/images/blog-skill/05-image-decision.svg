<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="360" rx="12" fill="#f7f9fb"/>
<text x="360" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">그림을 만들기 전에 던지는 질문 하나</text>

<rect x="228" y="54" width="264" height="38" rx="19" fill="#1d3a5c"/>
<text x="360" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">이 세상에 실물이 존재하는가?</text>

<path d="M360 92 L360 108 M170 108 L550 108 M170 108 L170 128 M550 108 L550 128" fill="none" stroke="#c9d4e0" stroke-width="1.6"/>
<text x="248" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#3d6fa8">있다</text>
<text x="472" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7f95">없다</text>

<g>
<rect x="40" y="128" width="260" height="164" rx="10" fill="#fff" stroke="#3d6fa8" stroke-width="1.8"/>
<text x="170" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d6fa8">사용자에게 요청한다</text>
<line x1="64" y1="166" x2="276" y2="166" stroke="#e2e9f0" stroke-width="1"/>
<text x="64" y="188" font-size="11" fill="#1d3a5c">· 에러 메시지 · 터미널 로그</text>
<text x="64" y="209" font-size="11" fill="#1d3a5c">· 실행 결과 · 동작하는 화면</text>
<text x="64" y="230" font-size="11" fill="#1d3a5c">· 콘솔 · 대시보드 · 설정 화면</text>
<text x="64" y="251" font-size="11" fill="#1d3a5c">· 팀에서 공유받은 자료</text>
<text x="170" y="277" text-anchor="middle" font-size="10.5" fill="#6b7f95">"무엇이 찍혀 있어야 하는지"까지 적어서</text>
</g>

<g>
<rect x="420" y="128" width="260" height="164" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.5"/>
<text x="550" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d3a5c">직접 그린다</text>
<line x1="444" y1="166" x2="656" y2="166" stroke="#e2e9f0" stroke-width="1"/>
<text x="444" y="188" font-size="11" fill="#1d3a5c">· 개념 설명 · 비유를 그린 것</text>
<text x="444" y="209" font-size="11" fill="#1d3a5c">· 수치 비교 그래프</text>
<text x="444" y="230" font-size="11" fill="#1d3a5c">· 흐름도 · 구성도</text>
<text x="444" y="251" font-size="11" fill="#1d3a5c">· 대외비 자료를 대체할 재구성</text>
<text x="550" y="277" text-anchor="middle" font-size="10.5" fill="#6b7f95">그림 하나에 하고 싶은 말은 하나만</text>
</g>

<rect x="40" y="306" width="640" height="40" rx="10" fill="#fff" stroke="#a04040" stroke-width="1.4"/>
<text x="360" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="#a04040">실물이 있는데 비슷하게 그려내면, 그건 없는 증거를 만드는 일이다</text>
</svg>
