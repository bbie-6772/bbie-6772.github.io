<text x="530" y="55" font-size="10.5" fill="#3d6fa8">7월 이후 55편</text>

<g font-size="11.5" fill="#1d3a5c">
<text x="150" y="86" text-anchor="end" font-weight="700">인용 강조</text>
<rect x="165" y="76" width="14" height="13" rx="3" fill="#b9c6d4"/>
<text x="186" y="87" font-size="10" fill="#8a9aab">0.4</text>
<rect x="165" y="94" width="360" height="13" rx="3" fill="#3d6fa8"/>
<text x="533" y="105" font-size="10" font-weight="700" fill="#3d6fa8">9.8</text>
<text x="640" y="97" font-size="13" font-weight="700" fill="#a04040">24배</text>

<text x="150" y="150" text-anchor="end" font-weight="700">번호 붙은 섹션</text>
<rect x="165" y="140" width="4" height="13" rx="2" fill="#b9c6d4"/>
<text x="176" y="151" font-size="10" fill="#8a9aab">0.04</text>
<rect x="165" y="158" width="360" height="13" rx="3" fill="#3d6fa8"/>
<text x="533" y="169" font-size="10" font-weight="700" fill="#3d6fa8">4.5</text>
<text x="640" y="161" font-size="13" font-weight="700" fill="#a04040">112배</text>

<text x="150" y="214" text-anchor="end">표 (줄)</text>
<rect x="165" y="204" width="38" height="13" rx="3" fill="#b9c6d4"/>
<text x="211" y="215" font-size="10" fill="#8a9aab">2.6</text>
<rect x="165" y="222" width="360" height="13" rx="3" fill="#3d6fa8"/>
