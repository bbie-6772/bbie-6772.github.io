</g>

<line x1="40" y1="318" x2="680" y2="318" stroke="#d5dde6" stroke-width="1"/>
<text x="360" y="340" text-anchor="middle" font-size="11.5" fill="#1d3a5c">문체는 7월 이전이 내 것, 구조는 7월 이후가 읽힌다 — 둘은 다른 문제였다</text>
</svg>
