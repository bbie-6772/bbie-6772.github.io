<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="360" rx="12" fill="#f7f9fb"/>
<text x="360" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">가독성의 정체 — 7월 전후 편당 구조 요소</text>

<rect x="392" y="46" width="12" height="10" rx="2" fill="#b9c6d4"/>
<text x="410" y="55" font-size="10.5" fill="#6b7f95">7월 이전 161편</text>
