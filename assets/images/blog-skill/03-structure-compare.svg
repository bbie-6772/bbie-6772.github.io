<text x="644" y="225" font-size="12" fill="#a04040">9배</text>

<text x="150" y="278" text-anchor="end">구분선</text>
<rect x="165" y="268" width="64" height="13" rx="3" fill="#b9c6d4"/>
<text x="237" y="279" font-size="10" fill="#8a9aab">1.1</text>
<rect x="165" y="286" width="360" height="13" rx="3" fill="#3d6fa8"/>
<text x="533" y="297" font-size="10" fill="#3d6fa8">6.2</text>
