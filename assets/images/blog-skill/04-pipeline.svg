<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="720" height="320" rx="12" fill="#f7f9fb"/>
<text x="360" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3a5c">글 쓰는 절차를 파일 세 개로 — 무엇이 어디에 붙는가</text>

<g>
<rect x="26" y="64" width="118" height="46" rx="9" fill="#fff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="85" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">1. 조사</text>
<text x="85" y="101" text-anchor="middle" font-size="10" fill="#6b7f95">사실 모으기</text>

<rect x="160" y="64" width="118" height="46" rx="9" fill="#1d3a5c"/>
<text x="219" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2. 질의응답</text>
<text x="219" y="101" text-anchor="middle" font-size="10" fill="#b9c6d4">묻고 듣기</text>

<rect x="294" y="64" width="118" height="46" rx="9" fill="#fff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="353" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">3. 초안</text>
<text x="353" y="101" text-anchor="middle" font-size="10" fill="#6b7f95">받아쓰기</text>

<rect x="428" y="64" width="118" height="46" rx="9" fill="#fff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="487" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">4. 검토</text>
<text x="487" y="101" text-anchor="middle" font-size="10" fill="#6b7f95">기계 + 사람</text>

<rect x="562" y="64" width="118" height="46" rx="9" fill="#fff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="621" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1d3a5c">5. 확정</text>
<text x="621" y="101" text-anchor="middle" font-size="10" fill="#6b7f95">고쳐서 배포</text>

<path d="M144 87 L158 87 M278 87 L292 87 M412 87 L426 87 M546 87 L560 87" stroke="#8fb0d4" stroke-width="1.8"/>
</g>

<path d="M219 110 L219 148" stroke="#1d3a5c" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M353 110 L353 148" stroke="#8fb0d4" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M487 110 L487 148" stroke="#8fb0d4" stroke-width="1.6" stroke-dasharray="4 3"/>

<g>
<rect x="140" y="148" width="158" height="72" rx="10" fill="#fff" stroke="#1d3a5c" stroke-width="1.6"/>
<text x="219" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d3a5c">나만 아는 것</text>
<text x="219" y="192" text-anchor="middle" font-size="10.5" fill="#6b7f95">생각 · 감정 · 헷갈린 곳</text>
<text x="219" y="209" text-anchor="middle" font-size="10.5" fill="#6b7f95">파일에 적을 수 없다</text>

<rect x="274" y="148" width="158" height="72" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="353" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">voice.md</text>
<text x="353" y="192" text-anchor="middle" font-size="10.5" fill="#6b7f95">말투 수치와 규칙</text>
<text x="353" y="209" text-anchor="middle" font-size="10.5" fill="#6b7f95">161편에서 뽑았다</text>

<rect x="408" y="148" width="158" height="72" rx="10" fill="#fff" stroke="#d5dde6" stroke-width="1.4"/>
<text x="487" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3d6fa8">lint.py</text>
<text x="487" y="192" text-anchor="middle" font-size="10.5" fill="#6b7f95">서식 검사기</text>
<text x="487" y="209" text-anchor="middle" font-size="10.5" fill="#6b7f95">지난 사고를 규칙으로</text>
</g>

<rect x="26" y="244" width="668" height="52" rx="10" fill="#fff" stroke="#a04040" stroke-width="1.4"/>
<text x="360" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#a04040">2단계를 건너뛰면 말투만 같고 생각이 없는 글이 나온다</text>
<text x="360" y="286" text-anchor="middle" font-size="10.5" fill="#6b7f95">규칙은 흉내를 낼 뿐이다. 무슨 생각을 했는지는 어떤 파일에도 적혀 있지 않다</text>
</svg>
