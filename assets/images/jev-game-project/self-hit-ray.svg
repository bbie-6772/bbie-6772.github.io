<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="Pretendard, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="360" fill="#f7f9fb"/>

  <!-- 왼쪽: 기존 -->
  <rect x="20" y="20" width="330" height="280" rx="10" fill="#ffffff" stroke="#d5dde6" stroke-width="1.5"/>
  <text x="185" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">기존 Physics.Raycast</text>
  <rect x="60" y="80" width="70" height="110" rx="35" fill="#eaf1f9" stroke="#8fb0d4"/>
  <text x="95" y="208" text-anchor="middle" font-size="11" fill="#6b7f95">내 몸</text>
  <polygon points="262,95 320,88 334,140 318,186 266,180 254,138" fill="#e9e4dc" stroke="#b8ab98"/>
  <text x="294" y="140" text-anchor="middle" font-size="11" fill="#6b7f95">Rock</text>
  <line x1="95" y1="105" x2="252" y2="105" stroke="#d5dde6" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="95" cy="105" r="5" fill="#1d3a5c"/>
  <circle cx="95" cy="105" r="11" fill="none" stroke="#a04040" stroke-width="2"/>
  <text x="185" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#a04040">first = 내 몸 @0.0</text>
  <text x="185" y="260" text-anchor="middle" font-size="12" fill="#6b7f95">→ "자기 자신이면 무시"에서 버려짐</text>
  <text x="185" y="282" text-anchor="middle" font-size="12" fill="#a04040">121 / 121 내 몸</text>

  <!-- 오른쪽: 수정 -->
  <rect x="370" y="20" width="330" height="280" rx="10" fill="#ffffff" stroke="#3d6fa8" stroke-width="1.5"/>
  <text x="535" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a5c">RaycastInteract</text>
  <rect x="410" y="80" width="70" height="110" rx="35" fill="#f7f9fb" stroke="#d5dde6" stroke-dasharray="4 3"/>
  <text x="445" y="208" text-anchor="middle" font-size="11" fill="#6b7f95">내 몸 (건너뜀)</text>
  <polygon points="612,95 670,88 684,140 668,186 616,180 604,138" fill="#e9e4dc" stroke="#b8ab98"/>
  <text x="644" y="140" text-anchor="middle" font-size="11" fill="#6b7f95">Rock</text>
  <line x1="445" y1="105" x2="606" y2="105" stroke="#3d6fa8" stroke-width="2"/>
  <circle cx="445" cy="105" r="5" fill="#1d3a5c"/>
  <circle cx="608" cy="105" r="9" fill="none" stroke="#3d6fa8" stroke-width="2"/>
  <text x="535" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#3d6fa8">first = Rock_North</text>
  <text x="535" y="260" text-anchor="middle" font-size="12" fill="#6b7f95">IsChildOf(transform)인 히트는 건너뜀</text>
  <text x="535" y="282" text-anchor="middle" font-size="12" fill="#3d6fa8">121 / 121 바위</text>

  <text x="360" y="326" text-anchor="middle" font-size="13" fill="#1d3a5c">시작점은 성공·실패 모두 내 콜라이더 안. 일부 위치에서만 첫 히트가 거리 0의 내 몸이 됐다.</text>
  <text x="360" y="346" text-anchor="middle" font-size="11" fill="#6b7f95">개념도. 숫자는 실패 위치 주변 1cm 간격 121개 지점 비교. 크기 비율은 실제와 다르다.</text>
</svg>
